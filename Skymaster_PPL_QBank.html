nds to increase the rate of water loss from the body.", "b": "Moist air at altitude helps retain the body's moisture.", "c": "Temperature decreases with altitude.", "d": "High altitude reduces appetite and fluid intake."}, {"id": 90, "question": "Motion sickness is caused by:", "correct": "a", "a": "Continued stimulation of the tiny portion of the inner ear which controls sense of balance.", "b": "Instability in the brain cells which affect balance and will generally be overcome with experience.", "c": "The movement of an aircraft causing the stomach to create an acid substance which causes the stomach lining to contract.", "d": "Excessive vibration transmitted through the airframe."}, {"id": 91, "question": "What suggestion could you make to a fellow pilot who is experiencing motion sickness?", "correct": "a", "a": "Avoid unnecessary head movement and keep their eyes on a point outside the aircraft.", "b": "Recommend taking medication to prevent motion sickness.", "c": "Lower their head, shut their eyes, and take deep breaths.", "d": "Ask them to focus on the instrument panel."}, {"id": 92, "question": "In an unpressurised aircraft, at high altitudes the amount of oxygen that diffuses across the lung membranes into the blood is:", "correct": "a", "a": "Decreased because of the low partial pressure of oxygen.", "b": "Decreased because of the lower temperatures.", "c": "Unchanged compared to that at sea level.", "d": "Increased due to greater breathing effort."}, {"id": 93, "question": "During a climb to 18,000 ft, the percentage of oxygen in the atmosphere:", "correct": "a", "a": "Remains the same.", "b": "Increases.", "c": "Decreases.", "d": "Varies with humidity."}, {"id": 94, "question": "Although not required, supplemental oxygen is recommended for use when flying at night above:", "correct": "a", "a": "1,500 m (5,000 ft).", "b": "3,050 m (10,000 ft).", "c": "3,800 m (12,500 ft).", "d": "4,500 m (15,000 ft)."}, {"id": 95, "question": "Hypoxia is the result of:", "correct": "a", "a": "Shortage of oxygen in the body.", "b": "Insufficient oxygen in the air.", "c": "Excessive nitrogen in the bloodstream.", "d": "Reduced cardiac output."}, {"id": 96, "question": "Which statement concerning hypoxia is true?", "correct": "a", "a": "Tingling of the skin and a false sense of security may be symptoms of hypoxia.", "b": "Hypoxia is caused by nitrogen bubbles in the joints and bloodstream.", "c": "Forcing oneself to concentrate on the flight instruments will help to overcome the effects of hypoxia.", "d": "Hypoxia only occurs above 18,000 ft."}, {"id": 97, "question": "Which occurs when climbing above 18,000 feet in an unpressurized aircraft without supplemental oxygen?", "correct": "a", "a": "The oxygen pressure within the lungs cannot be maintained without an increase in inhaled oxygen pressure.", "b": "Gases trapped in the body contract and prevent nitrogen from escaping the bloodstream.", "c": "The pressure in the middle ear becomes less than the atmospheric pressure in the cabin.", "d": "Carbon monoxide levels in the blood increase rapidly."}, {"id": 98, "question": "Susceptibility to carbon monoxide poisoning increases as:", "correct": "a", "a": "Altitude increases.", "b": "Altitude decreases.", "c": "Air pressure increases.", "d": "Humidity decreases."}, {"id": 99, "question": "Carbon monoxide in an aircraft cabin is:", "correct": "a", "a": "Difficult to recognize because of its odorless and colorless nature.", "b": "Easily recognizable because of its peculiar odor.", "c": "Easily recognizable because of its peculiar color.", "d": "Detectable by a slight sweet taste in the mouth."}, {"id": 100, "question": "Large accumulations of carbon monoxide in the human body result in:", "correct": "a", "a": "Loss of muscular power.", "b": "Tightness across the forehead.", "c": "An increased sense of well-being.", "d": "Rapid eye movement and visual disturbance."}, {"id": 101, "question": "What is one effect smoking has on a pilot?", "correct": "a", "a": "Increases body heat which, in turn, creates a demand for more oxygen.", "b": "Decreases night vision by 50 percent.", "c": "Creates additional carbon dioxide gases in the body which often leads to hyperventilation.", "d": "Reduces the heart rate during high-workload phases."}, {"id": 102, "question": "Which would most likely result in hyperventilation?", "correct": "a", "a": "Emotional tension, anxiety, or fear.", "b": "The excessive consumption of alcohol.", "c": "An extremely slow rate of breathing and insufficient oxygen.", "d": "Flying at very low altitudes in warm weather."}, {"id": 103, "question": "Rapid or extra deep breathing while using oxygen can cause a condition known as:", "correct": "a", "a": "Hyperventilation.", "b": "Aerosinusitis.", "c": "Aerotitis.", "d": "Hypoxia."}, {"id": 104, "question": "Hyperventilation results from:", "correct": "a", "a": "A lack of carbon dioxide in the body.", "b": "Flying too high without supplemental oxygen.", "c": "Breathing too rapidly causing a lack of oxygen.", "d": "A surplus of nitrogen in the bloodstream."}, {"id": 105, "question": "A pilot should be able to overcome the symptoms or avoid future occurrences of hyperventilation by:", "correct": "a", "a": "Slowing the breathing rate, breathing into a bag, or talking aloud.", "b": "Closely monitoring the flight instruments to control the airplane.", "c": "Increasing the breathing rate in order to increase lung ventilation.", "d": "Applying supplemental oxygen immediately."}, {"id": 106, "question": "If an individual has gone scuba diving which has NOT required a controlled ascent and will be flying to cabin pressure altitudes of 8,000 feet or less, the recommended waiting time is at least:", "correct": "a", "a": "4 hours.", "b": "12 hours.", "c": "24 hours.", "d": "1 hour."}, {"id": 107, "question": "If an individual has gone scuba diving which HAS required a controlled ascent and will be flying to cabin pressure altitudes of 8,000 feet or less, the recommended waiting time is at least:", "correct": "a", "a": "24 hours.", "b": "4 hours.", "c": "12 hours.", "d": "48 hours."}, {"id": 108, "question": "Dark adaptation is impaired by exposure to:", "correct": "a", "a": "Cabin pressure altitudes above 5,000 feet.", "b": "Carbon dioxide.", "c": "Vitamin A in the diet.", "d": "Low-level artificial lighting."}, {"id": 109, "question": "What preparation should a pilot make to adapt the eyes for night flying?", "correct": "a", "a": "Avoid bright white lights at least 30 minutes before the flight.", "b": "Wear sunglasses after sunset until ready for flight.", "c": "Avoid red lights at least 30 minutes before the flight.", "d": "Stare at a bright screen to stimulate the rods."}, {"id": 110, "question": "One aid in increasing night vision effectiveness would be to:", "correct": "a", "a": "Force the eyes to view off center.", "b": "Look directly at objects.", "c": "Increase intensity of interior lighting.", "d": "Blink rapidly to refresh the retina."}, {"id": 111, "question": "What is the most effective way to use the eyes during night flight?", "correct": "a", "a": "Scan slowly to permit off-center viewing.", "b": "Look only at far away, dim lights.", "c": "Concentrate directly on each object for a few seconds.", "d": "Use a narrow focused gaze on the instrument panel."}, {"id": 112, "question": "The most effective technique to use for detecting other aircraft at night is to:", "correct": "a", "a": "Turn the head and sweep the eyes rapidly over the entire visible region.", "b": "Avoid scanning the region below the horizon so as to avoid the effect of ground light on the eyes.", "c": "Stare directly at any point where another aircraft is suspected to be flying.", "d": "Keep eyes fixed on the horizon at all times."}, {"id": 113, "question": "The best method to use when looking for other traffic at night is to:", "correct": "a", "a": "Look to the side of the object and scan slowly.", "b": "Scan the visual field very rapidly.", "c": "Look to the side of the object and scan rapidly.", "d": "Fix the gaze directly on the suspected position."}, {"id": 114, "question": "Prior to starting each maneuver, pilots should:", "correct": "a", "a": "Visually scan the entire area for collision avoidance.", "b": "Check altitude, airspeed, and heading indications.", "c": "Announce their intentions on the nearest CTAF.", "d": "Confirm clearance from ATC."}, {"id": 115, "question": "Which technique should a pilot use to scan for traffic to the right and left during straight-and-level flight?", "correct": "a", "a": "Systematically focus on different segments of the sky for short intervals.", "b": "Continuous sweeping of the windshield from right to left.", "c": "Concentrate on relative movement detected in the peripheral vision area.", "d": "Keep eyes on a fixed point outside and scan using only peripheral vision."}, {"id": 116, "question": "What effect does haze have on the ability to see traffic or terrain features during flight?", "correct": "a", "a": "All traffic or terrain features appear to be farther away than their actual distance.", "b": "Haze causes the eyes to focus at infinity.", "c": "The eyes tend to overwork in haze and do not detect relative movement easily.", "d": "Haze has no effect on visual perception."}, {"id": 117, "question": "A state of temporary confusion resulting from misleading information being sent to the brain by various sensory organs is defined as:", "correct": "a", "a": "Spatial disorientation.", "b": "Hyperventilation.", "c": "Hypoxia.", "d": "Tunnel vision."}, {"id": 118, "question": "Which procedure is recommended to prevent or overcome spatial disorientation?", "correct": "a", "a": "Rely entirely on the indications of the flight instruments.", "b": "Avoid steep turns and rough control movements.", "c": "Reduce head and eye movements to the greatest extent possible.", "d": "Increase scan rate of instruments and visual cues."}, {"id": 119, "question": "Pilots are more subject to spatial disorientation if:", "correct": "a", "a": "Body signals are used to interpret flight attitude.", "b": "They ignore the sensations of muscles and inner ear.", "c": "Eyes are moved often in the process of cross-checking the flight instruments.", "d": "They maintain a high workload throughout the flight."}, {"id": 120, "question": "The danger of spatial disorientation during flight in poor visual conditions may be reduced by:", "correct": "a", "a": "Having faith in the instruments rather than taking a chance on the sensory organs.", "b": "Shifting the eyes quickly between the exterior visual field and the instrument panel.", "c": "Leaning the body in the opposite direction of the motion of the aircraft.", "d": "Increasing altitude to obtain better visual references."}, {"id": 121, "question": "If a pilot experiences spatial disorientation during flight in a restricted visibility condition, the best way to overcome the effect is to:", "correct": "a", "a": "Rely upon the aircraft instrument indications.", "b": "Concentrate on yaw, pitch, and roll sensations.", "c": "Consciously slow the breathing rate until symptoms clear and then resume normal breathing rate.", "d": "Immediately request radar vectors from ATC."}, {"id": 122, "question": "A rapid acceleration can create the illusion of being in a:", "correct": "a", "a": "Nose up attitude.", "b": "Left turn.", "c": "Nose down attitude.", "d": "Right turn."}, {"id": 123, "question": "Who is responsible for determining whether a pilot is fit to fly for a particular flight, even though he or she holds a current medical certificate?", "correct": "a", "a": "The pilot.", "b": "The medical examiner.", "c": "The aviation authority.", "d": "The aircraft operator."}, {"id": 124, "question": "What is the one common factor which affects most preventable accidents?", "correct": "a", "a": "Human error.", "b": "Mechanical malfunction.", "c": "Structural failure.", "d": "Weather-related causes."}, {"id": 125, "question": "What is one of the neglected items when a pilot relies on short and long term memory for repetitive tasks?", "correct": "a", "a": "Checklists.", "b": "Situation awareness.", "c": "Flying outside the envelope.", "d": "Radio communication."}, {"id": 126, "question": "Consistent adherence to approved checklists is a sign of:", "correct": "a", "a": "A disciplined and competent pilot.", "b": "A pilot who lacks the required knowledge.", "c": "A low-hours pilot.", "d": "Poor situational awareness."}, {"id": 127, "question": "To avoid missing important steps, always use the:", "correct": "a", "a": "Appropriate checklists.", "b": "Placarded airspeeds.", "c": "Airworthiness certificate.", "d": "Pilot Operating Handbook from memory."}, {"id": 128, "question": "The positive three-step process in the exchange of flight controls between pilots includes these verbal steps: (a) You have the flight controls, (b) I have the flight controls, and (c) ________", "correct": "a", "a": "You have the flight controls.", "b": "I have the aircraft.", "c": "I have the flight controls.", "d": "Controls confirmed."}, {"id": 129, "question": "Risk management, as a part of aeronautical decision making (ADM) process, relies on which features to reduce the risk associated with each flight?", "correct": "a", "a": "Situational awareness, problem recognition, and good judgment.", "b": "Application of stress management and risk element procedures.", "c": "The mental process of analyzing all information in a particular situation and making a timely decision on what action to take.", "d": "Regulatory compliance and minimum fuel planning."}, {"id": 130, "question": "Hazardous attitudes occur to every pilot to some degree at some time. What are some of these hazardous attitudes?", "correct": "a", "a": "Antiauthority, impulsivity, macho, resignation, and invulnerability.", "b": "Poor risk management and lack of stress management.", "c": "Poor situational awareness, snap judgments, and lack of a decision making process.", "d": "Overconfidence, recklessness, and inattention."}, {"id": 131, "question": "In the aeronautical decision making (ADM) process, what is the first step in neutralizing a hazardous attitude?", "correct": "a", "a": "Recognizing hazardous thoughts.", "b": "Making a rational judgment.", "c": "Recognizing the invulnerability of the situation.", "d": "Consulting the checklist."}, {"id": 132, "question": "What is the antidote when a pilot has a hazardous attitude, such as 'Impulsivity'?", "correct": "a", "a": "Not so fast, think first.", "b": "It could happen to me.", "c": "Do it quickly to get it over with.", "d": "Follow the rules."}, {"id": 133, "question": "What is the antidote when a pilot has a hazardous attitude, such as 'Antiauthority'?", "correct": "a", "a": "Follow the rules.", "b": "Rules do not apply in this situation.", "c": "I know what I am doing.", "d": "I'll decide for myself."}, {"id": 134, "question": "What is the antidote when a pilot has the hazardous attitude of 'Invulnerability'?", "correct": "a", "a": "It could happen to me.", "b": "It cannot be that bad.", "c": "It will not happen to me.", "d": "I have handled this before."}, {"id": 135, "question": "At altitude the pressure of oxygen in the atmosphere is:", "correct": "a", "a": "Lower than at MSL.", "b": "The same as at mean sea level (MSL).", "c": "Higher than at MSL.", "d": "Unaffected, as partial pressure is independent of altitude."}, {"id": 136, "question": "Being badly overweight increases a pilot's susceptibility to which of the following conditions?", "correct": "d", "a": "Heart attack.", "b": "Hypoxia at higher altitudes.", "c": "Hypothermia.", "d": "All of the above."}, {"id": 137, "question": "Errors may be isolated or cumulative. Which statement about errors is correct?", "correct": "a", "a": "May be isolated or cumulative.", "b": "Are isolated with no further consequence or influence.", "c": "Are cumulative, one error leads to a second, which leads to a third etc.", "d": "Are always part of the error chain."}, {"id": 138, "question": "Which statement is true regarding alcohol in the human system?", "correct": "a", "a": "Alcohol renders a pilot more susceptible to hypoxia.", "b": "Small amounts of alcohol will not impair flying skills.", "c": "Coffee helps metabolize alcohol and alleviates a hangover.", "d": "Alcohol only affects performance if consumed within 4 hours of flying."}, {"id": 139, "question": "Which statement best defines hypoxia?", "correct": "a", "a": "A state of oxygen deficiency in the body.", "b": "An abnormal increase in the volume of air breathed.", "c": "A condition of gas bubble formation around the joints or muscles.", "d": "A state of excessive nitrogen in the blood."}, {"id": 140, "question": "A person may not act as a crewmember of a civil aircraft if alcoholic beverages have been consumed by that person within the preceding:", "correct": "a", "a": "8 hours.", "b": "12 hours.", "c": "24 hours.", "d": "4 hours."}, {"id": 141, "question": "An illusion that an aircraft is at a higher altitude than it actually is, is produced by:", "correct": "a", "a": "Downsloping terrain.", "b": "Upsloping terrain.", "c": "Atmospheric haze.", "d": "Narrower than normal runway."}, {"id": 142, "question": "The three-needle type altimeter used in many light aircraft is:", "correct": "a", "a": "Easy to mis-read and accurate and reliable.", "b": "Hardly ever mis-read.", "c": "Easy to mis-read only.", "d": "Not very accurate or reliable."}, {"id": 143, "question": "Which of the following are terms generally used to describe a type or types of memory within the subject of Human Performance and Limitations?", "correct": "a", "a": "Long-term memory.", "b": "Sensitive memory.", "c": "Felicitous memory.", "d": "All of them."}, {"id": 144, "question": "The outer, middle and inner ear are filled with:", "correct": "a", "a": "Air, air, and liquid, respectively.", "b": "Air, liquid, and liquid, respectively.", "c": "Liquid, air, and air, respectively.", "d": "Liquid, liquid, and air, respectively."}, {"id": 145, "question": "Presbycusis is an impairment of hearing due to:", "correct": "a", "a": "Age.", "b": "Damage to the cochlea.", "c": "Damage to the semi-circular canals.", "d": "Smoking."}, {"id": 146, "question": "What causes conductive deafness?", "correct": "a", "a": "Damage to the ossicles or the eardrum.", "b": "Damage to the outer ear.", "c": "Damage to the pinna.", "d": "Damage to the middle ear."}, {"id": 147, "question": "In which part of the eye is visual acuity at its highest?", "correct": "a", "a": "The Fovea.", "b": "The Retina.", "c": "The Pupil.", "d": "The Cornea."}, {"id": 148, "question": "In order to see a sharp image of an oncoming aircraft which has been detected by the eye, a pilot should:", "correct": "a", "a": "Look directly at the oncoming aircraft.", "b": "Look to one side of the oncoming aircraft.", "c": "Commence a systematic scan of the airspace in front of him.", "d": "Blink several times to make the image clearer."}, {"id": 149, "question": "The amount of light entering the eye is controlled by the:", "correct": "a", "a": "Iris.", "b": "Cornea.", "c": "Lens.", "d": "Pupil."}, {"id": 150, "question": "The pulse is generated by the contraction of which heart chamber?", "correct": "a", "a": "Left Ventricle.", "b": "Left Auricle.", "c": "Right Ventricle.", "d": "Right Auricle."}] },
  airlaw: { code:"AIR LAW", name:"Air Law", questions:[{"id": 1, "question": "Which of the following documents is not required to be carried in an aircraft of an ICAO member state?", "correct": "a", "a": "Flight crew birth certificates.", "b": "Certificate of Registration.", "c": "Certificate of Airworthiness.", "d": "Flight crew licences."}, {"id": 2, "question": "The State of licence issue of a JAA PPL may be changed to a new member State providing:", "correct": "a", "a": "The new member State is the licence holder's normal State of residence or that full-time employment has been taken by the licence holder in that State.", "b": "The licence holder has resided in the new member State for at least 31 days.", "c": "The licence holder intends to follow a course of study in the new member State lasting at least three months.", "d": "The new member State has no reasonable grounds for refusing to convert the licence."}, {"id": 3, "question": "No aircraft or personnel who have endorsed certificates or licences may participate in international navigation:", "correct": "d", "a": "Except with the permission of the State whose territory is entered.", "b": "Under any circumstances.", "c": "Except when a general exemption has been awarded by any ICAO contracting state.", "d": "Except when a general exemption has been awarded by the State in which the aircraft is registered or which issued the licence."}, {"id": 4, "question": "Which right is conferred on contracting states by Article 16 of the ICAO Convention?", "correct": "a", "a": "The right to search, without unreasonable delay, an aircraft from another contracting state landing on or departing from its sovereign territory.", "b": "The right to search an aircraft from another contracting state landing on or departing from its sovereign territory if it is felt that the aircraft is carrying unlawful goods or persons being pursued in law.", "c": "The right to search an aircraft from another contracting state landing on or departing from its sovereign territory, given due cause.", "d": "The right to search, with the permission of the pilot in command, an aircraft from another contracting state landing on or departing from its sovereign territory."}, {"id": 5, "question": "The Rules of the Air applicable to an aircraft registered in one state flying over another state shall be:", "correct": "a", "a": "Those of the state whose airspace is entered and transited.", "b": "Those of the state of the visiting aircraft.", "c": "Those agreed by ICAO contracting states to apply in all contracting states.", "d": "Those stipulated by JAA operational procedures."}, {"id": 6, "question": "Which classes of medical certificate meet the requirement for a JAA PPL(A)?", "correct": "a", "a": "Class 1 or 2.", "b": "Class A or B.", "c": "Class 2 or 3.", "d": "Class B or C."}, {"id": 7, "question": "Which body is responsible for ensuring that an aircraft operating in a state's sovereign airspace complies with the rules and regulations which prevail in that airspace?", "correct": "a", "a": "The state in whose sovereign airspace the aircraft is operating.", "b": "The state which issued the current Certificate of Airworthiness for the aircraft.", "c": "The state in which the aircraft is registered.", "d": "The state which issued the licence held by the pilot of the aircraft."}, {"id": 8, "question": "What was the outcome of the Chicago Convention?", "correct": "a", "a": "The Convention on International Civil Aviation.", "b": "ICAO.", "c": "PICAO.", "d": "The 18 Annexes to the Chicago Convention."}, {"id": 9, "question": "A PPL holder is not permitted to:", "correct": "a", "a": "Carry fare paying passengers.", "b": "Give flying instruction with an FI(A) rating.", "c": "Tow a glider.", "d": "Drop parachutists."}, {"id": 10, "question": "A pilot in command of a flight during which an aircraft enters the sovereign airspace of a foreign state with the intention of landing:", "correct": "a", "a": "Must have ensured that all necessary and relevant documentation is carried on board the aircraft, including the Certificate of Airworthiness, that the aircraft is in an airworthy condition and that it is correctly registered.", "b": "Must ensure before departure that his pilot's licence has been validated by the foreign state.", "c": "Must be satisfied that the aircraft's Certificate of Airworthiness is current and that he holds a type rating for the aircraft.", "d": "Must be satisfied that the aircraft's Certificate of Airworthiness is current, that he holds a type rating for the aircraft, and that he has passed an Air Law examination set by the foreign state."}, {"id": 11, "question": "The pilot in command of an aircraft which enters the sovereign airspace of another contracting state for the purpose of landing must:", "correct": "a", "a": "Hold a licence issued by the authority of the state in which the aircraft is registered.", "b": "Hold a licence issued by any ICAO contracting state.", "c": "Hold a licence issued by any member state of the JAA.", "d": "Hold any valid and current pilot's licence."}, {"id": 12, "question": "What is the basic presumption about VFR flight?", "correct": "a", "a": "That the flight will be flown in Visual Meteorological Conditions.", "b": "That the pilot holds the correct rating to allow the aeroplane to be flown in VFR.", "c": "That the flight will only take place in class G airspace.", "d": "That the flight will not take place above FL180."}, {"id": 13, "question": "When are navigation lights required to be shown?", "correct": "a", "a": "From sunset to sunrise or when specified by the Authority.", "b": "When moving on the manoeuvring area of an aerodrome.", "c": "Whenever the pilot in command thinks it is sensible to switch them on.", "d": "At night or when specified by the authority."}, {"id": 14, "question": "When an aircraft is flying, under which flight rules must the flight be conducted?", "correct": "a", "a": "Either IFR or VFR.", "b": "IFR in IMC and VFR in VMC.", "c": "At the commander's discretion.", "d": "In accordance with ATC instructions."}, {"id": 15, "question": "When may you fly over any congested area of a city, town or settlement at a height from which it would not be possible to land safely in the event of an emergency arising?", "correct": "a", "a": "Only when necessary for take-off and landing.", "b": "Never.", "c": "Only to keep clear of cloud and remain in visual contact with the ground.", "d": "Only where the operator has given permission."}, {"id": 16, "question": "When two aircraft are converging at approximately the same level the one that has the other on its right is required to give way. True or false?", "correct": "b", "a": "True, provided they are in the same class.", "b": "False. The one that has the other on its left has right of way.", "c": "True, unless the other aircraft has a glider on tow.", "d": "False, provided the other aircraft is not towing anything."}, {"id": 17, "question": "When two or more aircraft are on final approach:", "correct": "a", "a": "The lower aircraft has the right of way unless ATC has already specified a landing order.", "b": "The higher aircraft has the right of way.", "c": "The lower aircraft has the right of way.", "d": "The aircraft which has the least horizontal distance to run to the runway threshold has the right of way."}, {"id": 18, "question": "Except when taking off or landing, or under certain other defined circumstances, an aircraft may not fly closer than how much to any person, vessel, vehicle or structure?", "correct": "a", "a": "500 feet.", "b": "1000 feet.", "c": "800 feet.", "d": "1500 feet."}, {"id": 19, "question": "Two aircraft flying according to VFR, one receiving a Radar Information Service, are closing at an apparent constant relative bearing. The aircraft which has the other on its left has right of way and should maintain:", "correct": "a", "a": "Course and speed.", "b": "Height and speed.", "c": "Altitude and course.", "d": "Altitude and speed."}, {"id": 20, "question": "While flying at night you see an anti-collision light and a steady red light at the same altitude at a constant relative bearing of 050 degrees. Is there a risk of collision? And who has right of way?", "correct": "a", "a": "Yes. The other aircraft does.", "b": "Yes. You do.", "c": "No. The other aircraft does.", "d": "No. You do."}, {"id": 21, "question": "If a PPL holder receiving a Radar Advisory Service receives instructions to change heading/altitude such that he cannot maintain VMC, the pilot should:", "correct": "a", "a": "Continue on the present heading, at the present altitude, and tell air traffic why he cannot comply.", "b": "Comply with instructions anyway, but go onto instruments early.", "c": "Continue on present heading and altitude, say nothing, and wait for the controller's next instruction.", "d": "Comply as closely as he can with the controller's instructions but on no account go into IMC."}, {"id": 22, "question": "A Control Area (CTA) established at the confluence of ATS routes in the vicinity of one or more major aerodromes is known as:", "correct": "a", "a": "A Terminal Control Area (TMA).", "b": "An Airway.", "c": "A Control Zone (CTR).", "d": "An Aerodrome Traffic Zone (ATZ)."}, {"id": 23, "question": "What is the international Aeronautical VHF Distress Frequency?", "correct": "a", "a": "121.50 MHz.", "b": "123.45 MHz.", "c": "243.00 MHz.", "d": "406.00 MHz."}, {"id": 24, "question": "How often are Aeronautical Information Circulars published?", "correct": "a", "a": "Monthly.", "b": "Weekly.", "c": "Yearly.", "d": "Quarterly."}, {"id": 25, "question": "If a PPL holder receives an SVFR clearance to enter a CTR but loses RT communications before entering, he must:", "correct": "a", "a": "Remain clear of the CTR.", "b": "Carry on into the CTR via the assigned VRP complying with the last clearance received.", "c": "Carry on into the CTR and await light signals for clearance to land.", "d": "Carry on into the CTR, complying with the last clearance received while transmitting blind."}, {"id": 26, "question": "What SSR squawk should be set in an emergency?", "correct": "a", "a": "7700.", "b": "7777.", "c": "7000.", "d": "7600."}, {"id": 27, "question": "If an aircraft marshaller holds his right arm down and repeatedly moves his left arm upward and backward it means:", "correct": "a", "a": "Turn left.", "b": "Turn right.", "c": "Keep moving ahead.", "d": "Start your left engine."}, {"id": 28, "question": "What is the meaning of a steady green light from ATC to an aircraft in the air?", "correct": "a", "a": "Clear to land.", "b": "Return to this airfield and await landing clearance.", "c": "Land immediately.", "d": "You have priority to land."}, {"id": 29, "question": "What colour are paved taxiway markings?", "correct": "a", "a": "Yellow.", "b": "Red.", "c": "Green.", "d": "White."}, {"id": 30, "question": "What color are runway markings?", "correct": "a", "a": "White.", "b": "Red.", "c": "Green.", "d": "Yellow."}, {"id": 31, "question": "You are on final approach and you see a steady red light from ATC. This means:", "correct": "a", "a": "Do not land. Continue circling.", "b": "Continue approach and await a green light.", "c": "Do not land. Airfield closed.", "d": "Do not land. Divert to your alternate airfield."}, {"id": 32, "question": "What word is used to describe the vertical position of an aircraft measured above mean sea level, when QNH is set on the altimeter subscale?", "correct": "a", "a": "Altitude.", "b": "Elevation.", "c": "Height.", "d": "Flight Level."}, {"id": 33, "question": "What action should a pilot take if he suffers radio communications failure during a VFR flight in VMC?", "correct": "a", "a": "Continue to fly in VMC, land at the nearest suitable aerodrome and report his arrival to his destination airfield.", "b": "Continue to his destination, transmitting blind and attempting to avoid IMC.", "c": "Fly to the nearest aerodrome, orbit on the dead side of the circuit and await a steady green from the control tower.", "d": "Carry out the radio failure procedure in the RAF Flight Information Handbook and await the arrival of a Shepherd aircraft."}, {"id": 34, "question": "Which of the following flight levels would be suitable for an aircraft flying in accordance with the quadrantal rule and maintaining a magnetic track of 146 degrees?", "correct": "a", "a": "FL75.", "b": "FL50.", "c": "FL85.", "d": "FL70."}, {"id": 35, "question": "A pilot intending to land at a civil aerodrome should initiate his descent to below transition level with the altimeter subscale set to:", "correct": "a", "a": "Aerodrome QNH.", "b": "Aerodrome QFE.", "c": "Regional QNH.", "d": "1013 Millibars."}, {"id": 36, "question": "A light aircraft is taking off behind a Heavy or Medium category aircraft. What period of separation is required?", "correct": "a", "a": "2 minutes.", "b": "4 minutes.", "c": "3 minutes.", "d": "5 minutes."}, {"id": 37, "question": "What is the definition of 'transition level'?", "correct": "a", "a": "The lowest available Flight Level above the transition altitude.", "b": "The Flight Level below which the vertical position of an aircraft is expressed as 'height'.", "c": "The transition altitude expressed as a Flight Level.", "d": "The Flight Level at or above which the vertical position of an aircraft is expressed as 'altitude'."}, {"id": 38, "question": "An aeroplane has a maximum take-off mass of 136,000 kg. What is its wake turbulence category?", "correct": "a", "a": "Heavy.", "b": "Medium.", "c": "A wide bodied aeroplane would be Heavy; a narrow bodied would be Medium.", "d": "It depends on the actual take-off mass not the maximum take-off mass."}, {"id": 39, "question": "What word is used to describe the vertical position of an aircraft measured above an airfield datum level, when QFE is set on the altimeter subscale?", "correct": "a", "a": "Height.", "b": "Elevation.", "c": "Altitude.", "d": "Flight Level."}, {"id": 40, "question": "A PPL pilot flying in accordance with SVFR must have the following minima:", "correct": "c", "a": "A minimum visibility of 10 kms or more and remain clear of cloud and in sight of the surface.", "b": "A minimum visibility of 10 kms or more and remain clear of cloud.", "c": "A minimum visibility of 5 kms or more and remain clear of cloud and in sight of the surface.", "d": "A minimum visibility of 10 kms or more and remain in sight of the surface."}, {"id": 41, "question": "Who is responsible for the issue of a Certificate of Airworthiness?", "correct": "a", "a": "The authority of the state of registration.", "b": "The JAA.", "c": "ICAO.", "d": "The operator."}, {"id": 42, "question": "Which of the following normally defines 'runway in use' on an uncontrolled airfield?", "correct": "a", "a": "A runway into wind.", "b": "A part of the maneuvering area defined for take off and landing.", "c": "The most convenient runway to use for the aircraft operating from the aerodrome.", "d": "The defined take off and landing portion of an aerodrome."}, {"id": 43, "question": "Who may NOT suspend VFR operations at an aerodrome on safety grounds?", "correct": "a", "a": "The Approach Controller.", "b": "The duty Aerodrome Controller.", "c": "The local Area Control Centre (ACC).", "d": "The appropriate ATS authority."}, {"id": 44, "question": "Where must the Certificate of Registration be kept while the aircraft is flying?", "correct": "a", "a": "In the aircraft.", "b": "In the registered office of the owner.", "c": "By the authority of the State of registration.", "d": "On the ground at the point of departure."}, {"id": 45, "question": "Flying hours to be credited for a licence or rating must have been flown:", "correct": "a", "a": "In the same type or category of aircraft as that for which the licence or rating is being sought.", "b": "In the same performance group of aircraft as that for which the licence or rating is being sought.", "c": "In the same or higher performance group of aircraft as that for which the licence or rating is being sought.", "d": "In the same make and type of aircraft as that for which the licence or rating is being sought."}, {"id": 46, "question": "The holder of a JAA PPL(A) who wishes to carry passengers must have made a minimum number of take-offs and landings within the preceding:", "correct": "a", "a": "90 days.", "b": "29 days.", "c": "31 days.", "d": "60 days."}, {"id": 47, "question": "If the holder of a pilot's licence learns that he is to undergo surgery, what are his obligations in terms of informing the aviation medical authority?", "correct": "a", "a": "He should contact his aviation medical authority without delay and seek their advice on his circumstances.", "b": "There is no requirement to do so provided the pilot does not fly again as pilot in command until after the surgical operation.", "c": "He should advise the medical authority of the circumstances only if he is due to receive a general anesthetic.", "d": "He has no obligations to tell anyone as this is a private matter."}, {"id": 48, "question": "How long is a JAA PPL(A) issued for?", "correct": "a", "a": "5 years.", "b": "3 years.", "c": "10 years.", "d": "8 years."}, {"id": 49, "question": "The skills test for a JAA PPL(A) must be taken within _______ of completing flying instruction.", "correct": "a", "a": "6 months.", "b": "One year.", "c": "4 months.", "d": "3 months."}, {"id": 50, "question": "Application for the grant of a JAA PPL(A) licence must be made within _____ months of completing the theoretical knowledge examinations.", "correct": "a", "a": "24.", "b": "12.", "c": "36.", "d": "18."}, {"id": 51, "question": "A pilot's licence issued by one JAA member State may be converted to a licence of any other JAA member State, provided that:", "correct": "a", "a": "The new member State is the licence holder's normal State of residence or that full-time employment has been taken by the licence holder in that State.", "b": "The licence holder has resided in the new member State for at least 31 days.", "c": "The licence holder intends to follow a course of study in the new member State lasting at least three months.", "d": "The new member State has no reasonable grounds for refusing to convert the licence."}, {"id": 52, "question": "Which of the following is NOT a requirement for a JAA PPL(A) holder acting as pilot in command or co-pilot?", "correct": "a", "a": "Holds an Instrument Rating.", "b": "Holds a Type or Class rating pertinent to the aircraft to be flown.", "c": "Holds a valid medical certificate.", "d": "Is not flying for remuneration."}, {"id": 53, "question": "Who is responsible for ensuring that all relevant aircraft documentation is carried on an international flight?", "correct": "a", "a": "The pilot in command.", "b": "The organisation hiring out the aircraft.", "c": "The air traffic organisation to whom the flight plan is submitted.", "d": "The flying supervisor at the airfield of departure."}, {"id": 54, "question": "The departure and arrival time entered by a PPL holder in his flying log book is taken as:", "correct": "a", "a": "The time the aircraft begins to move under its own power and the time it comes to rest following the last landing.", "b": "The time of the first take-off and the time of the last landing of the sortie.", "c": "The time of engine start and the time of engine shut-down.", "d": "The time the aircraft enters the active runway for the first take-off and the time it vacates the runway after the last landing."}, {"id": 55, "question": "How long is an Instrument Rating valid for?", "correct": "a", "a": "12 months.", "b": "6 months.", "c": "18 months.", "d": "The IR is valid provided regular skill tests are completed at intervals dictated by the authority."}, {"id": 56, "question": "If a pilot holding a medical certificate under JAR-FCL receives an injury or medical condition affecting his ability to act as crew member:", "correct": "a", "a": oon.", "b": "An aircraft in final approach for landing.", "c": "An aircraft in distress.", "d": "A glider."}, {"id": 122, "question": "What action is required when two aircraft of the same category converge, but not head-on?", "correct": "c", "a": "The faster aircraft shall give way.", "b": "Each aircraft shall give way to the right.", "c": "The aircraft on the left shall give way.", "d": "The aircraft on the right shall give way."}, {"id": 123, "question": "When two aircraft are approaching each other head-on and there is a danger of collision, which way should each aircraft turn?", "correct": "b", "a": "Heavier aircraft should turn to the right, lighter aircraft should turn to the left.", "b": "Each aircraft should turn to the right.", "c": "Heavier aircraft should turn to the left, lighter aircraft should turn to the right.", "d": "Each aircraft should turn to the left."}, {"id": 124, "question": "What actions should the pilots of aircraft take if on head-on collision course?", "correct": "b", "a": "Both should turn to the left.", "b": "Both should turn to the right.", "c": "Both should make a climbing turn to the right.", "d": "Both should make a climbing turn to the left."}, {"id": 125, "question": "How shall aircraft in the air avoid each other on a head-on collision course?", "correct": "b", "a": "Both aircraft shall alter their headings to the left.", "b": "Both aircraft shall alter their headings to the right.", "c": "Powered-aircraft has a right of way, non-powered aircraft shall deviate to the right.", "d": "Non-powered aircraft has a right of way, powered aircraft shall deviate to the left."}, {"id": 126, "question": "What action should the pilots of an airplane and a glider take if on a head-on collision course?", "correct": "c", "a": "The airplane pilot should give way.", "b": "The airplane pilot should give way, because his aircraft is more controllable.", "c": "Both pilots should give way to the right.", "d": "The glider pilot should give way, because a glider is more controllable than an airplane."}, {"id": 127, "question": "What should the glider pilot do if on head-on collision course with a twin-engined Cessna?", "correct": "c", "a": "He should open the air brakes immediately, because a multi-engine airplane has the right-of-way.", "b": "He should deviate to the left thus giving way to the airplane.", "c": "He should deviate to the right.", "d": "He may maintain heading and speed, because a glider has always the right-of-way."}, {"id": 128, "question": "Which aircraft has the right-of-way over the others listed?", "correct": "b", "a": "Airship.", "b": "Glider.", "c": "Aircraft towing other aircraft.", "d": "Helicopter."}, {"id": 129, "question": "Which statement concerning the right-of-way when two aircraft converge (but not head-on) is correct?", "correct": "c", "a": "Normal category aircraft should give way to ultralight aircraft.", "b": "Airplanes should give way to helicopters.", "c": "Airplanes in free flight should give way to non-powered aircraft.", "d": "Ultralight aircraft should give way to normal category aircraft."}, {"id": 130, "question": "While in final gliding flight toward airfield, a glider pilot notices an aerotow closing from his left side. What action should the glider pilot take?", "correct": "c", "a": "Alter heading to the left and give way to the aerotow, which has always the right-of-way.", "b": "Alter heading to the left and give way to the aerotow, which has the right-of-way over a glider.", "c": "Keep heading and speed, because he is on the right side and thus has the right-of-way.", "d": "Keep heading and speed, because a glider has always the right-of-way over a powered aircraft."}, {"id": 131, "question": "Which aircraft must give way at converging of a glider and an airplane in free flight?", "correct": "b", "a": "No one.", "b": "The airplane.", "c": "The glider.", "d": "Both aircraft."}, {"id": 132, "question": "With your aeroplane on an IFR flight in airspace class D, ATC informs you that a helicopter on VFR flight will cross your flight path from right to left. Who has the right-of-way?", "correct": "c", "a": "ATC decides who has the right of way and issues appropriate instruction.", "b": "I have the right-of-way as I am on an IFR flight.", "c": "The helicopter has the right-of-way.", "d": "The aircraft in level flight has right of way."}, {"id": 133, "question": "Aircraft A with an ATC clearance is flying in VMC within a control area. Aircraft B with no ATC clearance is approaching at approximately the same altitude on a converging course. Which has the right of way?", "correct": "c", "a": "Aircraft B if A is on its left.", "b": "Aircraft A regardless of the direction which B is approaching.", "c": "Aircraft B regardless of the direction A is approaching.", "d": "Aircraft A if B is on its right."}, {"id": 134, "question": "Which aircraft must give way when two airplanes are converging at the same altitude?", "correct": "d", "a": "The ultralight airplane.", "b": "The bigger airplane.", "c": "The airplane on the right.", "d": "The airplane which has another airplane at his right side."}, {"id": 135, "question": "An airplane and another airplane towing a glider are on crossing courses. If the aerotow is on the left of the airplane, which has the right-of-way?", "correct": "b", "a": "Both aircraft.", "b": "The aerotow.", "c": "Depends on the magnetic heading of separate aircraft.", "d": "The aircraft in free flight."}, {"id": 136, "question": "Which statement concerning heavier-than-air aircraft right-of-way during landing is correct?", "correct": "a", "a": "Aircraft at higher level shall give way to aircraft at lower level, but the latter shall not cut in front of another in the final stage of approach or overtake that aircraft.", "b": "Aircraft in final stage of an approach to land or which is first in an airport traffic circuit has the right-of-way over all other aircraft.", "c": "Aircraft which is the highest has the right-of-way over all other aircraft except turbojet aircraft.", "d": "ATC determines right-of-way during all landing sequences."}, {"id": 137, "question": "When overtaking an aircraft in flight, you should:", "correct": "b", "a": "Alter your course to the left.", "b": "Alter your course to the right.", "c": "Fly below or above it.", "d": "Fly below it exclusively."}, {"id": 138, "question": "Night flying inside the territory of Republic of Serbia is defined as flying between:", "correct": "a", "a": "Sunset and sunrise.", "b": "30 minutes before sunset and 30 minutes after sunrise.", "c": "60 minutes before sunset and 60 minutes after sunrise.", "d": "30 minutes after sunset and 30 minutes before sunrise."}, {"id": 139, "question": "Which minimum life-saving equipment is recommended to be on board of a non-commercial flight of a single-engined landplane when flying en route over water beyond gliding distance from shore?", "correct": "c", "a": "Life saving rafts in sufficient numbers to carry all persons on board.", "b": "Life saving rafts in sufficient numbers to carry all persons on board and one life jacket for each person on board.", "c": "One life jacket or equivalent individual floatation device for each person on board.", "d": "No special equipment is required for non-commercial flights."}, {"id": 140, "question": "At what distance from land must an extended over-water non-commercial flight of a multi-engined aeroplane carry additional life-saving rafts and pyrotechnical distress signals?", "correct": "c", "a": "200 NM.", "b": "50 NM.", "c": "100 NM.", "d": "30 NM."}, {"id": 141, "question": "The responsibility for ensuring that maintenance personnel make the appropriate entries in aircraft maintenance records indicating the aircraft has been approved for return to service lies with:", "correct": "b", "a": "The mechanic who performed the work.", "b": "The owner or operator.", "c": "The pilot in command.", "d": "The aviation authority."}, {"id": 142, "question": "How often is a glider or an aeroplane's state of airworthiness inspected by the authorized person?", "correct": "a", "a": "Regularly each year and in case of changing ownership or after repairs.", "b": "Regularly every two years and after a hard landing.", "c": "One year after the last regular inspection and in case of changing ownership.", "d": "Regularly each year before beginning of a flying season."}, {"id": 143, "question": "Requested national mark of an aircraft registered in the Republic of Serbia is:", "correct": "a", "a": "A five-placed mark consisting of a certain combination of letters.", "b": "The country flag of the Republic of Serbia and the mark YU.", "c": "The country flag of the Republic of Serbia.", "d": "A random four-placed number."}, {"id": 144, "question": "An ATC clearance provides:", "correct": "a", "a": "Authorization to proceed under specified traffic conditions in controlled airspace.", "b": "Priority over all other traffic.", "c": "Adequate separation from all traffic.", "d": "Permission to deviate from any rule."}, {"id": 145, "question": "What action should be taken if a pilot receives a clearance that will cause a deviation from a rule?", "correct": "d", "a": "Refuse the clearance as stated and request that it be amended.", "b": "Accept the clearance, because the pilot is not responsible for the deviation.", "c": "Accept the clearance and advise Air Traffic Control when deviation occurs.", "d": "Accept the clearance and advise Air Traffic Control that he believes a rule deviation will occur."}, {"id": 146, "question": "If a pilot has to deviate from an ATC clearance due to unforeseen circumstances, he has to:", "correct": "c", "a": "Transmit a general call giving all details concerning his deviation from the ATC clearance.", "b": "Inform all ATC stations concerned by transmitting a multiple call.", "c": "Notify the competent ATC unit without delay and obtain an amended ATC clearance.", "d": "Notify the Aeronautical Information Service."}, {"id": 147, "question": "When intercepted by a military aircraft, the pilot of a VFR aircraft should:", "correct": "d", "a": "Squawk 7700.", "b": "Attempt to establish communications with the intercepting aircraft over 121.5 MHz and comply with the intercept signals.", "c": "Acknowledge receipt of intercepting aircraft instructions with the appropriate visual signals.", "d": "All of the above."}, {"id": 148, "question": "During a cross-country flight a military aircraft approaches your left wingtip, flies along, then makes an abrupt break-away climbing turn to the left. What does this mean?", "correct": "a", "a": "You may proceed!", "b": "You have been intercepted. Follow me!", "c": "Land at the aerodrome in the direction of my flight!", "d": "Leave the prohibited area immediately!"}, {"id": 149, "question": "During a cross-country flight a military aircraft approaches your left wingtip, flies along, then rocks the wings and commences a shallow turn to the right. What does this mean?", "correct": "b", "a": "Return to the aerodrome of origin!", "b": "You have been intercepted. Follow me!", "c": "Leave the prohibited area immediately!", "d": "You may proceed!"}, {"id": 150, "question": "During a cross-country flight near an unknown airport, a military aircraft approaches, turns around your aircraft, rocks the wings and lowers the landing gear. What does this mean?", "correct": "a", "a": "You have been intercepted, land at the airport below you!", "b": "You may proceed!", "c": "Leave the airport zone immediately!", "d": "Leave the airport zone and land at the nearest sport airfield!"}] },
  fpp: { code:"FPP", name:"Flight Performance & Planning", questions:[{"id": 2, "question": "What V speed is it important not to exceed if sudden full-pitch, nose-up, control movements are planned, and why?", "correct": "a", "a": "VA \u2014 sudden control movements can cause structural damage.", "b": "VD \u2014 sudden control movements can cause a departure from controlled flight.", "d": "VFB \u2014 sudden control movements can cause a departure from controlled flight.", "c": "VNE \u2014 sudden control movements can cause structural damage."}, {"id": 3, "question": "What is the colour of the caution speed range on an ASI, and what must the pilot be mindful of when operating in this range?", "correct": "a", "a": "Yellow \u2014 should not be entered unless air is smooth; use small and gentle control inputs.", "b": "Green \u2014 stalls, airframe deformations, and/or structural damage may occur with abrupt full deflections.", "d": "Green \u2014 control flutter may occur if turbulence is encountered.", "c": "Yellow \u2014 stalls, causing airframe deformations and/or structural damage may occur with abrupt deflections."}, {"id": 4, "question": "What name is given to the load at which the aircraft structure will fail?", "correct": "a", "a": "Ultimate Load.", "b": "Safety Factor Load.", "d": "Maximum Load.", "c": "Limit Load."}, {"id": 5, "question": "An aircraft which has been grossly overloaded will: 1. Require increased take-off and landing distances. 2. Have a higher stalling speed. 3. Have a reduced maximum level flight speed. 4. Have increased range and endurance. 5. Have a reduced rate of climb and operating ceiling. Which are correct?", "correct": "a", "a": "1, 2, 3, & 5.", "b": "1, 2, 4 & 5.", "d": "1, 2, 3 & 4.", "c": "2, 4 & 5."}, {"id": 6, "question": "Maximum Zero Fuel Mass (MZFM) is best defined as:", "correct": "a", "a": "Maximum permissible mass of the aircraft with no useable fuel.", "b": "Maximum permissible mass of the aircraft with no passengers or fuel.", "d": "Maximum permissible mass of the aircraft without occupants and baggage.", "c": "Maximum permissible mass of the aircraft with no crew or fuel."}, {"id": 7, "question": "Maximum Take-Off Mass (MTOM) is defined best as:", "correct": "a", "a": "Maximum permissible total mass at the start of the take-off run.", "b": "Maximum permissible total mass prior to taxiing.", "d": "Maximum permissible total mass at the point of rotation.", "c": "Maximum permissible total mass prior to take-off."}, {"id": 8, "question": "Which of the following situations may, under certain conditions, result in structural damage occurring?", "correct": "a", "a": "An aircraft being flown above its maximum all up mass.", "b": "An aircraft in the utility category being flown at its maximum permissible mass.", "d": "An aircraft in the normal category being flown at its maximum permissible mass.", "c": "An aircraft being flown above its maximum landing mass."}, {"id": 9, "question": "Never exceed speed (VNE) is the red radial line on the ASI and marks the speed at which:", "correct": "a", "a": "Flight is permitted in smooth conditions only.", "b": "Prolonged flight is unsafe.", "d": "Structural damage will occur.", "c": "Flight is prohibited."}, {"id": 10, "question": "When flying in very rough air what is the maximum speed to be adopted in order to avoid overstressing the airframe?", "correct": "a", "a": "VRA or VA.", "b": "VD or VNO.", "d": "VD or VA.", "c": "VNO or VFE."}, {"id": 11, "question": "Your aircraft has an oil reservoir with a capacity of 3 imp/gal positioned 20 inches aft of the datum. The oil weighs 9.1 lbs/gal. The reservoir will possess a moment of:", "correct": "a", "a": "546 lb\u00b7in.", "b": "60 lb\u00b7in.", "d": "182 lb\u00b7in.", "c": "27.3 lb\u00b7in."}, {"id": 13, "question": "An aircraft is loaded such that its C of G is on the aft limit: I. Stalling speed decreases (negative). II. Range and endurance decrease (negative). III. Stall risk increases (negative). IV. Stick forces increase (negative). Which are correct?", "correct": "a", "a": "Only II and III are correct.", "b": "All of the above are correct.", "d": "Only II and IV are correct.", "c": "Only I and IV are correct."}, {"id": 14, "question": "Certification requirements stipulate that when loading a light aircraft:", "correct": "a", "a": "The C of G should remain within the defined limits and the Maximum Take-off Mass must not be exceeded.", "b": "All seats, baggage compartments and fuel tanks are contained within the C of G limits so that it is impossible to load the aircraft beyond its limits.", "d": "The Maximum Take-off Mass is not exceeded, and the CofG remains at least 5% inside the C of G limits.", "c": "With maximum traffic load and full fuel the aircraft will not exceed the authorised Maximum Take-off Mass."}, {"id": 15, "question": "The Maximum Take-off Mass of an aircraft may be limited by:", "correct": "a", "a": "Structural design load limits and/or runway length, altitude and temperature.", "b": "The authorised performance category of the aircraft (Utility/Normal/Aerobatic).", "d": "All of the above.", "c": "The airworthiness condition of the aircraft."}, {"id": 16, "question": "DOM (Dry Operating Mass) is defined as:", "correct": "a", "a": "The total mass of the aircraft ready for a specific type of operation including crew, crew baggage and special equipment but excluding useable fuel and traffic load.", "b": "Including crew and crew baggage, catering and removable passenger service equipment and fuel.", "d": "Including crew and crew baggage, catering, traffic load and fuel.", "c": "Including crew and crew baggage, catering and removable passenger service equipment and traffic load."}, {"id": 17, "question": "An aircraft loaded in a dangerous manner, so that its C of G is beyond its forward limit will:", "correct": "a", "a": "Have both an increased longitudinal stability and stalling speed.", "b": "Require less effort to flare when landing.", "d": "Have both an increased range and endurance.", "c": "Require less effort to rotate on take-off."}, {"id": 18, "question": "The flight characteristics of an aircraft which has its C of G at the forward limit will be:", "correct": "a", "a": "Insensitivity to Pitch Control and great Longitudinal Stability.", "b": "Insensitivity to Pitch Control and little Longitudinal Stability.", "d": "Sensitivity to Pitch Control and great Longitudinal Stability.", "c": "Sensitivity to Pitch Control and little Longitudinal Stability."}, {"id": 19, "question": "An aircraft weighing 2000 lbs (total CofG moment +169,400 lb\u00b7in) uplifts 440 lbs of fuel. Effective arm of fuel is 88.5 inches aft of datum. New mass and C of G moment?", "correct": "a", "a": "2440 lbs / +208,340 lb\u00b7in.", "b": "1560 lbs / +208,340 lb\u00b7in.", "d": "1560 lbs / +169,488.5 lb\u00b7in.", "c": "2440 lbs / +169,488.5 lb\u00b7in."}, {"id": 20, "question": "You plan to carry your aircraft's maximum permissible Traffic Load. Your principal consideration during your flight planning will be that:", "correct": "a", "a": "Your fuel load may have to be limited to prevent you exceeding the Maximum All Up Weight/Mass.", "b": "It is mandatory to carry a full fuel load when carrying passengers.", "d": "The Traffic Load may have to be reduced to allow for the full fuel load.", "c": "The fuel load is accounted for in Traffic Load calculations."}, {"id": 21, "question": "'Traffic Load':", "correct": "a", "a": "Is the total mass of passengers, baggage and freight.", "b": "Includes drinkable water and lavatory chemicals.", "d": "Includes the Basic Empty Mass.", "c": "Is the total mass of passengers, baggage and freight and fuel."}, {"id": 22, "question": "The consequences of operating an aeroplane with the C of G beyond the aft limit: I. On ground aircraft would be tail heavy and could tip up. II. Flying controls too sensitive \u2014 risk of tail strike at rotation. III. Tendency to stall would increase; impossible to achieve balanced flight. IV. Recovery from a spin would be much more difficult. Which are correct?", "correct": "a", "a": "All statements are correct.", "b": "Only statement I is correct.", "d": "Only statements II and III are correct.", "c": "Only statements I and IV are correct."}, {"id": 25, "question": "What is used as the aircraft reference for the C of G limit, and upon which axis is that limit found? (Axis / Reference)", "correct": "a", "a": "Longitudinal / Datum.", "b": "Normal / Spinner.", "d": "Vertical / Wheels.", "c": "Lateral / Tail."}, {"id": 26, "question": "C of G limits are set by the manufacturer and:", "correct": "a", "a": "Are mandatory.", "b": "Have only a forward limit.", "d": "Have only an aft limit.", "c": "Are a guide only."}, {"id": 27, "question": "Take-off Mass = 2353 lbs, C of G for departure = 89.75 in aft of datum, estimated fuel burn = 200 lbs with C of G 85.00 in aft of datum. Position of the C of G on landing?", "correct": "a", "a": "90.19 inches aft of the datum.", "b": "82.52 inches aft of the datum.", "d": "96.97 inches aft of the datum.", "c": "105.98 inches aft of the datum."}, {"id": 28, "question": "The Centre of Gravity range of most aircraft reduces as the aircraft mass increases, as a result of:", "correct": "a", "a": "The forward C of G limit moving rearwards to reduce stability.", "b": "The aft C of G limit moving forward to increase stability.", "d": "The static margin moving forward to reduce manoeuvrability.", "c": "The aft C of G limit moving rearwards to extend the static margin."}, {"id": 29, "question": "When calculating the MZFM (maximum zero fuel mass), the following are included:", "correct": "a", "a": "Crew, Passengers, Baggage & Catering.", "b": "Crew, Passengers & Baggage.", "d": "Drinkable water and lavatory chemicals.", "c": "Crew, Passengers, Baggage, Catering & Fuel."}, {"id": 30, "question": "What effect will a higher aircraft mass have on rotate speed and take-off safety speed?", "correct": "a", "a": "It will increase both speeds.", "b": "It will decrease both speeds.", "d": "It will decrease rotate speed and increase take-off safety speed.", "c": "It will increase rotate speed and decrease take-off safety speed."}, {"id": 31, "question": "What is the effect of runway slope on the take-off?", "correct": "a", "a": "An uphill slope will increase the take-off distance.", "b": "An uphill slope will increase the take-off performance.", "d": "A downhill slope will decrease the take-off performance.", "c": "A downhill slope will increase the take-off distance."}, {"id": 32, "question": "That part of a runway surface used for normal operations during take-off, excluding any clearway or stopway, is referred to as:", "correct": "a", "a": "The take-off run available (TORA).", "b": "The landing distance available (LDA).", "d": "The emergency distance available (EMDA).", "c": "The take-off distance available (TODA)."}, {"id": 33, "question": "If the density of the atmosphere is reduced, the take-off distance will be:", "correct": "a", "a": "Increased.", "b": "Decreased.", "d": "Controlled by wind.", "c": "Unaffected."}, {"id": 34, "question": "If the density of the air is increased above ISA conditions, the effect will be:", "correct": "a", "a": "To increase the take-off performance.", "b": "To increase the take-off distance.", "d": "To decrease just the take-off run.", "c": "To decrease the take-off performance."}, {"id": 35, "question": "When the density of the atmosphere is relatively low, the resulting reduction in:", "correct": "a", "a": "Both lift and engine power will require a longer take-off distance.", "b": "Thrust and drag has no apparent effect on the take-off distance required.", "d": "Drag offsets the loss of engine power giving improved acceleration.", "c": "Drag will permit the use of greater flap angles."}, {"id": 36, "question": "The main reason for taking off into wind is to:", "correct": "a", "a": "Decrease the ground speed of the aircraft at lift-off.", "b": "Decrease the take-off distance available (TODA).", "d": "Increase the take-off distance.", "c": "Increase the ground speed of the aircraft."}, {"id": 37, "question": "Increasing the aeroplane's gross weight will have what effect on the take-off?", "correct": "a", "a": "Increase the stall speed and the take-off run required.", "b": "Decrease the stall speed and increase the take-off run required.", "d": "Decrease the stall speed and the take-off run required.", "c": "Increase the stall speed and decrease the take-off run required."}, {"id": 38, "question": "What is the reason for increasing the speed in a prolonged climb?", "correct": "a", "a": "To increase the flow of air through the engine and keep it cool.", "b": "To maintain the best rate of climb speed.", "d": "To maintain the best angle of climb speed.", "c": "To reduce the noise of the aircraft in sensitive areas."}, {"id": 39, "question": "Climbing at Vy will achieve:", "correct": "a", "a": "The greatest increase in altitude in a given period of time.", "b": "The maximum angle of climb.", "d": "The best obstacle clearance performance.", "c": "The maximum increase in height in the shortest horizontal distance."}, {"id": 40, "question": "To gain the greatest amount of height in the shortest time period the aircraft should be flown at:", "correct": "a", "a": "The best rate of climb speed (Vy).", "b": "60 KT.", "d": "At the speed for maximum endurance.", "c": "The best angle of climb speed (Vx)."}, {"id": 42, "question": "Increasing the mass (and, therefore, weight) of the aircraft will:", "correct": "a", "a": "Decrease the rate and angle of climb.", "b": "Increase the rate and angle of climb.", "d": "Decrease the rate of climb and increase the angle of climb.", "c": "Increase the rate of climb and decrease the angle of climb."}, {"id": 43, "question": "The best rate of climb is achieved:", "correct": "a", "a": "When flying at the speed for maximum excess power available.", "b": "When flying at the speed for maximum excess thrust available.", "d": "When flying at Vx.", "c": "When climbing into wind."}, {"id": 44, "question": "The indicated air speed for the best rate of climb when climbing to cruise altitude will tend to:", "correct": "a", "a": "Decrease.", "b": "Decrease then increase.", "d": "Increase.", "c": "Remain the same."}, {"id": 45, "question": "The lift produced by the wing of an aeroplane that is climbing and maintaining a constant airspeed will be:", "correct": "a", "a": "Greater than weight.", "b": "Less than weight.", "d": "Independent of weight.", "c": "Equal to weight."}, {"id": 47, "question": "Climbing at Vx will achieve:", "correct": "a", "a": "The maximum angle of climb.", "b": "The best time to height.", "d": "The maximum horizontal distance for a given vertical distance.", "c": "The greatest increase in altitude in a given period of time."}, {"id": 48, "question": "If the centre of gravity is moved aftwards, the effect is?", "correct": "a", "a": "An increased range and endurance.", "b": "A stronger lift-weight couple which requires more tail plane down force.", "d": "A greater tail load.", "c": "A reduced range and endurance."}, {"id": 50, "question": "What is the maximum range speed for a piston engine aircraft?", "correct": "a", "a": "VMD.", "b": "VMP.", "d": "At a speed less than VMD and at the lowest safe altitude.", "c": "At a higher speed than VNO and at the lowest safe altitude."}, {"id": 51, "question": "In order to maximise the glide range, the aircraft should be flown:", "correct": "a", "a": "At low angles of attack at VMD.", "b": "At high angles of attack at VMD.", "d": "At a negative angle of attack at VMD.", "c": "At low angles of attack at VMP."}, {"id": 52, "question": "A pilot wishes to fly at maximum range speed with a tailwind. How will the speed selected compare with the maximum range speed for still air?", "correct": "a", "a": "It will be decreased by a margin slightly less than the amount of tailwind.", "b": "It will be increased by a margin slightly less than the amount of tailwind.", "d": "It will be decreased by a margin slightly more than the amount of tailwind.", "c": "It will be the same as for still air."}, {"id": 53, "question": "Which of the following cases will result in reduced performance and possibly exceed the structural limitations of the aircraft?", "correct": "a", "a": "An aircraft that is operated above its maximum all up weight.", "b": "An aircraft that is stalled at its maximum all up weight.", "d": "An aircraft with a higher take-off mass than a landing mass.", "c": "An aeroplane that is operated above its maximum all up landing weight."}, {"id": 54, "question": "What is the effect of a headwind on the glide angle and glide distance?", "correct": "a", "a": "Glide angle will increase and glide distance decrease.", "b": "Glide angle will remain the same and glide distance will remain the same.", "d": "Glide angle will decrease and glide distance decrease.", "c": "Glide angle will increase and glide distance increase."}, {"id": 55, "question": "What speed must be flown to attain the maximum cruise endurance?", "correct": "a", "a": "VMP.", "b": "VY.", "d": "VMD.", "c": "Maximum speed."}, {"id": 56, "question": "The maximum glide range will be achieved by:", "correct": "a", "a": "A relatively low angle of attack being maintained.", "b": "A relatively high angle of attack being maintained.", "d": "A high descent angle.", "c": "A negative angle of attack being maintained."}, {"id": 57, "question": "If weight is increased, the range of the aircraft will be:", "correct": "a", "a": "Reduced.", "b": "Unchanged.", "d": "Reduced if no increase in lift is achieved.", "c": "Increased."}, {"id": 58, "question": "A wing contaminated by a small amount of ice will produce:", "correct": "a", "a": "More drag, more weight and less lift.", "b": "More weight and more lift.", "d": "An increase in weight and decrease in drag.", "c": "An increase in both lift and drag coefficient."}, {"id": 59, "quest let currentSubject = "agk";
let session = {};
let stats = { attempted:0, bestScore:null };

function selectSubject(key, el) {
  currentSubject = key;
  document.querySelectorAll(".subject-tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("stat-total").textContent = SUBJECTS[key].questions.length;
}

function shuffle(arr) {
  for (let i = arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function buildQuestions(pool, doShuffle) {
  const letters = ["a","b","c","d"];
  return pool.map(q => {
    let opts = ["a","b","c","d"].filter(k => q[k]).map(k => ({text:q[k], origKey:k}));
    const correctText = q[q.correct];
    if (doShuffle) shuffle(opts);
    let newCorrectKey = "a";
    opts = opts.map((opt, i) => {
      const newKey = letters[i];
      if (opt.text === correctText) newCorrectKey = newKey;
      return { key:newKey, text:opt.text };
    });
    return { ...q, opts, correct:newCorrectKey };
  });
}

function startQuiz(questionOverride, subjectOverride) {
  const countVal = document.getElementById("sel-count").value;
  session = {
    mode: document.getElementById("sel-mode").value,
    shuffle: document.getElementById("tog-shuffle").checked,
    subject: subjectOverride || currentSubject,
    current:0, correct:0, wrong:0, answers:[]
  };
  const allQ = SUBJECTS[session.subject].questions;
  let pool;
  if (questionOverride) {
    pool = [...questionOverride];
  } else {
    const shuffled = shuffle([...allQ]);
    pool = countVal === "all" ? shuffled : shuffled.slice(0, parseInt(countVal));
  }
  session.questions = buildQuestions(pool, session.shuffle);
  showScreen("quiz");
  renderQuestion();
}

function renderQuestion() {
  const q = session.questions[session.current];
  const total = session.questions.length;
  document.getElementById("prog-fill").style.width = (session.current/total*100)+"%";
  document.getElementById("prog-label").textContent = session.current+" / "+total;
  document.getElementById("sc-right").textContent = session.correct;
  document.getElementById("sc-wrong").textContent = session.wrong;
  document.getElementById("q-number").textContent =
    SUBJECTS[session.subject].code+" · Q"+(session.current+1)+" of "+total;
  document.getElementById("q-text").textContent = q.question;
  const wrap = document.getElementById("answers-wrap");
  wrap.innerHTML = "";
  q.opts.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "answer-btn";
    btn.innerHTML = `<span class="ans-letter">${opt.key}</span><span>${opt.text}</span>`;
    btn.onclick = () => selectAnswer(opt.key, q.correct);
    wrap.appendChild(btn);
  });
  document.getElementById("feedback-box").className = "feedback-box";
  document.getElementById("btn-next").className = "btn-next";
}

function selectAnswer(chosen, correct) {
  const q = session.questions[session.current];
  document.querySelectorAll(".answer-btn").forEach(b => {
    b.disabled = true;
    const letter = b.querySelector(".ans-letter").textContent.toLowerCase();
    if (letter === correct) b.classList.add("correct");
    else if (letter === chosen && chosen !== correct) b.classList.add("wrong");
  });
  const isCorrect = chosen === correct;
  if (isCorrect) session.correct++; else session.wrong++;
  session.answers.push({ q, chosen, correct, isCorrect });
  document.getElementById("sc-right").textContent = session.correct;
  document.getElementById("sc-wrong").textContent = session.wrong;
  if (session.mode === "practice") {
    const fb = document.getElementById("feedback-box");
    if (isCorrect) {
      fb.className = "feedback-box ok show";
      fb.textContent = "✓ Correct!";
    } else {
      fb.className = "feedback-box no show";
      const cOpt = q.opts.find(o => o.key === correct);
      fb.textContent = "✗ Incorrect. Correct answer: "+(cOpt ? cOpt.text : correct);
    }
  }
  const isLast = session.current === session.questions.length-1;
  const nb = document.getElementById("btn-next");
  nb.className = "btn-next show";
  nb.textContent = isLast ? "View Results →" : "Next Question →";
}

function nextQuestion() {
  session.current++;
  if (session.current >= session.questions.length) showResults();
  else renderQuestion();
}

function showResults() {
  const total = session.questions.length;
  const pct = Math.round(session.correct/total*100);
  stats.attempted += total;
  if (stats.bestScore === null || pct > stats.bestScore) stats.bestScore = pct;
  document.getElementById("stat-done").textContent = stats.attempted;
  document.getElementById("stat-pct").textContent = stats.bestScore+"%";
  const circle = document.getElementById("res-circle");
  circle.textContent = pct+"%";
  circle.className = "result-circle"+(pct>=75?"":pct>=60?" mid":" fail");
  document.getElementById("res-title").textContent =
    pct>=75 ? "🎉 Pass — Well done!" : pct>=60 ? "🔄 Almost there!" : "📚 Keep studying!";
  document.getElementById("res-sub").textContent =
    SUBJECTS[session.subject].code+" · PPL pass mark 75%";
  document.getElementById("res-right").textContent = session.correct;
  document.getElementById("res-wrong").textContent = session.wrong;
  document.getElementById("res-total").textContent = total;
  const missed = session.answers.filter(a => !a.isCorrect);
  const rev = document.getElementById("review-section");
  if (missed.length === 0) {
    rev.innerHTML = `<p style="color:var(--green);text-align:center;padding:20px;font-family:'DM Mono',monospace;font-size:13px">🏆 Perfect score!</p>`;
  } else {
    let html = `<div class="review-title">Missed Questions (${missed.length})</div>`;
    missed.forEach(a => {
      const cOpt = a.q.opts.find(o => o.key === a.correct);
      const yOpt = a.q.opts.find(o => o.key === a.chosen);
      html += `<div class="review-item wrong-item">
        <div class="review-q">${a.q.question}</div>
        <div class="review-ans">
          <span class="review-yours">✗ ${yOpt ? yOpt.text : a.chosen}</span>
          <span class="review-correct">✓ ${cOpt ? cOpt.text : a.correct}</span>
        </div></div>`;
    });
    rev.innerHTML = html;
  }
  document.querySelector(".btn-retry").style.display = missed.length > 0 ? "block" : "none";
  showScreen("results");
}

function retryMissed() {
  const missedIds = session.answers.filter(a => !a.isCorrect).map(a => a.q.id);
  const orig = SUBJECTS[session.subject].questions.filter(q => missedIds.includes(q.id));
  startQuiz(orig, session.subject);
}

function goHome() {
  showScreen("home");
  document.getElementById("stat-total").textContent = SUBJECTS[currentSubject].questions.length;
  const keys = Object.keys(SUBJECTS);
  document.querySelectorAll(".subject-tab").forEach((t,i) => {
    t.classList.toggle("active", keys[i] === currentSubject);
  });
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-"+name).classList.add("active");
  window.scrollTo(0,0);
}
</script>
</body>
</html>
