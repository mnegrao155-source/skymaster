  comm: { code:"COMM", name:"Communications", questions:[{"id": 1, "question": "Aerodrome traffic is:", "correct": "a", "a": "All traffic on the manoeuvring area of an aerodrome and all aircraft operating in the vicinity of an aerodrome.", "b": "All vehicles on an aerodrome.", "c": "All aircraft on an aerodrome.", "d": "All traffic on the movement area of an aerodrome."}, {"id": 2, "question": "VHF frequencies used for communication: what is the range?", "correct": "a", "a": "From 118.0 to 135.975 MHz.", "b": "From 108.0 to 135.975 kHz.", "c": "From 118.0 to 121.5 MHz.", "d": "From 108.0 to 118.0 MHz."}, {"id": 3, "question": "The maximum VHF communications range that can be expected by an aircraft at FL 100 is:", "correct": "a", "a": "120 nm.", "b": "1200 nm.", "c": "150 nm.", "d": "100 nm."}, {"id": 4, "question": "An aircraft will be in the best range for VHF communications if it is:", "correct": "b", "a": "At high altitude in the vicinity of the airfield.", "b": "At high altitude and long range.", "c": "At low altitude and long range.", "d": "At low altitude and short range."}, {"id": 5, "question": "What is the meaning of the term 'IMC'?", "correct": "a", "a": "Instrument meteorological conditions.", "b": "Flight according to instrument flight rules.", "c": "Flight according to visual flight rules.", "d": "Visual meteorological conditions."}, {"id": 6, "question": "The term 'SVFR flight' stands for:", "correct": "a", "a": "Special VFR flight.", "b": "Sector VFR flight.", "c": "Schooling VFR flight.", "d": "Search and rescue VFR flight."}, {"id": 7, "question": "The term 'CVFR flight' stands for:", "correct": "a", "a": "Controlled VFR flight.", "b": "VFR flight of civil aircraft.", "c": "Schooling VFR flight.", "d": "VFR flight with visibility to the ground."}, {"id": 8, "question": "What is the meaning of the term 'VMC'?", "correct": "a", "a": "Visual meteorological conditions.", "b": "A flight according to instrument flight rules.", "c": "Visual flight rules.", "d": "Instrument flight rules."}, {"id": 9, "question": "What is the meaning of the term 'VFR flight'?", "correct": "a", "a": "Flight according to visual flight rules.", "b": "Flight according to instrument flight rules.", "c": "Training flight.", "d": "Flight without passengers on board."}, {"id": 10, "question": "What does the phrase 'WILCO' mean?", "correct": "a", "a": "I understand your message and will comply with it.", "b": "I have received all of your last transmission.", "c": "My message is ended and I expect a response from you.", "d": "Permission granted."}, {"id": 11, "question": "What is the meaning of the phrase 'VERIFY'?", "correct": "a", "a": "Check and confirm with the originator.", "b": "No, or permission not granted or that is not correct.", "c": "Repeat all or the following part of your last transmission.", "d": "I hereby indicate the separation between two portions of the message."}, {"id": 12, "question": "What is the meaning of the phrase 'ROGER'?", "correct": "a", "a": "I have received all of your last transmission.", "b": "I understand your message and will comply with it.", "c": "My transmission is ended and I expect a response from you.", "d": "Permission for proposed action granted."}, {"id": 13, "question": "What is the meaning of the phrase 'ACKNOWLEDGE'?", "correct": "a", "a": "Let me know that you have received and understood this message.", "b": "I have received all of your last transmission.", "c": "Repeat all or the following part of your last transmission.", "d": "My transmission is ended and I expect a response from you."}, {"id": 14, "question": "'VACATE RIGHT' means:", "correct": "a", "a": "Turn right to leave the runway.", "b": "Clear the runway immediately.", "c": "The next runway exit is on the right.", "d": "Turn right after take-off."}, {"id": 15, "question": "'GO AROUND' means:", "correct": "a", "a": "Carry out a missed approach.", "b": "Overtake the aircraft ahead.", "c": "Make a 360 degree turn.", "d": "Taxi past the aircraft at the holding point."}, {"id": 16, "question": "'STANDBY' means:", "correct": "a", "a": "Wait and I will call you again.", "b": "Select STANDBY on the SSR Transponder.", "c": "Hold your present position.", "d": "Continue on present heading and listen out."}, {"id": 17, "question": "What does the phrase 'MONITOR' mean?", "correct": "a", "a": "Listen out on (frequency).", "b": "Establish radio contact with ...", "c": "I repeat for clarity or emphasis.", "d": "Watch the instruments."}, {"id": 18, "question": "What does the phrase 'REPORT' mean?", "correct": "a", "a": "Pass me the following information.", "b": "Say again.", "c": "Pass your message.", "d": "Proceed with your message."}, {"id": 19, "question": "What does the abbreviation 'SID' mean?", "correct": "a", "a": "Standard instrument departure route.", "b": "Standard instrument arrival route.", "c": "Standard visual departure route.", "d": "Standard visual arrival route."}, {"id": 20, "question": "'ORBIT RIGHT' means:", "correct": "d", "a": "Continue to make right hand turn until advised.", "b": "Right hand circuits in use.", "c": "Turn right to avoid other traffic.", "d": "Make a 360 degrees turn to the right."}, {"id": 21, "question": "A pilot receives the clearance to hold over an en-route reporting point until a specified time. This time is called:", "correct": "a", "a": "Expected approach time.", "b": "Estimated over time.", "c": "Estimated time of arrival.", "d": "Holding time."}, {"id": 22, "question": "What does the term 'ALTITUDE' mean?", "correct": "a", "a": "Altitude above mean sea level.", "b": "Height above an airfield.", "c": "Flight level.", "d": "Standard altitude."}, {"id": 23, "question": "What is the meaning of the term 'FLIGHT LEVEL'?", "correct": "a", "a": "A level in the atmosphere for vertical separation determined by setting the altimeter to 1013.2 hPa.", "b": "A level in atmosphere for vertical separation determined by setting the altimeter to local QNH.", "c": "A level in atmosphere for vertical separation determined by setting the altimeter to local QFE.", "d": "A pressure level based on regional QNH."}, {"id": 24, "question": "What is the correct order of phases of flight: start-up, push back, taxi, line-up, take off roll, take off, climb, cruise, descent, approach, final approach, touch down?", "correct": "a", "a": "Start up, push back, taxi, line-up, take off roll, take off, climb, cruise, descent, approach, final approach, touch down.", "b": "Line-up, take off roll, take off, climb, cruise, descent, approach, start up, push back, taxi, final approach, touch down.", "c": "Push back, taxi, line-up, take off roll, start up, take off, descent, climb, cruise, touch down, approach, final approach.", "d": "Taxi, start up, push back, line-up, take off roll, take off, climb, approach, descent, cruise, final approach, touch down."}, {"id": 25, "question": "Which altitude has been reported by a pilot using the phrase 'FIVE THOUSAND FEET QFE'?", "correct": "a", "a": "Height above the airfield.", "b": "Flight level.", "c": "Altitude above mean sea level.", "d": "Adequate altitude in International Standard Atmosphere."}, {"id": 26, "question": "When a pilot reports 'FIVE THOUSAND FEET', the controller concludes:", "correct": "a", "a": "The altitude of the aircraft is 5,000 ft above mean sea level.", "b": "The altimeter of the aircraft is set to the local QFE.", "c": "The altitude of the aircraft is 5,000 ft above the airfield.", "d": "The altimeter of the aircraft is set to the standard pressure 1013.2 hPa."}, {"id": 27, "question": "An altitude of 4,500 ft QNH should be pronounced as:", "correct": "a", "a": "FOUR THOUSAND FIVE HUNDRED FEET.", "b": "FORTY FIVE THOUSAND.", "c": "FOUR POINT FIVE.", "d": "FORTY FIVE HUNDRED FEET ABOVE SEA LEVEL."}, {"id": 28, "question": "An altitude of 5,000 ft should be broadcasted as:", "correct": "a", "a": "FIVE THOUSAND FEET.", "b": "FIVE NULL NULL NULL.", "c": "FIVE ZERO ZERO ZERO FEET.", "d": "FIFTY HUNDRED."}, {"id": 29, "question": "An altitude of 11,000 ft should be broadcasted as:", "correct": "a", "a": "WUN WUN THOUSAND FEET.", "b": "ELEVEN THOUSAND FEET.", "c": "WUN WUN ZERO ZERO ZERO FEET.", "d": "ELEVEN THOUSAND ZERO FEET."}, {"id": 30, "question": "Altitude 10,500 ft should be broadcasted as:", "correct": "a", "a": "TEN THOUSAND FIVE HUNDRED FEET.", "b": "TEN POINT FIVE.", "c": "WUN ZERO THOUSAND FIVE HUNDRED FEET.", "d": "WUN ZERO FIVE HUNDRED FEET ABOVE SEA LEVEL."}, {"id": 31, "question": "COMM frequency 118.125 MHz should be transmitted by pronouncing:", "correct": "a", "a": "WUN WUN EIGHT DECIMAL WUN TOO, using 5/4 Digit Phraseology or WUN WUN EIGHT DECIMAL WUN TOO FIFE using 6/4 Digit Phraseology.", "b": "WUN WUN EIGHT WUN TOO FIFE.", "c": "WUN WUN EIGHT DECIMAL WUN TOO.", "d": "WUN WUN EIGHT POINT WUN TOO FIFE."}, {"id": 32, "question": "When broadcasting numbers in radiotelephony, the number 583 is transmitted as:", "correct": "a", "a": "FIVE EIGHT THREE.", "b": "FIVE HUNDRED EIGHTY THREE.", "c": "FIFTY EIGHT THREE.", "d": "FIVE HUNDRED EIGHT THREE."}, {"id": 33, "question": "When broadcasting numbers in radiotelephony, the number 496 is transmitted as:", "correct": "a", "a": "FOUR NINER SIX.", "b": "FOUR HUNDRED AND NINETY SIX.", "c": "FOUR HUNDRED AND NINER SIX.", "d": "FOUR NINETY SIX."}, {"id": 34, "question": "When broadcasting numbers in radiotelephony, the number 4501 is transmitted as:", "correct": "a", "a": "FOUR FIVE ZERO WUN.", "b": "FOUR THOUSAND FIVE HUNDRED WUN.", "c": "FOUR FIVE ZERO POINT WUN.", "d": "FORTY FIVE HUNDRED WUN."}, {"id": 35, "question": "The number 600 should be broadcasted as:", "correct": "a", "a": "SIX HUNDRED.", "b": "SIX ZERO ZERO.", "c": "SIX NULL NULL.", "d": "SIXTY ZERO."}, {"id": 36, "question": "COMM frequency 118.0 MHz should be broadcasted by pronouncing:", "correct": "a", "a": "WUN WUN EIGHT DECIMAL ZERO.", "b": "WUN HUNDRED EIGHTEEN POINT NULL.", "c": "WUN WUN EIGHT.", "d": "WUN WUN EIGHT POINT ZERO."}, {"id": 37, "question": "In aviation broadcasting, how do we pronounce COMM frequency 118.1 MHz?", "correct": "a", "a": "WUN WUN EIGHT DECIMAL WUN.", "b": "WUN WUN EIGHT POINT WUN.", "c": "WUN HUNDRED ELEVEN POINT WUN.", "d": "WUN WUN EIGHT WUN."}, {"id": 38, "question": "In aviation broadcasting, how do we pronounce COMM frequency 118.150 MHz?", "correct": "a", "a": "WUN WUN EIGHT DECIMAL WUN FIFE.", "b": "WUN WUN EIGHT DECIMAL WUN FIFE ZERO.", "c": "WUN WUN EIGHT POINT WUN FIFE ZERO.", "d": "WUN WUN EIGHT DASH WUN FIFE."}, {"id": 39, "question": "Frequency 121.725 MHz should be transmitted as:", "correct": "a", "a": "WUN TOO WUN DECIMAL SEVEN TOO FIFE, using 6/4 Digit Phraseology, and WUN TOO WUN DECIMAL SEVEN TOO, using 5/4 Digit Phraseology.", "b": "WUN TWO WUN POINT SEVEN TWO.", "c": "WUN TOO WUN POINT SEVEN TOO.", "d": "WUN TWENTY WUN DECIMAL SEVEN TWENTY FIVE."}, {"id": 40, "question": "The pilot may abbreviate the call sign of an aircraft:", "correct": "a", "a": "Only after the ground station has used the abbreviated call sign.", "b": "Not at all.", "c": "After radio contact with the ground station has been established.", "d": "Any time at his discretion."}, {"id": 41, "question": "A time of 1020 hours is transmitted as:", "correct": "a", "a": "'ONE ZERO TWO ZERO' or 'TWO ZERO'.", "b": "TEN TWENTY HOURS.", "c": "TEN TWO ZERO.", "d": "ONE ZERO TWENTY."}, {"id": 42, "question": "A time of 1020 hours is transmitted at 0910 hours as:", "correct": "a", "a": "'ONE ZERO TWO ZERO'.", "b": "TEN TWENTY HOURS.", "c": "TEN TWO ZERO.", "d": "'TWO ZERO'."}, {"id": 43, "question": "Phonetic transcription for the label 70-VEL pronounced as:", "correct": "a", "a": "SEVEN, ZERO, VICTOR, ECHO, LIMA.", "b": "SEVEN, ZERO, WHISKEY, ECHO, LIMA.", "c": "SEVENTY, VICTOR, ECHO, LIMA.", "d": "SEVEN, ZERO, VICTOR, EASY, LIMA."}, {"id": 44, "question": "Phonetic transcription for the label EXTRA pronounced as:", "correct": "a", "a": "ECHO, XRAY, TANGO, ROMEO, ALFA.", "b": "EXTRA.", "c": "ECHO, XRAY, TORONTO, ROMEO, ALFA.", "d": "ECHO, IKS, TORONTO, ROMEO, ALFA."}, {"id": 45, "question": "Phonetic transcription for the label C-MNXY pronounced as:", "correct": "a", "a": "CHARLIE, MIKE, NOVEMBER, XRAY, YANKEE.", "b": "COCA, MIKE, NECTAR, XRAY, YANKEE.", "c": "CHARLIE, METRO, NOVEMBER, EXTRA, YANKEE.", "d": "COCA, MIKE, NOVEMBER, XRAY, YANKEE."}, {"id": 46, "question": "Phonetic transcription for the label B9-DFF pronounced as:", "correct": "a", "a": "BRAVO, NINER, DELTA, FOXTROT, FOXTROT.", "b": "BRAVO, NINE, DELTA, FOXTROT, FOXTROT.", "c": "BRAVO, NINE, DELTA, TWO FOXTROT.", "d": "BRAVO, NINER, DELTA, TWO FOXTROT."}, {"id": 47, "question": "A pilot shall ask for a QFE as follows:", "correct": "a", "a": "Request QUEBEC FOXTROT ECHO.", "b": "Request QUEBEC FOX ECHO.", "c": "Request QUEEN FOX EASY.", "d": "Request QUEBEC FOX EASY."}, {"id": 48, "question": "What is the correct way of spelling out FRI-VOR in a radio message?", "correct": "a", "a": "FOXTROT ROMEO INDIA VOR.", "b": "FOXTROT ROMEO INDIA VICTOR OSCAR ROMEO.", "c": "FRIDAY VOR.", "d": "FOX ROMEO INDIA VOR."}, {"id": 49, "question": "The abbreviation for a control zone is:", "correct": "a", "a": "CTR.", "b": "MATZ.", "c": "CTA.", "d": "CTZ."}, {"id": 50, "question": "Which of the following abbreviations must be broadcast to individual letters?", "correct": "a", "a": "Y-BC.", "b": "ILS.", "c": "RVR.", "d": "CAVOK."}, {"id": 51, "question": "What is the Q code for the measurement of relative heights above an airfield?", "correct": "a", "a": "QFE.", "b": "ELT.", "c": "QNH.", "d": "QBA."}, {"id": 52, "question": "What is the Q code for the measurement of altitude?", "correct": "a", "a": "QNH.", "b": "QFF.", "c": "QNE.", "d": "QFE."}, {"id": 53, "question": "What is the Q code for the measurement of flight level?", "correct": "a", "a": "QNE.", "b": "QFF.", "c": "QNH.", "d": "QFE."}, {"id": 54, "question": "What is the Q code for a magnetic bearing TO a station?", "correct": "a", "a": "QDM.", "b": "QDR.", "c": "QGH.", "d": "QNH."}, {"id": 55, "question": "What is the Q code for a magnetic bearing FROM a station?", "correct": "a", "a": "QDR.", "b": "QGH.", "c": "QDM.", "d": "QNH."}, {"id": 56, "question": "What is the Q code for a true bearing from a station?", "correct": "a", "a": "QTE.", "b": "QDR.", "c": "QNH.", "d": "QFE."}, {"id": 57, "question": "What does the phrase 'QDM' mean?", "correct": "a", "a": "Magnetic direction from an aircraft to the goniometric station.", "b": "Atmospheric pressure at airfield elevation.", "c": "Atmospheric pressure at airfield elevation, reduced to sea level.", "d": "Actual weather at an airfield."}, {"id": 58, "question": "What does 'QNH' mean?", "correct": "a", "a": "Altimeter sub-scale setting to obtain elevation when on ground.", "b": "Atmospheric pressure at aerodrome elevation.", "c": "True bearing from a station.", "d": "Magnetic bearing from a station."}, {"id": 59, "question": "If you want to request a service from a ground station:", "correct": "a", "a": "You must do so in your initial call.", "b": "You must do so after you have established two way communications with the station.", "c": "You must monitor the ground station frequency until you hear the ground station giving the service you require to another aircraft.", "d": "As a private pilot you are not entitled to request a service."}, {"id": 60, "question": "Which of the following lists are all ATC messages that must be read back in full?", "correct": "a", "a": "Clearance to enter, land on, take-off on, backtrack, cross or hold short of an active runway; SSR instructions.", "b": "Level instructions, altimeter settings, surface wind, runway information.", "c": "ATC route clearances, runway clearances, actual weather reports.", "d": "VOR information, frequency changes, type of radar service."}, {"id": 61, "question": "A pilot is required to read back:", "correct": "a", "a": "SSR operating instructions, take-off clearances, altimeter settings, VDF information, frequency changes.", "b": "ATC route clearances, runway clearances, conditional clearances, actual weather reports.", "c": "Altimeter settings, taxi information, terminal weather, runway clearances, approach aid serviceability.", "d": "Route clearances, speed instructions, weather reports, taxi clearances, runway state information."}, {"id": 62, "question": "In ground to air communications the controller will always:", "correct": "a", "a": "Say your callsign first.", "b": "Say your callsign last.", "c": "Say your callsign first only on initial contact.", "d": "Omit your callsign after initial contact."}, {"id": 63, "question": "Callsign of ATC for control of aircraft and vehicles on manoeuvring area?", "correct": "a", "a": "GROUND.", "b": "TOWER.", "c": "DISPATCH.", "d": "APRON."}, {"id": 64, "question": "The prescribed phrase for obtaining a permission to taxi to the runway for departure is:", "correct": "a", "a": "REQUEST TAXI.", "b": "WHAT IS MY TAXI CLEARANCE.", "c": "REQUEST PERMISSION TO TAXI.", "d": "REQUEST TAXI CLEARANCE."}, {"id": 65, "question": "When a control tower transmits 'REPORT DOWNWIND', the pilot is instructed to report:", "correct": "a", "a": "Aircraft position in the traffic pattern between the second turn and the third turn, abeam of the halfway point of the runway.", "b": "Estimated wind direction and velocity at the altitude of flying.", "c": "Maximum allowed tail wind for landing.", "d": "Aircraft position 'final' in traffic pattern."}, {"id": 66, "question": "The controller wants to obtain information about the level at which an aircraft is flying, using the phrase:", "correct": "a", "a": "REPORT LEVEL.", "b": "WHAT IS YOUR LEVEL.", "c": "REQUEST LEVEL.", "d": "TRANSMIT YOUR LEVEL."}, {"id": 67, "question": "Which phrase is used by ATC when advising the pilot that the position report over the compulsory reporting point is not required?", "correct": "a", "a": "OMIT POSITION REPORT OVER ... (fix).", "b": "CANCEL POSITION REPORT OVER ... (fix).", "c": "NO POSITION REPORT OVER ... (fix).", "d": "DO NOT REPORT OVER ... (fix)."}, {"id": 68, "question": "When the aircraft pilot is not able to execute a command, control informs the flight with the phrase:", "correct": "a", "a": "UNABLE TO COMPLY.", "b": "UNABLE TO ACCEPT.", "c": "REQUEST RECLEARANCE.", "d": "I CANNOT COMPLY."}, {"id": 69, "question": "How do you ask for a message to be repeated?", "correct": "a", "a": "SAY AGAIN.", "b": "PLEASE SAY THE MESSAGE AGAIN.", "c": "REPEAT MESSAGE.", "d": "SAY ALL AGAIN."}, {"id": 70, "question": "Which of the following messages has the highest priority?", "correct": "a", "a": "REQUEST QDM.", "b": "TAXI TO THE REFUELLING PUMPS.", "c": "CAUTION, WORK IN PROGRESS ON THE TAXIWAY.", "d": "REPORT FINAL NUMBER 1."}, {"id": 71, "question": "If a controller passes an instruction and you understand it and will comply, the standard reply is:", "correct": "a", "a": "WILCO.", "b": "VERIFY.", "c": "ROGER.", "d": "CONFIRM."}, {"id": 72, "question": "If the pilot is unable to make contact with a station on a designated frequency, then he should:", "correct": "a", "a": "Try transmitting on another related frequency.", "b": "Make a blind transmission.", "c": "Transmit on 121.5 MHz.", "d": "Transmit using words twice."}, {"id": 73, "question": "When transmitting a message preceded by 'Transmitting blind due to receiver failure', the aircraft station shall also:", "correct": "a", "a": "Advise the time of its next intended transmission.", "b": "Proceed to the alternate airport.", "c": "Hold for 5 minutes at its present position.", "d": "Squawk 7600."}, {"id": 74, "question": "At the holding point, ready to enter the runway and take off. What RT phraseology would you use to inform ATC of your readiness?", "correct": "a", "a": "(CALLSIGN) READY FOR DEPARTURE.", "b": "(CALLSIGN) READY FOR TAKE OFF.", "c": "(CALLSIGN) READY FOR LINE UP.", "d": "(CALLSIGN) READY TO PROCEED."}, {"id": 75, "question": "If the pilot cannot follow the instructions and orders, he should advise ATC by transmitting:", "correct": "a", "a": "UNABLE TO COMPLY.", "b": "UNABLE TO ACCEPT.", "c": "REQUEST RECLEARANCE.", "d": "I CANNOT COMPLY."}, {"id": 76, "question": "You are flying at FL50 in YU-ABC. When asked by the controller to report your level, what is the correct response?", "correct": "a", "a": "MAINTAINING FL50, Y-BC.", "b": "FL50, Y-BC.", "c": "AT FL50, Y-BC.", "d": "Y-BC, FL50."}, {"id": 77, "question": "On a long straight-in approach to land, the call 'Long Final' would be made at a range of about:", "correct": "a", "a": "8 nm.", "b": "2 nm.", "c": "4 nm.", "d": "25 nm."}, {"id": 78, "question": "On the final approach, the FINAL call should be made at a range of about:", "correct": "a", "a": "4 nm.", "b": "2 nm.", "c": "8 nm.", "d": "25 nm."}, {"id": 79, "question": "You are flying on a NE heading at 2500 ft. You would report your heading and level as:", "correct": "a", "a": "HEADING 045 AT TOO TOUSAND FIFE HUNDRED FEET.", "b": "HEADING 045 AT TOO FIFE ZERO ZERO FEET.", "c": "HEADING 045 AT 25 HUNDRED FEET.", "d": "FLYING AT TOO TOUSAND FIFE HUNDRED FEET ON HEADING 045."}, {"id": 80, "question": "How would you correctly reply to the ATC instruction 'Y-CD, Change to Belgrade Tower, 118.1'?", "correct": "a", "a": "WUN WUN EIGHT DECIMAL WUN, YANKEE CHARLIE DELTA.", "b": "Y-CD, 118.1.", "c": "CHANGE TO BELGRADE TOWER 118.1, Y-CD.", "d": "WILCO, Y-CD."}, {"id": 81, "question": "Which of the options below gives a correct order and content for a Position Report?", "correct": "a", "a": "Call Sign, Position, Time, Level or Altitude, Next Position with ETA.", "b": "Call Sign, Route, Position, Level, ETA next Position, Heading, Request.", "c": "Position, Level or Altitude, Time, ETA at Next Position, Call Sign.", "d": "Route, Position, Time, Level or Altitude, ETA at Next Position, Call Sign."}, {"id": 82, "question": "ATC will give a descent instruction by using the phrase:", "correct": "a", "a": "DESCEND TO FL...", "b": "MAINTAIN FL...", "c": "LEAVE FL... FOR FL...", "d": "CLEARED FL..."}, {"id": 83, "question": "ATC will give a climb instruction by using the phrase:", "correct": "a", "a": "CLIMB TO FL...", "b": "MAINTAIN FL...", "c": "LEAVE FL... FOR FL...", "d": "CLEARED FL..."}, {"id": 84, "question": "An aircraft cleared to climb to FL100 needs to level off at FL80 for a few minutes. ATC will give this instruction using the phrase:", "correct": "a", "a": "STOP CLIMB AT FL80.", "b": "LEVEL OFF AT FL80.", "c": "MAINTAIN FL80.", "d": "CLEARED FL80."}, {"id": 85, "question": "When asked by ATC 'Are you able to maintain FL 40?' the correct reply contains the phrase:", "correct": "a", "a": "AFFIRM or NEGATIVE.", "b": "ROGER.", "c": "WILCO.", "d": "NO SIR."}, {"id": 86, "question": "When requesting a special VFR clearance in flight, ATC must be given details of:", "correct": "a", "a": "Callsign, type, intentions and ETA at entry point.", "b": "Callsign, type, TAS, ETA at entry point and destination.", "c": "Callsign, type, position, heading, intentions and ETA at entry point.", "d": "Callsign, altitude, heading and ETA at entry point."}, {"id": 87, "question": "You have just landed at a towered airport and the tower tells you to contact ground when clear of the runway. You are considered clear of the runway when:", "correct": "a", "a": "All parts of the aircraft have crossed the hold line.", "b": "The aircraft cockpit is clear of the hold line.", "c": "The tail of the aircraft is off the runway edge.", "d": "The aircraft has come to a complete stop."}, {"id": 88, "question": "If requested by the control tower to report having crossed the runway, the pilot has to use the phrase:", "correct": "a", "a": "RUNWAY VACATED.", "b": "I HAVE LEFT THE RUNWAY.", "c": "I AM CLEAR OF RUNWAY.", "d": "I AM BEYOND THE RUNWAY."}, {"id": 89, "question": "A 'downwind' call is made:", "correct": "a", "a": "At any position on downwind leg.", "b": "Abeam the upwind end of the runway.", "c": "As soon as the aircraft is on the downwind leg.", "d": "Just before turning on to base leg."}, {"id": 90, "question": "Report position base leg is done:", "correct": "a", "a": "Only when required by control.", "b": "Always.", "c": "Only when the pilot decides to.", "d": "Never \u2014 it is not required."}, {"id": 91, "question": "Correct phrase for a final report is:", "correct": "a", "a": "Y-BC ON FINAL.", "b": "WE ARE APPROACHING FINAL.", "c": "VR\u0160AC TOWER, FINAL.", "d": "Y-BC, FINAL APPROACH."}, {"id": 92, "question": "That portion of the runway/aerodrome identified by the letter C in Fig. PPL Kom-1 is called?", "correct": "a", "a": "LINE-UP POSITION.", "b": "START-UP POSITION.", "c": "APRON.", "d": "BASE LEG."}, {"id": 99, "question": "Taxi instructions issued by the controller will include a clearance limit which will normally be:", "correct": "a", "a": "The holding point of the runway in use.", "b": "The threshold of the runway in use.", "c": "The entrance to the parking area.", "d": "The runway exit point."}, {"id": 100, "question": "The phrase 'CLEARANCE EXPIRES AT 02 35' means that the pilot:", "correct": "a", "a": "Will be granted permission for take-off by 02:35.", "b": "May take off after 02:35.", "c": "Shall wait until 02:35 asking for departure clearance.", "d": "Shall start up engines at 02:35."}, {"id": 101, "question": "Which phrase is used to annul the previously transmitted clearance?", "correct": "a", "a": "DISREGARD.", "b": "RECLEARED.", "c": "NEGATIVE.", "d": "CANCEL."}, {"id": 102, "question": "The permission to taxi to the takeoff position will be phrased:", "correct": "a", "a": "LINE UP.", "b": "TAXI TO THE TAKEOFF POSITION.", "c": "CLEARED INTO POSITION AND HOLD.", "d": "CONTINUE TO TAKEOFF POSITION AND HOLD."}, {"id": 103, "question": "A pilot receives: 'YU-ABC, After departure cleared to zone boundary via Route Bravo, Climb to Altitude 2,500 feet, QNH 1005, Squawk 6521.' What type of clearance is this?", "correct": "d", "a": "A Route Clearance.", "b": "A Take-off Clearance.", "c": "A Conditional Clearance.", "d": "A Departure Clearance."}, {"id": 104, "question": "If the pilot has been instructed 'SQUAWK 1200' he should set code 1200 on the transponder and:", "correct": "a", "a": "Move the switch to 'ON' or 'ALT', if not yet selected.", "b": "Push the button 'IDENT'.", "c": "Move the switch to 'STANDBY'.", "d": "Move the switch to 'STANDBY' and depress the 'IDENT' button."}, {"id": 105, "question": "The phrase which instructs the pilot to set transponder code A6620 again is:", "correct": "a", "a": "RECYCLE ALPHA 6620.", "b": "SQUAWK AGAIN ALPHA 6620.", "c": "SWITCH ON ALPHA 6620.", "d": "CONFIRM SQUAWKING ALPHA 6620."}, {"id": 106, "question": "If a transponder does not transmit on mode C although expected, ATC will instruct the pilot to switch on mode C using the phrase:", "correct": "a", "a": "SQUAWK CHARLIE.", "b": "SQUAWK ALTIMETER.", "c": "SQUAWK PRESSURE ALTITUDE.", "d": "TRANSMIT ON MODE CHARLIE."}, {"id": 107, "question": "You receive the message 'YU-ABC Squawk Ident'. You should:", "correct": "a", "a": "Operate the special position identification on the SSR transponder.", "b": "Select STANDBY on the SSR transponder.", "c": "Select ALT - altitude reporting facility (Mode C) on the SSR transponder.", "d": "Reply giving your callsign."}, {"id": 108, "question": "The phrase 'Squawk Charlie' means:", "correct": "a", "a": "Select 'ALT' on the transponder.", "b": "Transponder ON.", "c": "Confirm the transponder is selected ON.", "d": "Select 7700 on the transponder."}, {"id": 109, "question": "With the SSR transponder selected ON, the ATC message 'YU-ABC verify your level' would be made to:", "correct": "a", "a": "Check and confirm the accuracy of the Mode C level information displayed to the controller.", "b": "Identify aircraft position.", "c": "Check your altimeter setting.", "d": "Check with the pilot that Mode C is selected ON."}, {"id": 110, "question": "In a radar environment, heading information given by the pilot and heading instructions given by controllers are in:", "correct": "a", "a": "Degrees magnetic.", "b": "Degrees true.", "c": "Degrees Celsius.", "d": "Degrees Absolute."}, {"id": 111, "question": "In the event of a radio failure the SSR transponder should be set to:", "correct": "a", "a": "7600.", "b": "7700.", "c": "7500.", "d": "7000."}, {"id": 112, "question": "A pilot squawking A 7700 indicates to the ground station that:", "correct": "a", "a": "His aircraft is in an emergency situation.", "b": "His radio is unserviceable.", "c": "He has a sick person on board.", "d": "His flight is being hijacked."}, {"id": 113, "question": "Which transponder mode gives an altitude readout?", "correct": "a", "a": "Mode C.", "b": "Mode A.", "c": "Mode B.", "d": "Mode D."}, {"id": 114, "question": "If you are flying an aircraft without a transponder, what would you say if asked to SQUAWK?", "correct": "a", "a": "NEGATIVE TRANSPONDER.", "b": "NEGATIVE SQUAWK.", "c": "I DO NOT HAVE A TRANSPONDER.", "d": "NO TRANSPONDER."}, {"id": 115, "question": "By which international phrase will the intercepting aircraft allow the intercepted aircraft to continue the flight?", "correct": "a", "a": "PROCEED.", "b": "CALL SIGN.", "c": "DESCEND.", "d": "FOLLOW."}, {"id": 116, "question": "The phrase 'CALL SIGN', passed by radio from an intercepting aircraft pilot to the intercepted aircraft pilot, means:", "correct": "a", "a": "What is your call sign?", "b": "Call the air traffic control!", "c": "Transmit an emergency call!", "d": "Return to your airport of origin!"}, {"id": 117, "question": "What is the meaning of the phrase 'YOU LAND', passed by radio from the pilot of an intercepting aircraft to the pilot of an intercepted aircraft?", "correct": "a", "a": "Land at this aerodrome.", "b": "Report the name of your aerodrome of origin.", "c": "Follow me.", "d": "You may proceed."}, {"id": 118, "question": "Which is the correct phrase used by the pilot of an intercepted aircraft to convey inability to comply with instructions from the intercepting aircraft?", "correct": "a", "a": "CAN NOT.", "b": "AM LOST.", "c": "MAYDAY.", "d": "WILCO."}, {"id": 119, "question": "The pilot of an intercepted aircraft reports to an intercepting aircraft that he is lost and his position is uncertain by transmitting:", "correct": "a", "a": "AM LOST.", "b": "WILCO.", "c": "CAN NOT.", "d": "MAYDAY."}, {"id": 120, "question": "Which frequency is intended for conversation between the intercepting aircraft and the intercepted aircraft?", "correct": "a", "a": "International emergency frequency 121.5 MHz.", "b": "Local air force frequency.", "c": "Local emergency frequency.", "d": "Frequency air-to-air."}, {"id": 121, "question": "By which international phrase will the intercepting aircraft direct the intercepted aircraft to follow him?", "correct": "a", "a": "FOLLOW.", "b": "PROCEED.", "c": "YOU LAND.", "d": "CALL SIGN."}, {"id": 122, "question": "What are the two classified states of Emergency Message?", "correct": "a", "a": "Distress and Urgency.", "b": "MAYDAY and PAN PAN.", "c": "Emergency and Security.", "d": "Emergency and PAN PAN."}, {"id": 123, "question": "DISTRESS is defined as a condition:", "correct": "d", "a": "That threatens serious or immediate danger and requires immediate assistance.", "b": "That threatens serious or immediate danger but does not require urgent assistance.", "c": "Concerning the safety of an aircraft or person within sight, but which does not require immediate assistance.", "d": "Concerning the safety of an aircraft or person within sight and requiring immediate assistance."}, {"id": 124, "question": "URGENCY is defined as a condition:", "correct": "a", "a": "Concerning the safety of an aircraft or other vehicle or of some person on board or within sight, but which does not require immediate assistance.", "b": "Concerning the safety of an aircraft or person within sight and requiring immediate assistance.", "c": "That threatens serious or immediate danger and requires immediate assistance.", "d": "That threatens serious or immediate danger but does not require urgent assistance."}, {"id": 125, "question": "The frequency used for the first transmission of a 'MAYDAY' call should be:", "correct": "a", "a": "The frequency currently in use.", "b": "The distress frequency 121.5 MHz.", "c": "Approach frequency of the nearest airfield.", "d": "Any international distress frequency."}, {"id": 126, "question": "If a pilot intends to transmit an urgent message concerning safety of another aircraft, he should begin his broadcast with:", "correct": "a", "a": "The spoken word 'PANPAN'.", "b": "The spoken word 'MAYDAY'.", "c": "Morse code 'XXX'.", "d": "Morse code 'MAYDAY'."}, {"id": 127, "question": "During a flight you notice a hang glider pilot apparently hung in his harnesses on tree canopies. You decide to report the accident to the nearest airport. The phrase to begin your message is:", "correct": "a", "a": "PANPAN, PANPAN, PANPAN.", "b": "EMERGENCY, EMERGENCY, EMERGENCY.", "c": "MAYDAY, MAYDAY, MAYDAY.", "d": "MEDICAL, MEDICAL, MEDICAL."}, {"id": 128, "question": "During a cross-country flight you notice an emergency landing of a light aeroplane on a meadow. The aircraft seems undamaged and the pilot unhurt. Which phrase will you use at the beginning of your report?", "correct": "a", "a": "PANPAN, PANPAN, PANPAN.", "b": "HELPHELP, HELPHELP, HELPHELP.", "c": "MAYDAY, MAYDAY, MAYDAY.", "d": "EMERGENCY, EMERGENCY, EMERGENCY."}, {"id": 129, "question": "Which radiotelephony phrase means 'WE ARE IN GRAVE AND IMMINENT DANGER, AND IMMEDIATE ASSISTANCE IS REQUIRED'?", "correct": "a", "a": "Spoken word 'MAYDAY'.", "b": "Word 'MAYDAY' transmitted by Morse code.", "c": "Spoken word 'SECURITY'.", "d": "Spoken word 'PANPAN'."}, {"id": 130, "question": "The phrase with which a radiotelephony distress message is started is:", "correct": "a", "a": "MAYDAY, MAYDAY, MAYDAY.", "b": "PANPAN, PANPAN, PANPAN.", "c": "EMERGENCY, EMERGENCY, EMERGENCY.", "d": "HELP, HELP, HELP."}, {"id": 131, "question": "At an outlanding you damaged your aircraft and hurt yourself with nobody in the vicinity to assist. Which international phrase should start your radiotelephony call for help?", "correct": "a", "a": "MAYDAY, MAYDAY, MAYDAY.", "b": "PANPAN, PANPAN, PANPAN.", "c": "MEDICAL, MEDICAL, MEDICAL.", "d": "EMERGENCY, EMERGENCY, EMERGENCY."}, {"id": 132, "question": "Which of the following frequencies is the international emergency frequency?", "correct": "a", "a": "121.500 MHz.", "b": "122.500 MHz.", "c": "121.050 MHz.", "d": "122.050 MHz."}, {"id": 133, "question": "The frequency 121.5 MHz is:", "correct": "a", "a": "An international emergency frequency.", "b": "A regional guard frequency.", "c": "A regional emergency frequency.", "d": "A frequency for air-to-air communication."}, {"id": 134, "question": "When an aircraft fails to establish communication with an aeronautical station, the aircraft has to transmit its message twice, preceded by the phrase:", "correct": "a", "a": "TRANSMITTING BLIND.", "b": "MAYDAY.", "c": "PANPAN.", "d": "WORDS TWICE."}, {"id": 135, "question": "On hearing a Distress message a pilot must:", "correct": "a", "a": "Maintain radio silence and monitor the frequency to ensure assistance is provided.", "b": "Acknowledge the message immediately and standby to relay further messages if required.", "c": "Change frequency because radio silence will be imposed on the frequency in use.", "d": "Take control of the situation and coordinate the rescue operation."}, {"id": 136, "question": "Radio test transmissions should take the following form:", "correct": "a", "a": "BEOGRAD TOWER YU-ABC Radio check 118.1.", "b": "BEOGRAD TOWER YU-ABC 118.1 Do you read?", "c": "BEOGRAD TOWER YU-ABC How do you read?", "d": "BEOGRAD TOWER YU-ABC Readability check 118.1."}, {"id": 137, "question": "In order to make your communications more effective, you should:", "correct": "a", "a": "Use a constant speaking volume.", "b": "Use words twice.", "c": "Modulate your voice.", "d": "Call break between sentences."}, {"id": 138, "question": "Using the readability scale, 'readability 5' means:", "correct": "a", "a": "Perfectly readable.", "b": "Readable but with difficulty.", "c": "Unreadable.", "d": "Readable."}, {"id": 139, "question": "Using the readability scale, 'readability 4' means:", "correct": "a", "a": "Readable.", "b": "Readable with difficulty.", "c": "Readable with background.", "d": "Unreadable."}, {"id": 140, "question": "Using the readability scale, 'readability 3' means:", "correct": "a", "a": "Readable but with difficulty.", "b": "Unreadable.", "c": "Perfectly readable.", "d": "Readable with background."}, {"id": 141, "question": "Using the readability scale, 'readability 2' means:", "correct": "a", "a": "Readable now and then.", "b": "Unreadable.", "c": "Perfectly readable.", "d": "Readable with background."}, {"id": 142, "question": "Using the readability scale, 'readability 1' means:", "correct": "a", "a": "Unreadable.", "b": "Readable but with difficulty.", "c": "Perfectly readable.", "d": "Readable with background."}, {"id": 143, "question": "Which aeronautical communication service provides automated airfield and meteorological information for departing and arriving traffic?", "correct": "a", "a": "ATIS.", "b": "LARS.", "c": "AFIS.", "d": "FIS."}, {"id": 144, "question": "What are the three categories of aeronautical communication service?", "correct": "a", "a": "Air Ground Communication Service, Flight Information Service, Air Traffic Control.", "b": "Air, Land and Sea.", "c": "Approach, Tower, Ground.", "d": "IFR, VFR, SVFR."}, {"id": 145, "question": "If no ATIS is available, the pilot asks for departure information using the phrase:", "correct": "a", "a": "REQUEST DEPARTURE INFORMATION.", "b": "REQUEST DEPARTURE INSTRUCTIONS.", "c": "I WOULD LIKE DEPARTURE INFORMATION.", "d": "REPORT DEPARTURE INFORMATION."}, {"id": 146, "question": "A Radar Information Service (RIS) is an ATC service:", "correct": "a", "a": "In which the controller will inform the pilot of the bearing, distance and, if known, the altitude of conflicting traffic.", "b": "In which the controller will provide radar separation from all other traffic.", "c": "In which the controller will direct the aircraft to avoid the other traffic.", "d": "Which may only be used by aircraft flying in accordance with the instrument flight rules."}, {"id": 147, "question": "The abbreviation ATIS stands for:", "correct": "a", "a": "Automatic Terminal Information Service.", "b": "Aircraft Technical Information Service.", "c": "Air Traffic Information Service.", "d": "Aerodrome Traffic Information Service."}, {"id": 148, "question": "ATIS is to be found on:", "correct": "a", "a": "A discrete VHF or a VOR frequency.", "b": "The Approach frequency.", "c": "The Tower frequency.", "d": "The Ground frequency."}, {"id": 149, "question": "A radar advisory service will:", "correct": "b", "a": "Give you standard separation from all traffic.", "b": "Advise you of possible conflict.", "c": "Give you an air traffic control service.", "d": "Give you a radar approach."}, {"id": 150, "question": "The correct callsign of a station providing flight information service is the location followed by:", "correct": "a", "a": "INFORMATION.", "b": "HOMER.", "c": "CONTROL.", "d": "RADIO."}] },
  hp: { code:"HP", name:"Human Performance", questions:[{"id": 1, "question": "In the International Standard Atmosphere (ISA), as altitude increases in the troposphere, air density:", "correct": "a", "a": "Decreases.", "b": "Also increases.", "c": "Stays the same.", "d": "Will not be affected as air density is independent of altitude."}, {"id": 2, "question": "The International Standard Atmosphere (ISA) sea-level pressure is equal to:", "correct": "a", "a": "1013.25 mb.", "b": "1014.00 mb.", "c": "1014.25 Hpa.", "d": "50 inches of mercury."}, {"id": 3, "question": "Air in the atmosphere is made up of:", "correct": "a", "a": "Nitrogen (78 %), Oxygen (21%), Carbon Dioxide (0.03%) and Argon (1%).", "b": "Nitrogen (78%), Oxygen (21%), Carbon Dioxide (0.03%) and Hydrogen (1%).", "c": "Nitrogen (1%), Oxygen (78%), Carbon Dioxide (21%) and Argon (0.03%).", "d": "Nitrogen (21%), Oxygen (0.03%), Carbon Dioxide (78%) and Argon (1%)."}, {"id": 4, "question": "In the International Standard Atmosphere (ISA), as altitude increases in the Troposphere, temperature:", "correct": "a", "a": "Decreases.", "b": "Also increases.", "c": "Stays the same.", "d": "Will not be affected as it is independent of altitude."}, {"id": 5, "question": "If the atmospheric pressure decreases, the partial pressure of the oxygen in the atmosphere will:", "correct": "a", "a": "Decrease.", "b": "Increase.", "c": "Stay the same.", "d": "Not be affected as it is independent of atmospheric pressure."}, {"id": 6, "question": "In the international standard atmosphere (ISA), as altitude increases in the troposphere, pressure:", "correct": "a", "a": "Decreases.", "b": "Also increases.", "c": "Stays the same.", "d": "Will not be affected as pressure is independent of altitude."}, {"id": 7, "question": "At altitude, the volumetric proportion of oxygen in the atmosphere is:", "correct": "a", "a": "The same as at mean sea level (MSL).", "b": "Higher than at MSL.", "c": "Lower than at MSL.", "d": "Dependent on the actual altitude."}, {"id": 8, "question": "In the International Standard Atmosphere (ISA), as altitude increases in the Stratosphere, temperature:", "correct": "a", "a": "Remains almost constant at -56 degrees Celsius.", "b": "Also increases.", "c": "Decreases.", "d": "Fluctuates between positive and negative temperatures."}, {"id": 9, "question": "Which gas, which is absorbed by the body during normal breathing, plays an important role in decompression sickness?", "correct": "a", "a": "Nitrogen.", "b": "Oxygen.", "c": "Carbon Dioxide.", "d": "Carbon Monoxide."}, {"id": 10, "question": "After donating blood, what is the minimum time a pilot should wait before flying?", "correct": "a", "a": "24 hours.", "b": "2 hours.", "c": "12 hours.", "d": "48 hours."}, {"id": 11, "question": "Blood pressure may be too high due to:", "correct": "a", "a": "All of the above.", "b": "Age.", "c": "Stress.", "d": "Smoking."}, {"id": 12, "question": "Which body system is responsible for distributing oxygen around the body?", "correct": "a", "a": "The Circulatory System.", "b": "The Nervous System.", "c": "The Respiratory System.", "d": "The Oxidation System."}, {"id": 13, "question": "The blood carries ________ around the body and removes _______ from the body with the exchange occurring in the ____________.", "correct": "a", "a": "Oxygen / Carbon Dioxide / Capillaries.", "b": "Carbon / Dioxide / Oxygen Veins.", "c": "Oxygen / Carbon Dioxide / Arteries.", "d": "Carbon Dioxide / Oxygen / Capillaries."}, {"id": 14, "question": "Which part of the nervous system usually controls breathing?", "correct": "a", "a": "The Autonomic Nervous System.", "b": "The Central Nervous System.", "c": "The Peripheral Nervous System.", "d": "All of the above."}, {"id": 15, "question": "The maximum recommended levels of alcohol consumption per week are _____ for men and _____ for women.", "correct": "a", "a": "21 units / 14 units.", "b": "14 units / 21 units.", "c": "3 units / 7 units.", "d": "7 units / 3 units."}, {"id": 16, "question": "Brain cells that have been deprived of oxygen will start to die in:", "correct": "a", "a": "2 minutes.", "b": "2 seconds.", "c": "1/2 hour.", "d": "2 hours."}, {"id": 17, "question": "Which of the following gases regulate the rate and depth of breathing, depending on the levels at which the gas is present in the blood?", "correct": "a", "a": "Carbon Dioxide.", "b": "Oxygen.", "c": "Nitrogen.", "d": "Carbon Monoxide."}, {"id": 18, "question": "When a person is experiencing stress or fear, adrenaline is released into the blood stream causing immediate:", "correct": "a", "a": "Increase in the pulse-rate.", "b": "Fatigue.", "c": "Loss of consciousness.", "d": "Decrease in the pulse-rate."}, {"id": 19, "question": "Approximately how long does it take a person to dissipate one unit of alcohol from the blood?", "correct": "a", "a": "1 hour.", "b": "1/2 hour.", "c": "2 hours.", "d": "12 hours."}, {"id": 20, "question": "Hemoglobin in red blood cells is more readily attracted to _________ than __________.", "correct": "a", "a": "Carbon Monoxide / Oxygen.", "b": "Nitrogen / Oxygen.", "c": "Oxygen / Nitrogen.", "d": "Carbon Dioxide / Nitrogen."}, {"id": 21, "question": "Which organ controls all other bodily functions?", "correct": "a", "a": "The brain.", "b": "The heart.", "c": "The lungs.", "d": "The spinal cord."}, {"id": 22, "question": "The condition whereby the body does not have enough oxygen to function correctly is known as:", "correct": "a", "a": "Hypoxia.", "b": "Hypotension.", "c": "Hyperventilation.", "d": "Hyperglycemia."}, {"id": 23, "question": "A likely symptom, or likely symptoms, of Hypoxia might be:", "correct": "d", "a": "Increased heart rate.", "b": "Cyanosis.", "c": "Formication.", "d": "All of the above."}, {"id": 24, "question": "Above what altitude do pilots need to breathe supplementary oxygen?", "correct": "a", "a": "10,000 ft.", "b": "2,000 ft.", "c": "8,000 ft.", "d": "20,000 ft."}, {"id": 25, "question": "Compared to a non-smoker, someone who smokes is likely to experience the effects of hypoxia at:", "correct": "a", "a": "A lower altitude.", "b": "A higher altitude.", "c": "The same altitude.", "d": "Any altitude."}, {"id": 26, "question": "The effects of Hypoxia can be increased by:", "correct": "a", "a": "All of the above.", "b": "Increased altitude.", "c": "Increased temperature.", "d": "Alcohol."}, {"id": 27, "question": "Your passenger begins suffering from a tingling sensation, dizziness and visual disorders and then becomes unconscious at 6,000 ft. Your passenger is probably suffering from:", "correct": "b", "a": "Hyperventilation.", "b": "Hypoxia.", "c": "Food poisoning.", "d": "Angina."}, {"id": 28, "question": "A likely symptom, or likely symptoms, of Hypoxia might be:", "correct": "a", "a": "All of the above.", "b": "Unconsciousness.", "c": "Impaired judgment.", "d": "Tingling fingers and toes."}, {"id": 29, "question": "For the pilot of an aircraft on a head-on collision course with a fast-moving jet, the image of the approaching jet will appear to grow in size in the following manner:", "correct": "a", "a": "Only slowly at first until just before impact when the image would grow in size very rapidly.", "b": "At a constant rate.", "c": "Very rapidly at first but then continue to grow at a constant rate.", "d": "Rapidly initially, and then remain at a constant size until impact."}, {"id": 30, "question": "Color-blindness or, more accurately, color-defective vision, is caused by:", "correct": "a", "a": "A defect in the structure of the color-sensitive cones in the retina.", "b": "A defect in the lens tissue of the eye.", "c": "Defective functioning of the ciliary muscles.", "d": "A foreshortened eyeball."}, {"id": 31, "question": "Hypermetropia and Myopia are normally caused by:", "correct": "a", "a": "A misshapened eye ball.", "b": "Eye strain.", "c": "Stress.", "d": "Badly fitting spectacles."}, {"id": 32, "question": "Hypermetropia is caused by a ____________ eyeball and treated by a _________ whereas Myopia is caused by a _____________ eyeball and treated with:", "correct": "a", "a": "Shortened / convex / lengthened / concave.", "b": "Lengthened / convex / shortened / concave.", "c": "Shortened / concave / lengthened / convex.", "d": "Lengthened / concave / shortened / convex."}, {"id": 33, "question": "Which of the following organs of the body supplies the single most dependable source of sensory information?", "correct": "a", "a": "The Eye.", "b": "The Ear.", "c": "The Nose.", "d": "The Neo-cortex."}, {"id": 34, "question": "What is the component of the eye responsible for peripheral vision and sensitive to low light levels?", "correct": "a", "a": "The Rods.", "b": "The Cones.", "c": "The Fovea.", "d": "The Retina."}, {"id": 35, "question": "Empty Field Myopia is a condition where the eyes naturally focus at a distance of approximately:", "correct": "a", "a": "1 - 2 meters.", "b": "Infinity.", "c": "20 - 500 meters.", "d": "At the horizon."}, {"id": 36, "question": "At night it is easier to focus on an object if you:", "correct": "a", "a": "Look slightly to one side of it.", "b": "Look directly at it.", "c": "Look about 50 degrees either side of it.", "d": "Look directly at it while holding your eyes open as wide as you can."}, {"id": 37, "question": "To lessen the danger of collision with an aircraft which might be in a pilot's blind spot and closing on a constant relative bearing, the pilot should:", "correct": "a", "a": "Carry out a systematic look out at all times.", "b": "Change heading by a few degrees every 10 minutes or so.", "c": "Roll the aircraft from right to left by a few degrees every 10 minutes or so.", "d": "Carry out periodic clearing turns."}, {"id": 38, "question": "Where is the blind spot?", "correct": "a", "a": "Where the optic nerve enters the Retina.", "b": "On the Iris.", "c": "On the Fovea.", "d": "On the edge of the Lens."}, {"id": 39, "question": "Accommodation is the power of the lens to focus rays of light from near objects onto the Fovea. Accommodation is controlled by:", "correct": "a", "a": "The Ciliary muscles.", "b": "The Iris.", "c": "The Rods and Cones.", "d": "The Retina."}, {"id": 40, "question": "Dark adaptation takes about ____________ for the Rods, and ______________ for the Cones.", "correct": "a", "a": "30 minutes / 7 minutes.", "b": "15 minutes / 20 minutes.", "c": "7 minutes / 30 minutes.", "d": "25 minutes / 45 minutes."}, {"id": 41, "question": "The power of accommodation in an eye:", "correct": "a", "a": "Is decreased as the elasticity of the lens decreases.", "b": "Is increased as the elasticity of the lens decreases.", "c": "Is not affected by the degree of elasticity of the lens.", "d": "Has nothing to do with the lens."}, {"id": 42, "question": "When flying solo, a pilot who suspects he is suffering from spatial disorientation should:", "correct": "a", "a": "Believe the indications of his instruments.", "b": "Blink rapidly several times.", "c": "Swallow hard, pinch the nostrils and blow down the nose to clear the Eustachian tube.", "d": "Believe his somatosensory senses."}, {"id": 43, "question": "What is noise induced hearing loss?", "correct": "a", "a": "Loss of hearing due to damage to the cochlea.", "b": "Loss of hearing due to damage to the ossicles.", "c": "Loss of hearing due to damage to the vestibular apparatus.", "d": "Loss of hearing due to damage to the middle ear."}, {"id": 44, "question": "When can a pilot experience the 'leans'?", "correct": "a", "a": "In all flight conditions.", "b": "In the climb.", "c": "In the descent.", "d": "In the climb or the descent."}, {"id": 45, "question": "What is the most important sense for spatial orientation?", "correct": "a", "a": "Sight.", "b": "Hearing and balance.", "c": "'Seat of the pants'.", "d": "All senses play their part in situation awareness."}, {"id": 46, "question": "Which of the following should a pilot primarily rely on if he becomes disorientated in Visual Meteorological Conditions?", "correct": "a", "a": "His sense of sight.", "b": "Turning the head to recover from disorientation.", "c": "His sense of balance.", "d": "The aircraft's instruments."}, {"id": 47, "question": "On what does the causes of noise induced hearing loss depend?", "correct": "a", "a": "Both the intensity and duration of the noise above 90 dbs.", "b": "Both the intensity and duration of the noise above 100 dbs.", "c": "The duration of the noise above 100 dbs.", "d": "The duration of the noise above 110 dbs."}, {"id": 48, "question": "The frequency band that a healthy young person can hear is:", "correct": "a", "a": "20 - 20,000 cycles per second.", "b": "70 - 15,000 cycles per second.", "c": "80 - 20,000 cycles per second.", "d": "500 - 15,000 cycles per second."}, {"id": 49, "question": "What is the purpose of the Eustachian tube?", "correct": "a", "a": "To allow ambient pressure to equalise on both sides of the ear drum.", "b": "To pass sound waves across the middle ear to the auditory nerve.", "c": "To allow ambient pressure to equalise on the middle ear side of the ear drum.", "d": "To allow ambient pressure to equalise on both sides of the vestibular apparatus."}, {"id": 50, "question": "One of the main contributory factors to the onset of motion sickness is:", "correct": "a", "a": "The mismatch between visual and vestibular sensory inputs.", "b": "Rolling quickly into turns.", "c": "Performing high g maneuvers.", "d": "Stalling."}, {"id": 51, "question": "During straight and level flight any pronounced linear acceleration may produce sensation of the nose pitching up. In such a situation, the pilot should:", "correct": "a", "a": "Ignore vestibular information and believe what the instruments are indicating.", "b": "Correct the pitching movement by moving the control column slightly forward.", "c": "Rely on information from the vestibular apparatus to maintain orientation.", "d": "Rely on his 'seat of the pants' feeling to make any necessary correction."}, {"id": 52, "question": "Loudness is measured in:", "correct": "a", "a": "Decibels.", "b": "Hertz.", "c": "Pascal's.", "d": "Cycles per second."}, {"id": 53, "question": "Which of the following should a pilot primarily rely on if he becomes disorientated in Instrument Meteorological Conditions?", "correct": "a", "a": "The aircraft's instruments.", "b": "His sense of sight.", "c": "Turning the head to recover from disorientation.", "d": "His sense of balance."}, {"id": 54, "question": "The Vestibular Apparatus detects _____________ acceleration:", "correct": "a", "a": "Angular and linear.", "b": "Linear.", "c": "Angular.", "d": "Positive 'g'."}, {"id": 55, "question": "If an aircraft accelerates, what do the otoliths indicate to the brain?", "correct": "a", "a": "That the aircraft is pitching up.", "b": "That the aircraft is pitching down.", "c": "That the aircraft is turning.", "d": "That the aircraft is climbing and turning."}, {"id": 56, "question": "If your Eustachian tube is blocked and you cannot clear your ears, you should:", "correct": "a", "a": "Ground yourself until the condition causing the blocking of the Eustachian tube has cleared up.", "b": "Clear your nose with a nasal inhaler before flying.", "c": "Fly only as a passenger.", "d": "Proceed with your flight but ensure that you swallow hard frequently."}, {"id": 57, "question": "While flying, the changes in outside air pressure can cause air trapped in the body cavities to expand and contract. This is known as Otic Barotrauma and it most likely to affect:", "correct": "a", "a": "All of the above.", "b": "The middle ear.", "c": "The sinuses.", "d": "The teeth."}, {"id": 58, "question": "The best preventative actions to take if someone is showing symptoms of Stroboscopic Effect is to:", "correct": "a", "a": "Place the person in the shade and get them to close their eyes.", "b": "Sit the person in a sunny area.", "c": "Give him a task to distract him.", "d": "Take no action, as the symptoms last for a short time only."}, {"id": 59, "question": "If taking a course of drugs, is it advisable to pilot an aircraft?", "correct": "a", "a": "No, unless cleared by an Aviation Medicine Specialist.", "b": "Yes, provided that they are antibiotics, as these do not have side-effects.", "c": "Yes, provided that the drug is non-prescription.", "d": "No, you should never fly while taking any drugs."}, {"id": 60, "question": "The ability of a pilot to withstand even moderate forces can be affected by:", "correct": "a", "a": "Fatigue in the pilot.", "b": "The maximum load limits of the aircraft.", "c": "Presbycusis.", "d": "All of the above."}, {"id": 61, "question": "A pilot should not fly for at least how long after a local anesthetic?", "correct": "a", "a": "12 hours.", "b": "2 hours.", "c": "24 hours.", "d": "48 hours."}, {"id": 62, "question": "You are suffering from a cold with slightly blocked nose and sinuses and you have an aircraft booked to fly. Should you:", "correct": "a", "a": "Not fly?", "b": "Take a decongestant 1/2 an hour before flight?", "c": "Fly as normal?", "d": "Fly, but be sure to select only low rates of climb and descent?"}, {"id": 63, "question": "A pilot should not fly for at least how long after a general anesthetic?", "correct": "a", "a": "48 hours.", "b": "2 hours.", "c": "12 hours.", "d": "24 hours."}, {"id": 64, "question": "Which of the following may cause fainting?", "correct": "a", "a": "A sudden shock.", "b": "A too rapid eye scan.", "c": "Over meticulous flight planning.", "d": "All of the above."}, {"id": 65, "question": "When compared to visual stimuli, auditory stimuli (noises) are:", "correct": "a", "a": "More likely to attract attention and more likely to be responded to in error.", "b": "Less likely to attract attention and less likely to be responded to in error.", "c": "Less likely to attract attention and more likely to be responded to in error.", "d": "More likely to attract attention and less likely to be responded to in error."}, {"id": 66, "question": "If a pilot is approaching a runway much larger than that at his home airfield, what is his visual perception of the runway likely to be?", "correct": "a", "a": "The runway will appear closer than it actually is.", "b": "The runway will appear further away than it actually is.", "c": "Distances will be easy to judge.", "d": "A different approach path should be adopted."}, {"id": 67, "question": "A false perception characterised by a distortion of real sensory stimuli is known as:", "correct": "a", "a": "Hallucination.", "b": "Day-dreaming.", "c": "Mirage.", "d": "Boredom response."}, {"id": 68, "question": "Repeating information several times to transfer it to long-term memory is called:", "correct": "a", "a": "Rehearsing.", "b": "Memory induction.", "c": "Prompting.", "d": "Chunking."}, {"id": 69, "question": "It is generally accepted that the short-term memory can hold how many items for how long?", "correct": "a", "a": "7 items for 10-20 seconds.", "b": "4 items for 15 seconds.", "c": "15 items for 1-5 minutes.", "d": "7 items for 5-10 minutes."}, {"id": 70, "question": "If a pilot is used to flying in relatively polluted hazy air and then flies in a very clear sky:", "correct": "a", "a": "Distant objects may appear closer than they are.", "b": "Distant objects may appear further away than they are.", "c": "Near objects may be mistaken for those further away.", "d": "Near objects may appear further away than they are."}, {"id": 71, "question": "From the options below, choose the correct sequence of the various stages of the reasoning process.", "correct": "a", "a": "Detection, Perception, Decisions taken, Action, Feedback.", "b": "Perception, Action, Feedback, Detection, Decisions taken.", "c": "Detection, Feedback, Decisions taken, Action, Perception.", "d": "Detection, Perception, Decisions taken, Feedback, Action."}, {"id": 72, "question": "Which of the following will give the illusion that the aircraft is too low during an approach?", "correct": "a", "a": "A down-sloping runway.", "b": "An up-sloping runway.", "c": "A brightly lit aerodrome in an otherwise dark area.", "d": "A narrower than normal runway."}, {"id": 73, "question": "As captain of an aircraft you will need to show good leadership skills. Which of the following is NOT one such skill?", "correct": "a", "a": "Aggressive assertiveness.", "b": "Forward planning.", "c": "Maintaining good situational awareness.", "d": "The art of delegation."}, {"id": 74, "question": "The weather conditions are marginal and there is a strong cross-wind on the runway. As a competent assessor of risk, which of the following decisions should you take?", "correct": "a", "a": "Reschedule the flight for another time, discounting the immediate disappointment to your friends.", "b": "Get airborne as planned, as it is always wise to stick to your flight plan if you possibly can.", "c": "Proceed with the flight and treat it as an opportunity to practise flying in adverse conditions.", "d": "Ask your friends if they are prepared to fly in the prevailing conditions, before assessing the situation yourself."}, {"id": 75, "question": "When making a decision, will a pilot be influenced by previous experience?", "correct": "a", "a": "Yes, past experience can play a part in decision-making.", "b": "Yes, but only if the experience is good.", "c": "Yes, but only if the experience was bad.", "d": "No, each decision is unrelated."}, {"id": 76, "question": "Mental Overload usually:", "correct": "a", "a": "Leads to degraded performance.", "b": "Leads to better performance.", "c": "Has no effect on performance.", "d": "Causes changes in the speed and accuracy of performance which vary from individual to individual."}, {"id": 77, "question": "If, as an inexperienced pilot, you are flying with someone of much greater experience, and you see him do something you consider to be dangerous, you should:", "correct": "a", "a": "Immediately question his course of action.", "b": "Wait until the
