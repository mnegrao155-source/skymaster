rrect.", "correct": "a"}, {"id": 54, "question": "One or more coloured rings around the sun or moon may indicate the presence of which type of cloud?", "a": "Altostratus.", "b": "High cloud.", "c": "Stratus.", "d": "Cirrocumulus.", "correct": "a"}, {"id": 55, "question": "Given a surface temperature of +21\u00b0C and a dew point of +7\u00b0C, at approximately what height will the cloud base of a cumulus cloud be?", "a": "5600ft.", "b": "560ft.", "c": "56,000ft.", "d": "4000ft.", "correct": "a"}, {"id": 56, "question": "Hail is most likely to fall from which type of cloud?", "a": "CB.", "b": "NS.", "c": "AC.", "d": "AS.", "correct": "a"}, {"id": 57, "question": "From the list below, select the Low, Medium and High clouds in ascending order.", "a": "Stratus, Altocumulus, Cirrus.", "b": "Nimbostratus, Cumulonimbus, Cirrus.", "c": "Altostratus, Altocumulus, Cirrus.", "d": "Cirrus, Cumulonimbus, Stratus.", "correct": "a"}, {"id": 58, "question": "The use of the suffix 'nimbus' or the prefix 'nimbo' means?", "a": "Rain bearing.", "b": "Wispy, detached or fiberous.", "c": "Medium cloud.", "d": "Dark and threatening.", "correct": "a"}, {"id": 59, "question": "Precipitation produced by stratus is normally?", "a": "Drizzle.", "b": "Heavy showers.", "c": "Heavy rain.", "d": "Light showers.", "correct": "a"}, {"id": 60, "question": "Unstable air is forced to rise up the side of a mountain. What weather might you expect to see on the windward slopes?", "a": "Cloud of extensive vertical development.", "b": "Thick stratiform cloud, probably nimbostratus.", "c": "None, as the air will subside and warm adiabatically after passing over the summit.", "d": "Cap clouds with possible altocumulus lenticularis.", "correct": "a"}, {"id": 61, "question": "The conditions which must exist to allow thunderstorms to develop are:", "a": "A plentiful supply of moisture and a steep lapse rate through a large vertical extent, together with a trigger action.", "b": "A trigger action, a plentiful supply of moisture and a very stable atmosphere.", "c": "A steep lapse rate, a stable atmosphere through a large vertical extent, and a plentiful supply of moisture.", "d": "A steep lapse rate through a large vertical extent, a low relative humidity and a trigger action.", "correct": "a"}, {"id": 62, "question": "Which combination of weather-producing variables would most likely result in cumuliform clouds, good visibility, showery rain, and possible clear type icing in clouds?", "a": "Unstable moist air and orographic lifting.", "b": "Stable, moist air and orographic lifting.", "c": "Unstable moist air and no lifting mechanism.", "d": "Stable, dry air and orographic lifting.", "correct": "a"}, {"id": 63, "question": "Turbulence, windshear, icing, lightning and heavy precipitation are associated with cumulonimbus clouds. Which of the following statements is true?", "a": "All of the hazards can be avoided by not flying in or in the vicinity of the cloud.", "b": "The most hazardous condition is lightning.", "c": "Heavy precipitation may be experienced outside the cloud, but turbulence and icing are confined to inside the cloud.", "d": "All of the hazards may be encountered within or in the vicinity of the cloud.", "correct": "a"}, {"id": 64, "question": "During the _____ stage of a thunderstorm cell, the cloud contains _____. Choose the correct combination:", "a": "Mature / up currents and down currents.", "b": "Initial / up currents and down currents.", "c": "Dissipating / up currents and down currents.", "d": "Initial / down currents only.", "correct": "a"}, {"id": 65, "question": "What stage of a thunderstorm is characterised predominantly by downdraughts?", "a": "Dissipating stage.", "b": "Initial stage.", "c": "Mature stage.", "d": "Cumulus stage.", "correct": "a"}, {"id": 66, "question": "For cumulonimbus clouds to develop, there needs to exist?", "a": "A deep layer of very unstable moist air.", "b": "A shallow layer of very unstable moist air.", "c": "A deep layer of very unstable moist air with a shallow lapse rate.", "d": "A shallow layer of very unstable air with a steep lapse rate.", "correct": "a"}, {"id": 67, "question": "What stage of a thunderstorm is characterised by updraughts only?", "a": "Initial stage.", "b": "Mature stage.", "c": "Dissipating stage.", "d": "End stage.", "correct": "a"}, {"id": 68, "question": "Which of the following conditions are most likely to produce thunderstorms?", "a": "A high moisture content with a steep lapse rate.", "b": "A high moisture content with a shallow lapse rate.", "c": "A low moisture content with a steep lapse rate.", "d": "A low moisture content with a shallow lapse rate.", "correct": "a"}, {"id": 69, "question": "Hazards to aircraft caused by the presence of cumulonimbus or thunderstorm cloud may be experienced:", "a": "When the aircraft is within 10 nm of the cloud.", "b": "Only when the aircraft is within the cloud.", "c": "Only when the aircraft is within or underneath the cloud.", "d": "When the aircraft is within 5 nm of the cloud.", "correct": "a"}, {"id": 70, "question": "Hazards of the mature stage of a thunderstorm cell include lightning, turbulence and:", "a": "Icing, microburst and windshear.", "b": "Microburst, windshear and anvil.", "c": "Icing, drizzle and microburst.", "d": "Windshear, hail and fog.", "correct": "a"}, {"id": 71, "question": "The wind at 2000ft over an aerodrome was reported at 330/15kt. Using the rule of thumb, what might you expect the surface wind to be?", "a": "305/07kt.", "b": "305/30kt.", "c": "355/30kt.", "d": "315/30kt.", "correct": "a"}, {"id": 72, "question": "Coriolis force in the Northern Hemisphere will cause moving air to be apparently deflected to:", "a": "The right and cause the geostrophic wind to blow parallel to the isobars at about 2000ft agl.", "b": "The left and cause the wind to blow parallel to the isobars at about 2000ft agl.", "c": "The left and cause the wind to blow slightly across the isobars at about 2000ft agl.", "d": "The right and cause the wind to blow slightly across the isobars at about 2000ft agl.", "correct": "a"}, {"id": 73, "question": "Winds that blow around an anticyclone (high pressure system) at lower levels in the Northern Hemisphere are represented on a low level chart as blowing in:", "a": "A clockwise direction.", "b": "A clockwise direction if it is warm air and anticlockwise if it is cold air.", "c": "An anticlockwise direction.", "d": "A cyclonic direction.", "correct": "a"}, {"id": 74, "question": "Low level winds in the northern hemisphere that blow around a depression are drawn on surface weather charts in?", "a": "An anticlockwise direction.", "b": "A clockwise direction.", "c": "An anticyclonic direction.", "d": "Either clockwise or anticlockwise depending on whether the depression is cyclonic or anticyclonic.", "correct": "a"}, {"id": 75, "question": "The formation of advection fog is often caused by?", "a": "A warm moist air mass under the influence of a moderate wind being cooled to below its dew point by flowing over a much colder surface.", "b": "A cold moist air mass under the influence of a moderate wind being warmed to below its dew point by flowing over a much warmer surface.", "c": "A warm moist air mass under the influence of a very light wind being cooled to below its dew point by flowing over a much colder surface.", "d": "A warm moist air mass under the influence of a strong wind on a clear cloudless night.", "correct": "a"}, {"id": 76, "question": "A low level mist layer significantly reduces forward visibility when flying at about 2000ft. To improve your forward visibility you should?", "a": "Fly higher.", "b": "Fly lower.", "c": "Fly just on top of the mist layer.", "d": "Turn on your landing lights and strobe lights.", "correct": "a"}, {"id": 77, "question": "Which of the following conditions is most favourable to the formation of radiation fog?", "a": "High relative humidity, light winds and a clear sky.", "b": "High relative humidity, moderate wind and a cloudy sky.", "c": "Low relative humidity, light winds and a clear sky.", "d": "High relative humidity, light winds and a cloudy sky.", "correct": "a"}, {"id": 78, "question": "Over an inland airfield radiation fog is reported in the morning. As the wind speed increases to 10 kt what would you expect?", "a": "The fog to lift and form low stratus.", "b": "The fog to thicken.", "c": "The fog to dissipate.", "d": "An increase in mixing, allowing more fog to develop.", "correct": "a"}, {"id": 79, "question": "What are the characteristics of the passage of a cold front?", "a": "A dew point fall, a temperature fall, and the wind veering.", "b": "A dew point rise, a temperature fall and wind backing.", "c": "Dew point rise, a temperature fall and the wind veering.", "d": "Steady dew point and temperature but a sharp backing in the wind.", "correct": "a"}, {"id": 80, "question": "What is the general speed of the warm front?", "a": "Approximately 2/3 of the speed of the cold front.", "b": "Approximately 1/3 of the speed of the cold front.", "c": "Approximately 1/2 the speed of the cold front.", "d": "The same speed as the cold front.", "correct": "a"}, {"id": 81, "question": "If a cloudy, granular type of ice is seen to collect and protrude forward from the leading edge of the aerofoil, what type of ice would it most likely be?", "a": "Rime ice.", "b": "Clear ice.", "c": "Rain ice.", "d": "Hoar frost.", "correct": "a"}, {"id": 82, "question": "What will normally happen to the surface wind direction following the passage of a warm front?", "a": "Veer.", "b": "Stay constant.", "c": "Back.", "d": "Veer then back.", "correct": "a"}, {"id": 83, "question": "The extent of rainfall ahead of a typical warm front may be up to a distance of:", "a": "200 miles ahead of the surface position of the warm front.", "b": "50 miles ahead of the surface position of the warm front.", "c": "500 miles ahead of the surface position of the warm front.", "d": "2 miles ahead of the surface position of the warm front.", "correct": "a"}, {"id": 84, "question": "Ice accretion in a piston engine induction system is produced by:", "a": "Low power settings, high humidity and warm air.", "b": "High power settings, moderate humidity and cold air.", "c": "Low power settings, low humidity and warm air.", "d": "High power settings, high humidity and warm air.", "correct": "a"}, {"id": 85, "question": "Which of the following frontal systems is more likely to produce thunderstorm activity?", "a": "A cold front.", "b": "A warm front.", "c": "A ridge of high pressure.", "d": "A quasi-stationary front.", "correct": "a"}, {"id": 86, "question": "Clear ice forms as a result of:", "a": "Large supercooled water droplets spreading as they freeze.", "b": "Ice pellets splattering on the aircraft.", "c": "Small supercooled water droplets splashing over the aircraft.", "d": "Water vapour freezing to the aircraft.", "correct": "a"}, {"id": 87, "question": "What would be the change in weather following the passage of a typical warm front?", "a": "Pressure falls, 8 oktas of cloud with a lowering base and poor visibility.", "b": "Pressure increases steadily, no more than 4 oktas of cloud, and good visibility.", "c": "Pressure stops falling, 4 oktas of cloud with a very low base and rapidly improving visibility.", "d": "Pressure falls, 8 oktas of cloud with a lowering base and improving visibility.", "correct": "a"}, {"id": 88, "question": "What is the main reason water can exist in a liquid state even though the temperature is sub zero?", "a": "No freezing nuclei.", "b": "No condensation nuclei.", "c": "Water takes a long time to cool to below zero degrees.", "d": "Water is hygroscopic.", "correct": "a"}, {"id": 89, "question": "You are flying above the freezing level in the cold air just ahead of a warm front. If rain were to fall in this area, what kind of icing might you expect?", "a": "Rain or clear ice.", "b": "Carburettor ice.", "c": "Rime ice.", "d": "Hoar frost.", "correct": "a"}, {"id": 90, "question": "Which correctly decodes: METAR EGKL 130350Z 32005KT 0400N DZ BCFG VV002?", "a": "Observed on the 13th at 0350Z, surface wind 320\u00b0True 05kt, min visibility 400m to the north, moderate drizzle, with fog patches and a vertical visibility of 200ft.", "b": "Reported on the 13th at 0350Z, surface wind 320\u00b0Magnetic 05kt, min visibility 400m to the north, moderate drizzle, with fog patches and vertical visibility of 200ft.", "c": "Valid on the 13th between 0300 and 1500Z, surface wind 320\u00b0T/05kt, min visibility 400m, drizzle, with fog patches and a vertical visibility of 200m.", "d": "Valid between 1300Z and 1350Z, surface wind 320\u00b0T/05kt, min visibility 400m to the north, moderate drizzle, and a vertical visibility of 200ft.", "correct": "a"}, {"id": 91, "question": "When a TREND is included at the end of an aviation METAR, the trend is a forecast valid for:", "a": "2 hours after the time of observation.", "b": "1 hour after the time of observation.", "c": "2 hours after it was issued.", "d": "1 hour after it was issued.", "correct": "a"}, {"id": 92, "question": "The visibility group R20/0050 in a METAR means:", "a": "As measured by runway measuring equipment for runway 20, a current runway visibility of 50 metres.", "b": "For runway 20, a current visibility of 500 metres measured by runway visual range equipment.", "c": "The runway visibility reported is 50 metres as measured by the runway visual range equipment within the last 20 minutes.", "d": "On runway 20, the current visibility is less than 5000 metres.", "correct": "a"}, {"id": 93, "question": "The code 'BECMG FM 1100 -RASH' in a METAR means:", "a": "Becoming, from 1100 UTC, slight rain showers.", "b": "From 1100 UTC, cessation of the rain showers.", "c": "Becoming, from 1100 UTC, rain showers.", "d": "Becoming, from 1100 UTC to 0000 UTC, slight rain showers.", "correct": "a"}, {"id": 94, "question": "A temperature group of 28/24 in a METAR means that:", "a": "The temperature is 28\u00b0C and the dew point is 24\u00b0C.", "b": "The temperature is 28\u00b0C at the time of reporting, but is expected to become 24\u00b0C by the end of the TREND report.", "c": "The dry bulb temperature is 28\u00b0C and the wet bulb temperature is 24\u00b0C.", "d": "The dew point is 28\u00b0C and the temperature is 24\u00b0C.", "correct": "a"}, {"id": 95, "question": "In the METAR shown: 28005KT 9999 SCT??? 12/05 Q1020 NOSIG \u2014 at what height might you expect the cloud base if cumulus cloud was present?", "a": "SCT028.", "b": "SCT042.", "c": "SCT020.", "d": "SCT280.", "correct": "a"}, {"id": 96, "question": "Providing the minimum sector altitude is not a determining factor, CAVOK in a TAF or METAR:", "a": "Means visibility 10km or more, and no cloud below 5000ft.", "b": "Means visibility 10km or more, and few cloud below 5000ft.", "c": "Means visibility 10nm or more, and no cloud below 5000ft.", "d": "Means visibility 10nm or more, and no scattered cloud below 5000ft.", "correct": "a"}, {"id": 97, "question": "Which correctly decodes a TAF that reads: LYBE 161100Z 1612/1712 VRB08KT 9999 SCT025?", "a": "Valid from 1200 Hr on the 16th to 1200 Hr on the 17th; surface wind variable in direction at 8kt with visibility 10km or more; 3 to 4 oktas of cloud with a base of 2500ft above the aerodrome.", "b": "Valid from 1612 to 1712 UTC; surface wind variable at 8kt; visibility 10nm or more; with a cloud base of 2500ft above mean sea level.", "c": "Observed at 1611UTC; the surface wind was variable in direction and speed averaging 8kt with a visibility of 10km or more, and a cloud base of 2500ft above aerodrome level.", "d": "Observed at 1612 UTC; the surface wind was variable in direction and speed with a visibility of 10km, and a cloud base of 2500ft above ground level.", "correct": "a"}, {"id": 98, "question": "BECMG 1621/1701 BKN030 in a TAF means:", "a": "Becoming between 2100 UTC on the 16th and 0100 UTC on the 17th, 5-7 oktas of cloud at 3000ft agl.", "b": "Becoming between 1621 UTC and 1701 UTC 3-4 oktas of cloud at 300ft agl.", "c": "Becoming from 1621 UTC 5-7 oktas of cloud at 3000ft agl.", "d": "Becoming from 1621 UTC 3-4 oktas of cloud at 300ft agl.", "correct": "a"}, {"id": 99, "question": "Referring to the diagram, determine the 2000ft wind velocity and temperature at position 50\u00b0N 0\u00b0 E/W. (See Fig. PPL Meteo-1)", "a": "215/13kt +11\u00b0C.", "b": "200/12kt +11\u00b0C.", "c": "220/13kt +12\u00b0C.", "d": "180/20kt +10\u00b0C.", "correct": "a"}, {"id": 100, "question": "Referring to the diagram, what is the forecast wind velocity at 5000ft at position 50\u00b0N 0\u00b0E/W? (See Fig. PPL Meteo-2)", "a": "250/15kt.", "b": "180/20kt.", "c": "070/15kt.", "d": "230/10kt.", "correct": "a"}, {"id": 101, "question": "What does the symbol in Fig. PPL Meteo-4 represent on a forecast chart?", "a": "Thunderstorms.", "b": "Severe turbulence.", "c": "Severe icing.", "d": "Severe mountain waves.", "correct": "a"}, {"id": 102, "question": "Referring to the diagram, which zone would the following TAF best fit? (See Fig. PPL Meteo-5) 1322 35020KT 9999 SCT030 SCT090 TEMPO 1322 8000 SHRA BKN015 PROB30 TEMPO 1522 5000 +RASH SCT008 BKN009CB=", "a": "Zone 3.", "b": "Zone 1.", "c": "Zones 1 and 2.", "d": "Zones 2 and 4.", "correct": "a"}, {"id": 103, "question": "What does the symbol in Fig. PPL Meteo-6 represent on a forecast chart?", "a": "Severe icing.", "b": "Severe turbulence.", "c": "Severe mountain waves.", "d": "Thunderstorms.", "correct": "a"}, {"id": 104, "question": "Referring to the diagram, what is the feature identified by the letter J at position 60\u00b0N 12\u00b0W? (See Fig. PPL Meteo-10)", "a": "An occluded front.", "b": "A warm front.", "c": "A quasi stationary front.", "d": "A tropical front.", "correct": "a"}, {"id": 105, "question": "On the low-level significant weather chart, a pressure system at 50\u00b0N 1\u00b0E is indicated by 'L', an arrow, and the figures '20' and '988'. What does this denote? (See Fig. PPL Meteo-14)", "a": "A low pressure centre of 988mb, moving East at 20kts.", "b": "A low pressure centre of 988mb moving West at 20 knots.", "c": "A QFE in that region of 988mb.", "d": "A regional QNH of 988mb.", "correct": "a"}, {"id": 106, "question": "What is the validity time for a WAFC significant weather chart?", "a": "For a single fixed time only.", "b": "6 hours.", "c": "3 hours.", "d": "30 minutes.", "correct": "a"}, {"id": 107, "question": "On WAFC significant weather charts what do the letters 'CB' imply?", "a": "Moderate to severe icing and turbulence.", "b": "Moderate icing and turbulence.", "c": "Moderate to severe icing and turbulence and hail.", "d": "Severe icing and turbulence and hail.", "correct": "a"}, {"id": 108, "question": "In the SIGMET: EGTT SIGMET SST 01 VALID 310730/311130 \u2014 what does the code 'SST' stand for?", "a": "Transonic and supersonic flight levels.", "b": "Supersonic flight levels only.", "c": "Subsonic and transonic flight levels.", "d": "Subsonic flight levels only.", "correct": "a"}, {"id": 109, "question": "A regional AIRMET is a forecast of the weather up to?", "a": "FL100.", "b": "FL180.", "c": "FL010.", "d": "FL240.", "correct": "a"}, {"id": 110, "question": "In the SIGMET: LFFF SIGMET SST 1 VALID 310600/311100 \u2014 MOD TURB FCST BLW FL420 W of 04W MOV E 30KT NC \u2014 what hazard is being forecast?", "a": "Moderate turbulence below 42,000ft west of 4 degrees west and moving eastwards.", "b": "Moderate turbulence at 42,000ft west of 4 degrees west and moving eastwards.", "c": "Moderate turbulence below 42,000ft west of 4 degrees west and moving from the east.", "d": "Turbulence at 42,000ft west of 4 degrees west and moving at 30 knots.", "correct": "a"}, {"id": 111, "question": "In an AIRMET when are strong wind warnings forecast?", "a": "When the wind is expected to exceed 20kt.", "b": "When the wind is expected to exceed 10kt.", "c": "When the wind is expected to exceed 15kt.", "d": "When the maximum wind is expected to exceed 25kt.", "correct": "a"}, {"id": 112, "question": "A regional AIRMET is issued _____ and is valid for _____ with an outlook period of _____.", "a": "4 times a day / 8 hours / 6 hours.", "b": "6 times a day / 8 hours / 4 hours.", "c": "4 times a day / 6 hours / 4 hours.", "d": "6 times a day / 4 hours / 4 hours.", "correct": "a"}, {"id": 113, "question": "VOLMETS are updated?", "a": "Every half an hour.", "b": "Every hour.", "c": "4 times a day.", "d": "2 times a day.", "correct": "a"}, {"id": 114, "question": "A VOLMET is defined as:", "a": "A continuous radio broadcast of selected aerodrome actual weather observations and forecasts.", "b": "A radio broadcast of selected aerodrome forecasts.", "c": "A continuous telephone message of selected aerodrome METARs.", "d": "A teleprinter message of selected aerodrome TAFs and METARs.", "correct": "a"}, {"id": 115, "question": "VOLMETS are?", "a": "Ground to air radio transmissions on HF and VHF.", "b": "Air to ground radio transmissions on HF and VHF.", "c": "Air to ground radio transmissions on HF and SVHF.", "d": "Ground to air radio transmissions on LF and VHF.", "correct": "a"}, {"id": 116, "question": "When are ATIS broadcasts updated?", "a": "Any time the aerodrome or weather information changes.", "b": "Only when the aerodrome information changes.", "c": "Every 30 minutes.", "d": "Every hour.", "correct": "a"}, {"id": 117, "question": "To minimise VHF frequency use, the ATIS can be broadcast on the voice frequency of what navigational aid?", "a": "VOR.", "b": "ILS.", "c": "NDB.", "d": "GPS.", "correct": "a"}, {"id": 118, "question": "What is the ATIS?", "a": "A continuous broadcast of current aerodrome and weather information.", "b": "A chart of current aerodrome and weather information.", "c": "A continuous broadcast of weather information.", "d": "A printed text report of current aerodrome and weather information.", "correct": "a"}, {"id": 119, "question": "In the ATIS broadcast, what is used to identify the current report?", "a": "An alphabetical code.", "b": "A number.", "c": "A validity time.", "d": "An issue time.", "correct": "a"}, {"id": 120, "question": "On what frequency range is the ATIS usually broadcast?", "a": "VHF.", "b": "LF.", "c": "HF.", "d": "ADR.", "correct": "a"}, {"id": 121, "question": "What air temperature may we expect at 7,000ft if the air temperature at 1,500ft is 15\u00b0C?", "a": "+3\u00b0C.", "b": "+4\u00b0C.", "c": "0\u00b0C.", "d": "-2\u00b0C.", "correct": "a"}, {"id": 122, "question": "What wind does the depicted symbol from meteorological charts represent? (See Fig. PPL Meteo-15)", "a": "West wind at 60 knots.", "b": "North wind at 60 knots.", "c": "South wind at 15 knots.", "d": "East wind at 15 knots.", "correct": "a"}, {"id": 123, "question": "Every physical process of weather is accompanied by, or is the result of, a", "a": "Heat exchange.", "b": "Pressure differential.", "c": "Movement of air.", "d": "Change in humidity.", "correct": "a"}, {"id": 124, "question": "What weather phenomenon is associated with a temperature inversion?", "a": "A stable layer of air.", "b": "An unstable layer of air.", "c": "Ascending winds on mountain slopes.", "d": "Thunderstorms inside air masses.", "correct": "a"}, {"id": 125, "question": "The most frequent type of ground or surface-based temperature inversion is that which is produced by", "a": "Terrestrial radiation on a clear, relatively still night.", "b": "The movement of colder air under warm air, or the movement of warm air over cold air.", "c": "Warm air being lifted rapidly aloft in the vicinity of mountainous terrain.", "d": "Convective heating of the surface during the day.", "correct": "a"}, {"id": 126, "question": "The amount of water vapour which air can hold depends on the", "a": "Air temperature.", "b": "Stability of the air.", "c": "Dewpoint.", "d": "Wind speed.", "correct": "a"}, {"id": 127, "question": "What is the approximate airfield dewpoint if the surface air temperature is 20\u00b0C and the reported base of the cumulus clouds is 1,100m above the airfield level?", "a": "11\u00b0C.", "b": "5\u00b0C.", "c": "7\u00b0C.", "d": "-3\u00b0C.", "correct": "a"}, {"id": 128, "question": "What are the characteristics of an unstable air mass?", "a": "Turbulence and good surface visibility.", "b": "Turbulence and poor surface visibility.", "c": "Nimbostratus clouds and good surface visibility.", "d": "Smooth air and poor surface visibility.", "correct": "a"}, {"id": 129, "question": "What types of clouds usually accompany the passage of a warm front?", "a": "CI, CS, AS, NS.", "b": "CC, AC, CU, CB.", "c": "CI, CC, NS, CB.", "d": "CC, SC, ST, NS.", "correct": "a"}, {"id": 130, "question": "Which weather conditions should be expected beneath a low-level temperature inversion layer when the relative humidity is high?", "a": "Light windshear, poor visibility, haze, and light rain.", "b": "Smooth air, poor visibility, fog, haze, or low clouds.", "c": "Turbulent air, poor visibility, fog, low stratus type clouds, and showery precipitation.", "d": "Clear skies and excellent visibility.", "correct": "a"}, {"id": 131, "question": "What value is being calculated by the formula: (Temperature minus dewpoint) \u00d7 123 = ?", "a": "Ceiling of cumulus clouds in meters.", "b": "Temperature aloft.", "c": "Tops of stratus clouds in meters.", "d": "Relative humidity.", "correct": "a"}, {"id": 132, "question": "What is the approximate base of cumulus clouds if the surface air temperature is 27\u00b0C and the dewpoint is 15\u00b0C?", "a": "1,500 m.", "b": "1,000 m.", "c": "2,000 m.", "d": "2,700 m.", "correct": "a"}, {"id": 133, "question": "What approximate base of cumulus clouds should be expected if the surface air dewpoint is 5\u00b0C and the forecast daily maximum temperature is 25\u00b0C?", "a": "2,500 m.", "b": "2,800 m.", "c": "2,000 m.", "d": "1,500 m.", "correct": "a"}, {"id": 134, "question": "With what type of clouds are shower precipitations associated?", "a": "CB.", "b": "ST.", "c": "CI.", "d": "CU.", "correct": "a"}, {"id": 135, "question": "Thunderstorms reach their greatest intensity during the", "a": "Mature stage.", "b": "Downdraft stage.", "c": "Cumulus stage.", "d": "Dissipating stage.", "correct": "a"}, {"id": 136, "question": "When may hazardous windshear be expected?", "a": "In areas of low-level temperature inversion, frontal zones, and clear air turbulence.", "b": "Following frontal passage when stratocumulus clouds form indicating mechanical mixing.", "c": "When stable air crosses a mountain barrier where it tends to flow in layers forming lenticular clouds.", "d": "Only in the vicinity of cumulonimbus clouds.", "correct": "a"}, {"id": 137, "question": "A pilot can expect a windshear zone in a temperature inversion whenever the windspeed at 2,000 to 4,000 feet above the surface is at least", "a": "25 knots.", "b": "15 knots.", "c": "10 knots.", "d": "30 knots.", "correct": "a"}, {"id": 138, "question": "There is thunderstorm activity in the vicinity of an airport at which you plan to land. Which hazardous atmospheric phenomenon might be expected on the landing approach?", "a": "Windshear turbulence.", "b": "Steady rain.", "c": "Precipitation static.", "d": "Radiation fog.", "correct": "a"}, {"id": 139, "question": "Where does windshear occur?", "a": "At all altitudes, in all directions.", "b": "Only at lower altitudes.", "c": "Only at higher altitudes.", "d": "Only near frontal systems.", "correct": "a"}, {"id": 140, "question": "Why is frost considered hazardous to flight?", "a": "Frost spoils the smooth flow of air over the wings, thereby decreasing lifting capability.", "b": "Frost slows the airflow over the airfoils, thereby increasing control effectiveness.", "c": "Frost changes the basic aerodynamic shape of the airfoils, thereby increasing lift.", "d": "Frost adds significant weight to the airframe, increasing stall speed.", "correct": "a"}, {"id": 141, "question": "In which environment is aircraft structural ice most likely to have the highest accumulation rate?", "a": "Freezing rain.", "b": "Freezing drizzle.", "c": "Cumulus clouds with below freezing temperatures.", "d": "High altitude cirrus clouds.", "correct": "a"}, {"id": 142, "question": "What percent coverage of the lowest cloud layer was observed according to the following METAR? METAR LSZH 131630Z 24008KT 0600 R16/1000U FG DZ FEW003 SCT010 OVC020 17/16 Q1018 BECMG TL1700 0800 FG BECMG AT1800 9999 NSW=", "a": "1/8 to 2/8.", "b": "5/8 to 7/8.", "c": "8/8.", "d": "Less than 1/8.", "correct": "a"}, {"id": 143, "question": "What was the observed temperature according to the following METAR? METAR LSZH 131630Z 24008KT 0600 R16/1000U FG DZ FEW003 SCT010 OVC020 17/16 Q1018 BECMG TL1700 0800 FG BECMG AT1800 9999 NSW=", "a": "17\u00b0C.", "b": "Between 10\u00b0C and 18\u00b0C.", "c": "16\u00b0C.", "d": "Between 16\u00b0C and 17\u00b0C.", "correct": "a"}, {"id": 144, "question": "What was the observed air pressure according to the following METAR? METAR LSZH 131630Z 24008KT 0600 R16/1000U FG DZ FEW003 SCT010 OVC020 17/16 Q1018 BECMG TL1700 0800 FG BECMG AT1800 9999 NSW=", "a": "1018 hPa (QNH).", "b": "1000 hPa (QNH).", "c": "999 hPa (QFE).", "d": "1018 hPa (QFE).", "correct": "a"}, {"id": 145, "question": "At what time was the following METAR report issued? METAR LSZH 131630Z 24008KT 0600 R16/1000U FG DZ FEW003 SCT010 OVC020 17/16 Q1018 BECMG TL1700 0800 FG BECMG AT1800 9999 NSW=", "a": "By 16:30 UTC, 13th day of the running month.", "b": "By 16:00 UTC, 30th day of the running month.", "c": "By 16:30 local time.", "d": "By 24:00 local time, 8th day of the running month.", "correct": "a"}, {"id": 146, "question": "What type of precipitation was observed according to the following METAR? METAR LSZH 131630Z 24008KT 0600 R16/1000U FG DZ FEW003 SCT010 OVC020 17/16 Q1018 BECMG TL1700 0800 FG BECMG AT1800 9999 NSW=", "a": "Light drizzle.", "b": "Steady and light rain.", "c": "Hail.", "d": "Rain showers.", "correct": "a"}, {"id": 147, "question": "What was the ceiling of the lowest cloud layer according to the following METAR? METAR LSZH 131630Z 24008KT 0600 R16/1000U FG DZ FEW003 SCT010 OVC020 17/16 Q1018 BECMG TL1700 0800 FG BECMG AT1800 9999 NSW=", "a": "300 m.", "b": "10 ft.", "c": "100 ft.", "d": "1,000 m.", "correct": "a"}, {"id": 148, "question": "According to the code, which of the following METAR reports could be partially abbreviated by CAVOK (minimum sector altitude 4,000ft)? A) 34004KT 7000 MIFG SCT260 09/08 Q1019 NOSIG= B) 27019G37KT 9999 BKN050 18/14 Q1016 NOSIG= C) 00000KT 0100 FG VV001 11/11 Q1025 BECMG 0500= D) 26012KT 8000 -SHRA BKN025TCU 16/12 Q1018 NOSIG=", "a": "B.", "b": "A.", "c": "C.", "d": "D.", "correct": "a"}, {"id": 149, "question": "According to the following METAR report, when may we expect vanishing of the fog and weather improvement for VFR flight? METAR LSZH 131630Z 24008KT 0600 R16/1000U FG DZ FEW003 SCT010 OVC020 17/16 Q1018 BECMG TL1700 0800 FG BECMG AT1800 9999 NSW=", "a": "After 18:00 UTC.", "b": "Till 17:00 UTC.", "c": "Till 18:00 UTC (the latest).", "d": "Between 17:00 and 18:00 UTC.", "correct": "a"}, {"id": 150, "question": "What kind of weather is forecast for the period after 12:00 UTC? TAF LYBE 160500Z 1606/1706 13010KT 9000 BKN020 BECMG 1606/1608 SCT015CB BKN020 TEMPO 1608/1612 17012G22KT 1000 TSRA SCT010CB BKN020 FM12 15006KT 9999 BKN020 BKN100=", "a": "Moderate southeasterly wind with visibility improvement to more than 10km, precipitations will stop, cloudiness will become greater with ceiling at 600m.", "b": "Rainy weather with showers and gusty wind and visibility below 10km.", "c": "Visibility will improve to 5km to 10km and cloud covering will decrease to 1/8 at 600m and 1/8 at 3000m.", "d": "Southeasterly wind 6kts, visibility will be convenient for visual flying and the sky will be completely covered with clouds with base at 600m.", "correct": "a"}] },
  pof: { code:"POF", name:"Principles of Flight", questions:[{"id": 1, "question": "Density:-", "correct": "a", "a": "Reduces with altitude increase.", "b": "Is unaffected by temperature change.", "c": "Increases with altitude increase.", "d": "Reduces with temperature reduction."}, {"id": 2, "question": "The air pressure that acts on anything immersed in it:-", "correct": "a", "a": "Is also known as Static Pressure.", "b": "Is also known as Dynamic Pressure.", "c": "Is greater at altitude than at sea level.", "d": "Is also known as Total Pressure."}, {"id": 3, "question": "If, on a given day, the actual outside air temperature at 4000 ft is 23\u00b0C, what is the approximate difference between the actual and ISA temperature?", "correct": "a", "a": "16\u00b0C.", "b": "7\u00b0C.", "c": "15\u00b0C.", "d": "8\u00b0C."}, {"id": 4, "question": "The presence of water vapour:-", "correct": "a", "a": "In air will reduce its density.", "b": "In air will increase its density.", "c": "In the atmosphere will increase the power output of a piston engine.", "d": "In the atmosphere will increase the amount of lift generated by an aircraft."}, {"id": 5, "question": "When considering the changes in density of the air with altitude, which of the following four options is correct?", "correct": "a", "a": "The reduction in pressure with increasing altitude causes density to reduce.", "b": "The temperature increase with increasing altitude causes density to increase.", "c": "The temperature reduction with increasing altitude causes density to increase.", "d": "The increase in pressure with increasing altitude causes density to reduce."}, {"id": 6, "question": "The respective percentages of the four most abundant gases that make up the atmosphere are?", "correct": "a", "a": "Nitrogen 78% Oxygen 21% Argon 0.95% Carbon Dioxide 0.05%", "b": "Oxygen 78% Nitrogen 21% Argon 0.95% Carbon Dioxide 0.05%", "c": "Nitrogen 78% Oxygen 21% Argon 0.95% Carbon Monoxide 0.05%", "d": "Oxygen 78% Nitrogen 21% Argon 0.95% Carbon Monoxide 0.05%"}, {"id": 7, "question": "The properties of the Earth's atmosphere which influence the performance of aircraft are:", "correct": "a", "a": "Its water vapour content, temperature, pressure and density.", "b": "Its temperature, pressure and humidity.", "c": "Its oxygen content pressure, and water vapour content.", "d": "Its nitrogen content, oxygen content, temperature and pressure."}, {"id": 8, "question": "Assuming that the pressure at sea level is ISA, but the temperature is 10\u00b0C higher than ISA, the density will be:", "correct": "a", "a": "Less than ISA.", "b": "As per ISA.", "c": "Greater than ISA.", "d": "Unaffected."}, {"id": 9, "question": "Air pressure:-", "correct": "a", "a": "Acts in all directions.", "b": "Acts only vertically downwards.", "c": "Is measured in Pascals per square inch.", "d": "Increases with altitude."}, {"id": 10, "question": "A piston engine aircraft flies in that layer of the atmosphere called:", "correct": "a", "a": "The Troposphere.", "b": "The Stratosphere.", "c": "The Mesosphere.", "d": "The Tropopause."}, {"id": 11, "question": "In straight and level powered flight the following principal forces act on an aircraft:", "correct": "a", "a": "Thrust, lift, drag, weight.", "b": "Thrust, lift, weight.", "c": "Thrust, lift, drag.", "d": "Lift, drag, weight."}, {"id": 12, "question": "The unit of force is the:", "correct": "a", "a": "Newton.", "b": "Newton-metre.", "c": "Joule.", "d": "Mass-kilogram."}, {"id": 13, "question": "The dynamic pressure exerted on an aircraft's frontal surface is equal to:", "correct": "a", "a": "Half the density times the true airspeed squared.", "b": "Density time's speed squared.", "c": "Half the true airspeed times the density squared.", "d": "Half the density times the indicated airspeed squared."}, {"id": 14, "question": "Relative airflow is ___ and ___ the movement of the aircraft.", "correct": "a", "a": "Parallel to / Opposite to.", "b": "Perpendicular to / Opposite to.", "c": "Perpendicular to / in the same direction as.", "d": "Parallel to / in the same direction as."}, {"id": 15, "question": "The symbol for dynamic pressure is:", "correct": "a", "a": "Q", "b": "P", "c": "R", "d": "D"}, {"id": 16, "question": "The air flow over the wing's upper surface in straight and level flight, when compared with the airflow that is unaffected by the wing, will have:", "correct": "a", "a": "A higher velocity.", "b": "A higher density.", "c": "A reduced velocity.", "d": "The same velocity."}, {"id": 17, "question": "Which of the four answer options most correctly completes the sentence? Increasing speed also increases lift because:", "correct": "a", "a": "The increased speed of the air passing over an aerofoil's upper surface decreases the static pressure above the wing, thus creating a greater pressure differential across the upper and lower surface.", "b": "Lift is directly proportional to velocity.", "c": "The increased velocity of the relative wind overcomes the increased drag.", "d": "Increasing speed decreases drag."}, {"id": 18, "question": "An aircraft has a nose down pitching moment due to the lift/weight couple and a nose up pitching moment due to the thrust/drag couple. When power is increased:", "correct": "a", "a": "It will pitch nose up.", "b": "It will pitch nose down.", "c": "The couples both increase in magnitude but remain balanced.", "d": "The couples both decrease in magnitude but remain balanced."}, {"id": 19, "question": "Considering the forces acting upon an aeroplane, at constant airspeed, which statement is correct?", "correct": "a", "a": "Weight always acts vertically downwards towards the centre of the Earth.", "b": "Lift acts perpendicular to the chord line and must always be greater than weight.", "c": "Thrust acts parallel to the relative airflow and is greater than drag.", "d": "The lift force generated by the wings always acts in the opposite direction to the aircraft's weight."}, {"id": 20, "question": "In straight and level flight, the free stream airflow pressure, compared to that flowing under the wing, is:", "correct": "a", "a": "Lower.", "b": "Equal.", "c": "Higher.", "d": "Equal pressure but travelling faster."}, {"id": 21, "question": "If the cross sectional area of an airflow is mechanically reduced:", "correct": "a", "a": "The mass flow remains constant and the velocity of the airflow increases.", "b": "The velocity of the airflow remains constant and the mass flow increases.", "c": "The mass flow remains constant and the static pressure increases.", "d": "The velocity of the airflow remains constant and the kinetic energy increases."}, {"id": 22, "question": "Dynamic pressure is:", "correct": "a", "a": "The amount by which the pressure rises at a point where a moving airflow is brought completely to rest.", "b": "The total pressure at a point where a moving airflow is brought completely to rest.", "c": "The pressure due to the mass of air pressing down on the air beneath.", "d": "The pressure change caused by heating when a moving airflow is brought completely to rest."}, {"id": 23, "question": "When considering air: 1-Air has mass, 2-Air is not compressible, 3-Air is able to flow or change its shape when subject to even small pressures, 4-The viscosity of air is very high, 5-Moving air has kinetic energy. The correct combination of all true statements is:", "correct": "a", "a": "1, 3, and 5.", "b": "1, 2, 3 and 5.", "c": "2, 3 and 4.", "d": "1 and 4."}, {"id": 24, "question": "An aircraft rotates about:", "correct": "a", "a": "Its centre of gravity.", "b": "Its wings.", "c": "Its main undercarriage.", "d": "Its rudder."}, {"id": 25, "question": "An aircraft's mass is a result of:", "correct": "a", "a": "How much matter it contains.", "b": "Its weight.", "c": "How big it is.", "d": "Its volume."}, {"id": 26, "question": "Dynamic pressure equals:", "correct": "a", "a": "Total pressure minus static pressure.", "b": "Total pressure plus static pressure.", "c": "Static pressure minus total pressure.", "d": "Total pressure divided by static pressure."}, {"id": 27, "question": "If the velocity of an air mass is increased:", "correct": "a", "a": "The kinetic energy will increase, the dynamic pressure will increase and the static pressure will decrease.", "b": "The dynamic pressure will decrease and the static pressure will increase.", "c": "The static pressure will remain constant and the kinetic energy will increase.", "d": "The mass flow will stay constant, the dynamic pressure will decrease and the static pressure will increase."}, {"id": 28, "question": "The boundary layer consists of:", "correct": "a", "a": "Laminar and Turbulent flow.", "b": "Laminar flow.", "c": "Turbulent flow.", "d": "Turbulent flow at low speeds only."}, {"id": 29, "question": "What must be the relationship between the forces acting on an aircraft in flight, for that aircraft to be in a state of equilibrium?", "correct": "a", "a": "Lift must equal weight, and thrust must equal drag.", "b": "Lift must equal drag, and thrust must equal weight.", "c": "Lift must equal thrust plus drag.", "d": "Lift must equal thrust, and weight must equal drag."}, {"id": 30, "question": "The smooth flow of air, where each molecule follows the path of the preceding molecule, is a definition of:", "correct": "a", "a": "Laminar flow.", "b": "Turbulent flow.", "c": "Free stream flow.", "d": "Wind."}, {"id": 31, "question": "In sub-sonic airflow, as air passes through a venturi, the mass flow _____, the velocity _____ and the static pressure _____.", "correct": "a", "a": "Remains constant / increases then decreases / decreases then increases.", "b": "Decreases then increases / remains constant / increases then decreases.", "c": "Remains constant / increases then decreases / increases then decreases.", "d": "Decreases then increases / increases then decreases / increases then decreases."}, {"id": 32, "question": "A moving mass of air possesses kinetic energy. An object placed in the path of such a moving mass of air will be subject to:", "correct": "a", "a": "Static pressure and dynamic pressure.", "b": "Static Pressure.", "c": "Dynamic pressure.", "d": "Dynamic pressure minus static pressure."}, {"id": 33, "question": "Dynamic Pressure may be expressed by the formula:", "correct": "a", "a": "Q = 1/2 \u03c1V\u00b2", "b": "Q = 1/3 PV\u00b2", "c": "Q = PV", "d": "Q = 2PV"}, {"id": 34, "question": "As airspeed increases, induced drag:", "correct": "a", "a": "Decreases.", "b": "Increases.", "c": "Is dependent on the weight of the aircraft.", "d": "Remains unchanged."}, {"id": 35, "question": "As Indicated Air Speed (IAS) is reduced, in order to maintain altitude, the pilot must:", "correct": "a", "a": "Increase the angle of attack to maintain the correct lift force.", "b": "Decrease the angle of attack to reduce the drag.", "c": "Deploy the speed brakes to increase drag.", "d": "Reduce the thrust."}, {"id": 36, "question": "That portion of the aircraft's total drag created by the production of lift is called:", "correct": "a", "a": "Induced drag, which is greatly affected by changes in airspeed.", "b": "Parasite drag, which is greatly affected by changes in airspeed.", "c": "Induced drag, which is not affected by changes in airspeed.", "d": "Parasite drag, which is inversely proportional to the square of the airspeed."}, {"id": 37, "question": "By changing the Angle of Attack of a wing, the pilot can control the aeroplane's:", "correct": "a", "a": "Lift, airspeed, and drag.", "b": "Lift and airspeed, but not drag.", "c": "Lift, gross weight, and drag.", "d": "Lift and drag, but not airspeed."}, {"id": 38, "question": "Resistance, or skin friction, due to the viscosity of the air as it passes along the surface of a wing, is a type of:", "correct": "a", "a": "Parasite drag.", "b": "Induced drag.", "c": "Form drag.", "d": "Interference drag."}, {"id": 39, "question": "If the Indicated Air Speed of an aircraft is increased from 50 kts to 100 kts, parasite drag will be:", "correct": "a", "a": "Four times greater.", "b": "Six times greater.", "c": "Two times greater.", "d": "One quarter as much."}, {"id": 40, "question": "An imaginary straight line running from the midpoint of the leading edge of an aerofoil to its trailing edge, is called the:", "correct": "a", "a": "Chord.", "b": "Mean camber.", "c": "Aerofoil thickness.", "d": "Maximum camber."}, {"id": 41, "question": "A positively cambered aerofoil starts to produce lift at an angle of attack of approximately:", "correct": "a", "a": "Minus 4 degrees.", "b": "0 degrees.", "c": "4 to 6 degrees.", "d": "16 degrees."}, {"id": 42, "question": "On an aerofoil section, the force of lift acts perpendicular to, and the force of drag acts parallel to, the:", "correct": "a", "a": "Flightpath.", "b": "Longitudinal axis.", "c": "Chord line.", "d": "Aerofoil section upper surface."}, {"id": 43, "question": "As airspeed increases induced drag _____, parasite drag _____ and total drag:", "correct": "a", "a": "Decreases / Increases / Decreases then increases.", "b": "Increases / Increases / Increases.", "c": "Increases / Decreases / Increases then decreases.", "d": "Decreases / Decreases / Decreases."}, {"id": 44, "question": "If in level flight the airspeed decreases below that for maximum Lift/Drag, the effect will be that:", "correct": "a", "a": "Drag increases because of increased induced drag.", "b": "Drag decreases because of lower induced drag.", "c": "Drag increases because of increased parasite drag.", "d": "Drag decreases because of lower parasite drag."}, {"id": 45, "question": "The angle of attack is the angle between the:", "correct": "a", "a": "Chord line and the relative airflow.", "b": "Camber line and free stream flow.", "c": "Chord line and the longitudinal axis of the aeroplane.", "d": "Chord line and the horizontal plane."}, {"id": 46, "question": "The maximum value of the coefficient of lift is found at an angle of attack of approximately:", "correct": "a", "a": "16 degrees.", "b": "Minus 4 degrees.", "c": "0 degrees.", "d": "4 to 6 degrees."}, {"id": 47, "question": "At a constant angle of attack, a decrease in the airspeed of an aircraft will result in:", "correct": "a", "a": "A decrease in lift and drag.", "b": "An increase in lift and a decrease in drag.", "c": "An increase in drag and a decrease in lift.", "d": "Possible increases or decreases in lift or drag, depending on the actual speed."}, {"id": 48, "question": "If the Angle of Attack and other factors remain constant, and the airspeed is doubled, lift will be:", "correct": "a", "a": "Quadrupled.", "b": "Doubled.", "c": "One quarter of what it was.", "d": "The same."}, {"id": 49, "question": "The definition of lift is:", "correct": "a", "a": "The aerodynamic force which acts at 90\u00b0 to the relative airflow.", "b": "The aerodynamic force which acts perpendicular to the chord line of the aerofoil.", "c": "The aerodynamic force that results from the pressure differentials about an aerofoil.", "d": "The aerodynamic force which acts perpendicular to the upper surface of the aerofoil."}, {"id": 50, "question": "The amount of lift a wing produces is directly proportional to:-", "correct": "a", "a": "The air density.", "b": "The dynamic pressure minus the static pressure.", "c": "The square root of the velocity of the air flowing over it.", "d": "The air temperature."}, {"id": 51, "question": "The maximum value of the Coefficient of Lift is found:", "correct": "a", "a": "At the stalling angle of attack.", "b": "At negative angles of attack.", "c": "When lift equals drag.", "d": "During steep turns."}, {"id": 52, "question": "At a given Indicated Air Speed, what effect will an increase in air density have on lift and drag?", "correct": "a", "a": "Lift and drag will remain the same.", "b": "Lift will increase but drag will decrease.", "c": "Lift and drag will increase.", "d": "Lift and drag will decrease."}, {"id": 53, "question": "An aerofoil section is designed to produce lift resulting from a difference in the:", "correct": "a", "a": "Higher air pressure below the surface and lower air pressure above the surface.", "b": "Negative air pressure below and a vacuum above the surface.", "c": "Vacuum below the surface and greater air pressure above the surface.", "d": "Higher air pressure at the leading edge than at the trailing edge."}, {"id": 54, "question": "Full flaps should be selected when:", "correct": "a", "a": "Committed to land.", "b": "Commencing final approach.", "c": "On go-around.", "d": "Landing into a strong headwind."}, {"id": 55, "question": "A wing which is inclined downwards from root to tip is said to have:", "correct": "a", "a": "Anhedral.", "b": "Washout.", "c": "Taper.", "d": "Sweep."}, {"id": 56, "question": "When the C of G is close to the forward limit:", "correct": "a", "a": "Very high stick forces are required to pitch because the aircraft is very stable.", "b": "Very small forces are required on the control column to produce pitch.", "c": "Longitudinal stability is reduced.", "d": "Stick forces are the same as for an aft C of G."}, {"id": 57, "question": "Following a lateral disturbance, an aircraft with Dutch roll instability will:", "correct": "a", "a": "Develop simultaneous oscillations in roll and yaw.", "b": "Go into a spiral dive.", "c": "Develop oscillations in pitch.", "d": "Develop an unchecked roll."}, {"id": 58, "question": "An aeroplane which is inherently stable will:", "correct": "a", "a": "Have a built-in tendency to return to its original state following the removal of any disturbing force.", "b": "Require less effort to control.", "c": "Be difficult to stall.", "d": "Not spin."}, {"id": 59, "question": "After a disturbance in pitch, an aircraft oscillates in pitch with increasing amplitude. It is:", "correct": "a", "a": "Statically stable but dynamically unstable.", "b": "Statically and dynamically unstable.", "c": "Statically unstable but dynamically stable.", "d": "Statically and dynamically stable."}, {"id": 60, "question": "If a disturbing force causes an aircraft to roll:", "correct": "a", "a": "Wing dihedral will cause a rolling moment which tends to correct the sideslip.", "b": "The fin will cause a yawing moment which reduces the sideslip.", "c": "Wing dihedral will cause a yawing moment which tends to correct the sideslip.", "d": "Wing dihedral will cause a nose up pitching moment."}, {"id": 61, "question": "If the wing Aerodynamic Centre is forward of the C of G:", "correct": "a", "a": "Changes in lift produce a wing pitching moment which acts to increase the change of lift.", "b": "Changes in lift produce a wing pitching moment which acts to reduce the change of lift.", "c": "Changes in lift give no change in wing pitching moment.", "d": "When the aircraft sideslips, the CofG causes the nose to turn into the sideslip thus applying a restoring moment."}, {"id": 62, "question": "By design, the Centre of Pressure on a particular aircraft remains behind the aircraft's C of G. If the aircraft is longitudinally stable and is displaced in pitch, nose down, by turbulence:", "correct": "a", "a": "The tailplane will generate a downward force.", "b": "The tailplane will generate an upward force.", "c": "Neither an upward nor a downward force will be generated by the tailplane, as the aircraft will already be in equilibrium.", "d": "The aircraft will maintain its nose-down attitude."}, {"id": 63, "question": "Wing dihedral produces a stabilising rolling moment by causing an increase in lift:", "correct": "a", "a": "On the lower wing when the aircraft is sideslipping.", "b": "On the up-going wing when the aircraft rolls.", "c": "On the up-going wing when the aircraft is sideslipping.", "d": "On the lower wing whenever the aircraft is in a banked attitude."}, {"id": 64, "question": "When an aircraft is disturbed from its established flight path by, for example, turbulence, it is said to have positive stability if it subsequently:", "correct": "a", "a": "Re-establishes its original flight path without any input from the pilot.", "b": "Remains on the new flight path.", "c": "Becomes further displaced from its original flight path.", "d": "Continues to pitch in the disturbed direction until the displacement is resisted by opposing control forces."}, {"id": 65, "question": "Loading an aircraft so that the C of G exceeds the aft limits could result in:", "correct": "a", "a": "Loss of longitudinal stability and the nose pitching up at slow speeds.", "b": "Excessive upward force on the tail, and the nose pitching down.", "c": "Excessive load factor in turns.", "d": "High stick forces."}, {"id": 66, "question": "Which of the following four options describes the consequence of taking off with the manufacturer's recommended take-off flap setting selected?", "correct": "a", "a": "A decrease in the length of the take-off run compared to a non-flap take-off.", "b": "An increase in the length of the take-off run compared to a non-flap take-off.", "c": "A greater angle of climb.", "d": "Easier avoidance of obstacles at the end of a runway."}, {"id": 67, "question": "With the flaps lowered, the stalling speed will:", "correct": "a", "a": "Decrease.", "b": "Increase.", "c": "Increase, but occur at a higher angle of attack.", "d": "Remain the same."}, {"id": 68, "question": "When an aircraft is disturbed from its trimmed attitude by, for example, turbulence, it is said to have neutral stability if it subsequently:", "correct": "a", "a": "Remains in the new attitude.", "b": "Oscillates about its original attitude before settling back to that original attitude.", "c": "Immediately re-establishes its original attitude.", "d": "Continues to move in the disturbed direction until the displacement is resisted by opposing control forces."}, {"id": 69, "question": "If the Centre of Gravity (C of G) of an aircraft is found to be within limits for take-off:", "correct": "a", "a": "The CofG limits for landing must be checked, allowing for planned fuel consumption.", "b": "The CofG will always be within limits for landing.", "c": "The CofG will not change during the flight.", "d": "The flight crew will always be certain of being able to adjust the C of G during flight in order to keep it within acceptable limits for landing."}, {"id": 70, "question": "With a forward Centre of Gravity, an aircraft will have:", "correct": "a", "a": "Decreased elevator effectiveness when flaring.", "b": "Reduced longitudinal stability.", "c": "Lighter forces for control movements.", "d": "Shorter take off distances."}, {"id": 71, "question": "Longitudinal stability is given by:", "correct": "a", "a": "The horizontal tailplane.", "b": "The fin.", "c": "The wing dihedral.", "d": "The ailerons."}, {"id": 72, "question": "An aft Centre of Gravity will give:", "correct": "a", "a": "Increased elevator effectiveness when flaring.", "b": "Increased longitudinal stability.", "c": "Heavy forces for control movements.", "d": "Longer take-off distances."}, {"id": 73, "question": "The tendency of an aircraft to develop forces which restore it to its original flight situation, when disturbed from a condition of steady flight, is known as:", "correct": "a", "a": "Stability.", "b": "Manoeuvrability.", "c": "Controllability.", "d": "Instability."}, {"id": 74, "question": "Stability around the normal axis:", "correct": "a", "a": "Is increased if the keel surface behind the CofG is increased.", "b": "Is given by the lateral dihedral.", "c": "Depends on the longitudinal dihedral.", "d": "Is greater if the wing has no sweepback."}, {"id": 75, "question": "The maximum gliding distance from 6000 feet, for an aircraft in clean configuration, with a lift/drag ratio of 8:1, is approximately 8 nautical miles. If flaps are deployed:", "correct": "a", "a": "The maximum gliding distance will be less.", "b": "The maximum gliding distance will increase.", "c": "Lift/Drag ratio will be unaffected but will be achieved at a lower airspeed.", "d": "The maximum gliding distance will be unaffected."}, {"id": 76, "question": "A pilot lowers the flaps while keeping the airspeed constant. In order to maintain level flight, the angle of attack:", "correct": "a", "a": "Must be reduced.", "b": "Must be increased.", "c": "Must be kept constant but power must be increased.", "d": "Must be kept constant and power required will be constant."}, {"id": 77, "question": "Movement of the aircraft about its normal (vertical) axis is known as:-", "correct": "a", "a": "Yawing.", "b": "Rolling.", "c": "Pitching.", "d": "Side slipping."}, {"id": 78, "question": "An aircraft wing is constructed with positive dihedral in order to give:", "correct": "a", "a": "Lateral stability about the longitudinal axis.", "b": "Longitudinal stability about the lateral axis.", "c": "Lateral stability about the normal axis.", "d": "Directional stability about the normal axis."}, {"id": 79, "question": "An aircraft is disturbed from its path by a gust of wind. Neutral stability is when, without pilot intervention, it:", "correct": "a", "a": "Maintains the new path.", "b": "Returns to its original path without overshooting.", "c": "Returns to its original path after overshooting.", "d": "Continues to move away from the original path."}, {"id": 80, "question": "When flaps are lowered the stalling angle of attack of the wing:", "correct": "a", "a": "Decreases, but CLMAX increases.", "b": "Remains the same, but CLMAX increases.", "c": "Increases and CLMAX increases.", "d": "Decreases, but CLMAX remains the same."}, {"id": 81, "question": "A high wing configuration with no dihedral, compared to a low wing configuration with no dihedral, will provide:", "correct": "a", "a": "Greater lateral stability.", "b": "Greater longitudinal stability.", "c": "The same degree of longitudinal stability as any other configuration because dihedral gives longitudinal stability.", "d": "Less lateral stability."}, {"id": 82, "question": "An aircraft is disturbed from its flight path by a gust of wind. If it tends to return to its original flight path without pilot intervention, the aircraft is said to possess:", "correct": "a", "a": "Positive Dynamic Stability.", "b": "Instability.", "c": "Negative Dynamic Stability.", "d": "Neutral Dynamic Stability."}, {"id": 83, "question": "Wing leading-edge devices such as slots, designed to allow flight at higher angles of attack, do so by:", "correct": "a", "a": "Re-energising the airflow over the top of the wing, delaying separation.", "b": "Providing an extra lifting surface and hence increase the lift available.", "c": "Changing the shape and hence the lift characteristics of the wing.", "d": "Decreasing lift and hence induced drag."}, {"id": 84, "question": "The surface that gives an aircraft directional stability is:", "correct": "a", "a": "The fin.", "b": "The rudder.", "c": "The horizontal tailplane.", "d": "The rudder trim tab."}, {"id": 85, "question": "If a landing is to be made without flaps the landing speed must be:", "correct": "a", "a": "Increased.", "b": "Reduced.", "c": "The same as for a landing with flaps.", "d": "The same as for a landing with flaps but with a steeper approach."}, {"id": 86, "question": "The maximum speed at which the aircraft can be flown with flaps extended is called:", "correct": "a", "a": "VFE.", "b": "VYSE.", "c": "VNE.", "d": "VNO."}, {"id": 87, "question": "Yawing is movement around the _____ axis.", "correct": "a", "a": "Normal.", "b": "Longitudinal.", "c": "Lateral.", "d": "Horizontal."}, {"id": 88, "question": "The lateral axis of an aircraft is a line which:", "correct": "a", "a": "Passes through the Centre of Gravity, parallel to a line through the wing tips.", "b": "Passes through the wing tips.", "c": "Passes through the Centre of Pressure, at right angles to the direction of the airflow.", "d": "Passes through the quarter-chord point of the wing root at right angles to the longitudinal axis."}, {"id": 89, "question": "Lowering the flaps during a landing approach:", "correct": "a", "a": "Increases the angle of descent without increasing the airspeed.", "b": "Permits approaches at a higher indicated airspeed.", "c": "Decreases the angle of descent without increasing power.", "d": "Eliminates floating."}, {"id": 90, "question": "During a manoeuvre, the ailerons are deflected and returned to neutral when the aircraft has attained a small angle of bank. If the aircraft then returns to a wings-level attitude without further control movement, it is:", "correct": "a", "a": "Statically and dynamically stable.", "b": "Neutrally stable.", "c": "Statically stable but dynamically neutral.", "d": "Statically stable."}, {"id": 91, "question": "The purpose of an anti-balance tab is to:", "correct": "a", "a": "Ensure that the pilot's physical control load increases with increase of control surface deflection.", "b": "Trim the aircraft.", "c": "Reduce the load required to move the controls at all speeds.", "d": "Reduce the load required to move the controls at high speeds only."}, {"id": 92, "question": "The phenomenon of flutter is described as:", "correct": "a", "a": "Oscillatory motion of part or parts of the aircraft relative to the remainder of the structure.", "b": "Rapid oscillatory motion involving only rotation of the control surfaces, associated with the shock waves produced around the control surfaces.", "c": "Rapid movement of the airframe caused by vibration from the engines.", "d": "Reversal of the ailerons caused by wing torsional flexibility."}, {"id": 93, "question": "An aileron could be balanced aerodynamically by:", "correct": "a", "a": "Having the control hinge set back behind the control surface leading edge.", "b": "Making the up aileron move through a larger angle than the down aileron.", "c": "Attaching a weight to the control surface forward of the hinge.", "d": "Having springs in the control circuit to assist movement."}, {"id": 94, "question": "When the control column is pushed forward, a balance tab on the elevator:", "correct": "a", "a": "Will move up relative to the control surface.", "b": "Will move down relative to the control surface.", "c": "Will only move if the trim wheel is operated.", "d": "Moves to the neutral position."}, {"id": 95, "question": "The purpose of differential ailerons is to:", "correct": "a", "a": "Reduce the opposite yawing moment when making a turn.", "b": "Increase the yawing moment which opposes a turn.", "c": "Induce a pitching moment to prevent the nose from dropping in the turn.", "d": "Improve the rate of roll."}, {"id": 96, "question": "The respective primary and secondary effects of the rudder control are:", "correct": "a", "a": "Yaw and roll.", "b": "Yaw and pitch.", "c": "Pitch and yaw.", "d": "Roll and yaw."}, {"id": 97, "question": "On an aircraft with a simple trim tab incorporated into a control surface, when the surface is moved, the tab remains in the same position relative to the:", "correct": "a", "a": "Control surface.", "b": "Relative airflow.", "c": "Boundary layer airflow.", "d": "Aircraft horizontal plane."}, {"id": 98, "question": "Which flying control surface(s) give(s) control about the aircraft's normal axis?", "correct": "a", "a": "The rudder.", "b": "The ailerons.", "c": "The elevator.", "d": "The flaps."}, {"id": 99, "question": "The primary and secondary effects of applying the left rudder alone are:", "correct": "a", "a": "Left yaw and left roll.", "b": "Left yaw and right roll.", "c": "Right yaw and left roll.", "d": "Right yaw and right roll."}, {"id": 100, "question": "When displacing the ailerons from the neutral position:", "correct": "a", "a": "The down-going aileron causes an increase in induced drag.", "b": "The up-going aileron causes an increase in induced drag.", "c": "Induced drag remains the same; the up-going aileron causes a smaller increase in profile drag than the down-going aileron.", "d": "Both cause an increase in induced drag."}, {"id": 101, "question": "An aircraft's rudder is fitted with a balance tab. Movement of the rudder bar to the right, to yaw the aircraft to the right, will move the balance tab to the:", "correct": "a", "a": "Left and the rudder to the right.", "b": "Right and the rudder to the left.", "c": "Right and the rudder to the right.", "d": "Left and the rudder to the left."}, {"id": 102, "question": "An aircraft has a tendency to fly right wing low with hands off. It is trimmed with a tab on the left aileron. The trim tab will:", "correct": "a", "a": "Move down causing the left aileron to move up, and right aileron to move down.", "b": "Move up, causing the left aileron to move up and right aileron to move down.", "c": "Move down, causing the left aileron to move up, right aileron remains neutral.", "d": "Move up causing the left wing to move down, ailerons remain neutral."}, {"id": 103, "question": "Ailerons give:", "correct": "a", "a": "Lateral control about the longitudinal axis.", "b": "Lateral control about the lateral axis.", "c": "Longitudinal control about the lateral axis.", "d": "Directional control about the normal axis."}, {"id": 104, "question": "Following re-trimming for straight and level flight, in an aircraft with a C of G near its forward limit, and an elevator fitted with a conventional trim-tab:", "correct": "a", "a": "Nose-up pitch authority will be reduced.", "b": "Nose-down pitch authority will be reduced.", "c": "Longitudinal stability will be reduced.", "d": "Tailplane down-load will be reduced."}, {"id": 105, "question": "Controls are mass balanced in order to:", "correct": "a", "a": "Eliminate control flutter.", "b": "Aerodynamically assist the pilot in moving the controls.", "c": "Provide equal control forces on all three controls.", "d": "Return the control surface to neutral when the controls are released."}, {"id": 106, "question": "The primary and secondary effects of the aileron control are:", "correct": "a", "a": "Roll and yaw.", "b": "Roll and pitch.", "c": "Pitch and yaw.", "d": "Yaw and roll."}, {"id": 107, "question": "The purpose of a spring-bias trim system is:", "correct": "a", "a": "To reduce to zero the effort required by the pilot to counter stick force, after making a control movement.", "b": "To maintain a constant tension in the trim tab system.", "c": "To increase the feel in the control system.", "d": "To compensate for temperature changes in cable tension."}, {"id": 108, "question": "A control surface may have a mass balance fitted to it, in order to:", "correct": "a", "a": "Help prevent a rapid and uncontrolled oscillation which is called 'flutter'.", "b": "Keep the control surface level.", "c": "Lighten the forces needed to control the surface.", "d": "Provide the pilot with 'feel'."}, {"id": 109, "question": "A control surface may be mass balanced by:", "correct": "a", "a": "Attaching a weight acting forward of the hinge line.", "b": "Fitting a balance tab.", "c": "Fitting an anti-balance tab.", "d": "Attaching weight acting aft of the hinge line."}, {"id": 110, "question": "Fixed trim tabs on ailerons:", "correct": "a", "a": "Can be adjusted on the ground after a test flight to make wings-level flight easier.", "b": "Can be adjusted during flight.", "c": "Should never be adjusted.", "d": "Can be adjusted on the ground after a test flight to make turning easier."}, {"id": 111, "question": "Which flying control surface(s) give(s) longitudinal control?", "correct": "a", "a": "The elevator.", "b": "The rudder.", "c": "The ailerons.", "d": "The flaps."}, {"id": 112, "question": "The purpose of a trim tab is:", "correct": "a", "a": "To zero the load on the pilots controls in the flight attitude required.", "b": "To assist the pilot in initiating movement of the controls.", "c": "To provide feel to the controls at high speed.", "d": "To increase the effectiveness of the controls."}, {"id": 113, "question": "Yawing is a rotation about:", "correct": "a", "a": "The normal axis controlled by the rudder.", "b": "The lateral axis controlled by the rudder.", "c": "The longitudinal axis controlled by the ailerons.", "d": "The normal axis controlled by the elevator."}, {"id": 114, "question": "If the control column is moved forward and to the left:", "correct": "a", "a": "The left aileron moves up, right aileron moves down, elevator moves down.", "b": "The left aileron moves up, right aileron moves down, elevator moves up.", "c": "The left aileron moves down, right aileron moves up, elevator moves down.", "d": "The left aileron moves down, right aileron moves up, elevator moves up."}, {"id": 115, "question": "If the control column is moved to the right, a balance tab on the left aileron should:", "correct": "a", "a": "Move up relative to the aileron.", "b": "Move down relative to the aileron.", "c": "Not move unless the aileron trim wheel is turned.", "d": "Move to the neutral position."}, {"id": 116, "question": "'Differential Ailerons' are a design feature that helps to counteract:", "correct": "a", "a": "Adverse yaw.", "b": "Stability about the longitudinal axis.", "c": "Positive aircraft stability.", "d": "Adverse roll."}, {"id": 117, "question": "If the angle of attack is increased above the stalling angle:", "correct": "a", "a": "Lift will decrease and drag will increase.", "b": "Lift and drag will both decrease.", "c": "Lift will increase and drag will decrease.", "d": "Lift and drag will both increase."}, {"id": 118, "question": "If the Angle of Attack is increased beyond the Critical Angle of Attack, the wing will no longer produce sufficient lift to support the weight of the aircraft:", "correct": "a", "a": "Regardless of airspeed or pitch attitude.", "b": "Unless the airspeed is greater than the normal stall speed.", "c": "Unless the pitch attitude is on or below the natural horizon.", "d": "In which case, the control column should be pulled-back immediately."}, {"id": 119, "question": "An aeroplane wing stalls when:", "correct": "a", "a": "The critical angle of attack is exceeded.", "b": "The indicated airspeed is too low.", "c": "The laminar airflow becomes turbulent.", "d": "It is subjected to unusually high 'G' forces."}, {"id": 120, "question": "The stalling speed of an aircraft in straight and level flight is 60 kt, IAS. What is its stalling speed in a level 60\u00b0 banked turn?", "correct": "a", "a": "85 kt", "b": "60 kt", "c": "43 kt", "d": "120 kt"}, {"id": 121, "question": "When an aircraft is in a steady climb, the aerodynamic lift is _____ the weight.", "correct": "a", "a": "Less than.", "b": "Balanced by.", "c": "Equal to.", "d": "Greater than."}, {"id": 122, "question": "A typical stalling angle of attack for an aircraft wing is:", "correct": "a", "a": "16\u00b0", "b": "4\u00b0", "c": "30\u00b0", "d": "45\u00b0"}, {"id": 123, "question": "The maximum angle of climb of an aeroplane is determined by:", "correct": "a", "a": "Excess engine thrust.", "b": "The aircraft weight.", "c": "Wind speed.", "d": "Excess airspeed."}, {"id": 124, "question": "The angle of attack at which an aeroplane stalls:", "correct": "a", "a": "Will remain constant, regardless of gross weight.", "b": "Will be smaller flying downwind than when flying upwind.", "c": "Is dependent upon the speed of the airflow over the wing.", "d": "Is a function of speed and density altitude."}, {"id": 125, "question": "When the aircraft is in a spin, the direction of spin is most reliably found by reference to which of the following indications?", "correct": "a", "a": "Turn needle.", "b": "Artificial horizon.", "c": "Slip indicator.", "d": "Direction indicator."}, {"id": 126, "question": "The reason for washout being designed into an aircraft wing is to:-", "correct": "a", "a": "Cause the inboard section of the wing to stall first.", "b": "Increase the effectiveness of the flaps.", "c": "Cause the outboard section of the wing to stall first.", "d": "Decrease the effectiveness of the ailerons."}, {"id": 127, "question": "The maximum allowable airspeed with flaps extended (VFE) is lower than cruising speed because:", "correct": "a", "a": "At speeds higher than VFE the aerodynamic forces would overload the flap and wing structures.", "b": "Flaps are used only when preparing to land.", "c": "Too much drag is induced.", "d": "Flaps will stall if they are deployed at too high an airspeed."}, {"id": 128, "question": "The basic stalling speed of an aeroplane is 80 knots. In a level turn with 45\u00b0 angle bank, the stalling speed is:", "correct": "a", "a": "95 knots.", "b": "33 knots.", "c": "86 knots.", "d": "113 knots."}, {"id": 129, "question": "At the stall, the Centre of Pressure moving backwards will cause the nose to _____, and the decreased lift will cause the aircraft to _____.", "correct": "a", "a": "Drop / lose height.", "b": "Yaw / reduce speed.", "c": "Rise / sink.", "d": "Drop / reduce speed."}, {"id": 130, "question": "VNE is:", "correct": "a", "a": "The maximum airspeed at which the aircraft may be flown.", "b": "The airspeed which must not be exceeded except in a dive.", "c": "The maximum airspeed at which manoeuvres approaching the stall may be carried out.", "d": "The maximum speed, above which flaps should not be extended."}, {"id": 131, "question": "In a climb at a steady speed, the thrust is:", "correct": "a", "a": "Greater than the aerodynamic drag.", "b": "Equal to the aerodynamic drag.", "c": "Less than the aerodynamic drag.", "d": "Equal to the weight component along the flight path."}, {"id": 132, "question": "What is the significance of the speed known as VNO?", "correct": "a", "a": "It signifies the upper limit of the normal operating speed range.", "b": "It is the maximum speed at which abrupt movements of the controls will result in a stall, before the aircraft's positive load limit is exceeded.", "c": "It is the speed beyond which structural failure of the airframe will occur.", "d": "It signifies the airspeed which must never be exceeded."}, {"id": 133, "question": "The stalling speed of an aircraft, assuming weight to be constant, is a function of the:", "correct": "a", "a": "Square root of the Load Factor.", "b": "Inverse of the Load Factor.", "c": "Indicated airspeed.", "d": "Square of the weight."}, {"id": 134, "question": "The angle of climb is proportional to:", "correct": "a", "a": "The amount by which the thrust exceeds the drag.", "b": "The amount by which the lift exceeds the weight.", "c": "The amount by which the thrust exceeds the weight.", "d": "The angle of attack of the wing."}, {"id": 135, "question": "If an aircraft is flown at its design manoeuvring speed VA:", "correct": "a", "a": "It is not possible to exceed the limit load.", "b": "It is possible to subject the aircraft to a load greater than its limit load during high 'g' manoeuvres.", "c": "It is only possible to subject the aircraft to a load greater than its limit load during violent increases in incidence.", "d": "It must be immediately slowed down if turbulence is encountered."}, {"id": 136, "question": "If the aircraft weight is increased, without change of C of G position, the stalling angle of attack will:", "correct": "a", "a": "Remain the same.", "b": "Decrease.", "c": "Increase.", "d": "Remain the same. The position of the C of G does not affect the stall speed."}, {"id": 137, "question": "At which angle of attack should we normally expect beginning of a stall?", "correct": "a", "a": "10\u00b0 - 18\u00b0.", "b": "3\u00b0 - 5\u00b0.", "c": "5\u00b0 - 10\u00b0.", "d": "Greater than 25\u00b0."}, {"id": 138, "question": "The best angle of attack on the wing polar diagram is marked as: (See Fig. PPL PoF-2)", "correct": "a", "a": "4", "b": "2", "c": "5", "d": "6"}, {"id": 139, "question": "The critical angle of attack on the wing polar diagram is marked as: (See Fig. PPL PoF-2)", "correct": "a", "a": "6", "b": "1", "c": "4", "d": "5"}, {"id": 140, "question": "The angle of attack for minimum drag on the wing polar diagram is marked as: (See Fig. PPL PoF-2)", "correct": "a", "a": "3", "b": "4", "c": "5", "d": "7"}, {"id": 141, "question": "Which wing shape has the greatest induced drag?", "correct": "a", "a": "Rectangular.", "b": "Taper.", "c": "Elliptical.", "d": "Double taper."}, {"id": 142, "question": "If the velocity of an airstream is doubled the drag coefficient will:", "correct": "a", "a": "Increase 4-times.", "b": "Double.", "c": "Not change.", "d": "Increase 6-times."}, {"id": 143, "question": "Approximately for what percent will the stall speed increase if wing loading increases by 15%?", "correct": "a", "a": "7%.", "b": "0%.", "c": "15%.", "d": "20%."}, {"id": 144, "question": "What is the approximate percentage increase of minimum speed if an aircraft mass is increased by 20%?", "correct": "a", "a": "10%.", "b": "0%.", "c": "120%.", "d": "20%."}, {"id": 145, "question": "If an airplane weighs 3,000 pounds, what approximate weight would the airplane structure be required to support during a 20\u00b0 banked turn while maintaining altitude? (See Fig. PPL PoF-1)", "correct": "a", "a": "3,180 lbs", "b": "4,000 lbs", "c": "3,350 lbs", "d": "3,000 lbs"}, {"id": 146, "question": "If an airplane weighs 4,600 pounds, what approximate weight would the airplane structure be required to support during a 50\u00b0 banked turn while maintaining altitude? (See Fig. PPL PoF-1)", "correct": "a", "a": "7,160 lbs.", "b": "5,400 lbs.", "c": "9,200 lbs.", "d": "8,180 lbs."}, {"id": 147, "question": "What is the maximum allowed bank angle when flying an aircraft with limiting load factor of +2.5 G? (See Fig. PPL PoF-1)", "correct": "a", "a": "66\u00b0.", "b": "55\u00b0.", "c": "60\u00b0.", "d": "50\u00b0."}, {"id": 148, "question": "What is the maximum allowed bank angle when flying an aircraft with limiting load factor of +3.8 G? (See Fig. PPL PoF-1)", "correct": "a", "a": "75\u00b0.", "b": "70\u00b0.", "c": "67\u00b0.", "d": "53\u00b0."}, {"id": 149, "question": "What is the load factor in a 60\u00b0 banked level turn? (See Fig. PPL PoF-1)", "correct": "a", "a": "2.0 G", "b": "1.5 G", "c": "0.5 G", "d": "1 G"}, {"id": 150, "question": "The airspeed at which a pilot will not yet overstress the airframe of an aircraft by momentarily up-deflecting the elevator is:", "correct": "a", "a": "VA.", "b": "VB.", "c": "VFE.", "d": "VS."}] },
