g the mixture lever rather than the ignition switch?", "correct": "a", "a": "By doing that we avoid self-ignition due to presence of the fuel/air mixture in cylinders.", "b": "Because an engine cannot be shut down by switching the magnetos off.", "c": "By doing that we prevent the engine to be shut down at too high temperature.", "d": "Because at magnetos switching off the engine stops very rapidly and damage of the main shaft bearings could occur."}, {"id": 28, "question": "What initial precaution should be taken by the pilot when parking an aircraft with a magneto that is unable to be grounded because of a faulty connection in the ignition switch?", "correct": "a", "a": "A placard should be placed on the aircraft warning others of 'live magnetos'.", "b": "Other pilots should be warned against flying the aircraft.", "c": "The aircraft should be grounded by making an entry in the Journey Log.", "d": "The CCA should be notified at once."}, {"id": 29, "question": "What is the most reliable practical method of checking the fuel level in the reservoirs of an aircraft while on ground?", "correct": "a", "a": "Visual checking the fuel level in the reservoir.", "b": "Reading the fuel gauges with engine running.", "c": "Weighing of an aircraft.", "d": "Shaking the wingtip and observing the fuel bouncing."}, {"id": 30, "question": "Why should you check a sample of fuel from the sump and filter before each flight?", "correct": "a", "a": "To be certain that the fuel is free of contaminants and of the proper grade.", "b": "To be certain that the fuel is free flowing.", "c": "To know that the fuel pump is working properly.", "d": "To be sure that the proper grade of fuel is used."}, {"id": 31, "question": "Which fuel contaminant is the most difficult to isolate with simple filter systems?", "correct": "a", "a": "Water.", "b": "Fine rust or dirt particles.", "c": "Grease or oil.", "d": "Ice."}, {"id": 32, "question": "To properly purge water from the fuel system of an aircraft equipped with fuel tank sumps and a fuel strainer quick drain, it is necessary to drain fuel from the:", "correct": "a", "a": "Fuel strainer drain and the fuel tank sumps.", "b": "Fuel strainer drain only.", "c": "Lowest point in the fuel system only.", "d": "Fuel tank sumps only."}, {"id": 33, "question": "What is the best way to reduce the possibility of water contamination in fuel tanks?", "correct": "a", "a": "Always keeping the fuel tanks full will help to eliminate condensation.", "b": "Fuel filters should be sealed to keep out rainwater.", "c": "Tank vents should be plugged while the aircraft is parked overnight.", "d": "Use only filtered fuel from approved sources."}, {"id": 34, "question": "Filling the fuel tanks after the last flight of the day is considered a good operating procedure because this will:", "correct": "a", "a": "Prevent moisture condensation by eliminating airspace in the tanks.", "b": "Force any existing water to the top of the tank away from the fuel lines to the engine.", "c": "Prevent expansion of the fuel by eliminating airspace in the tanks.", "d": "Allow the fuel to settle overnight."}, {"id": 35, "question": "What happens if the filler cap comes loose on one of your wing fuel tanks?", "correct": "a", "a": "The low pressure on the top of the wing will cause all the fuel to be siphoned out.", "b": "Rainwater will enter the tank and contaminate the fuel.", "c": "The loose cap will cause damage to control surfaces if it flies off.", "d": "The aerodynamic flow about the fuel filler neck will disrupt fuel flow."}, {"id": 36, "question": "What will happen if the fuel primer pump is not locked enough after its use?", "correct": "a", "a": "The fuel/air mixture will be too rich because of the fuel leaking into the intake manifold.", "b": "The fuel/air mixture will be too poor because of the air leaking into the intake manifold.", "c": "Dropping of fuel in the cockpit.", "d": "Detonations in the engine because of too rich fuel/air mixture."}, {"id uge of an aircraft is the indication of:", "correct": "a", "a": "Insufficient suction.", "b": "Normal suction.", "c": "Excessive suction.", "d": "A blocked relief valve."}, {"id": 58, "question": "When should the pressure in the barometric subscale of an aircraft altimeter be set?", "correct": "a", "a": "Before each flight and in the air, if necessary.", "b": "Yearly.", "c": "Monthly.", "d": "Each morning before flying."}, {"id": 59, "question": "The accuracy of an altimeter is checked by:", "correct": "a", "a": "Setting the altimeter to QNH and checking the elevation reading while on ground.", "b": "Low-passing near towers with known height.", "c": "Cross-checking of altimeter readings and radioaltimeter readings.", "d": "Cross-checking of flight altitudes and altitudes from an aeronautical geographical chart 1:500 000."}, {"id": 60, "question": "How frequently should the aviation magnetic compass be swung?", "correct": "a", "a": "Each year before an annual inspection of an aircraft or after installing optional instruments or radio equipment, or more frequently if necessary.", "b": "Before first initial inspection of an aircraft.", "c": "Each month.", "d": "After each long flight."}, {"id": 61, "question": "The pilot could normally check the state of charge of the oleo-pneumatic units during a walk-around inspection by:", "correct": "a", "a": "Inspecting how much the struts extend.", "b": "Measuring the pressure in the oleo-pneumatic units.", "c": "Inspecting the hydraulic fluid level in the oleo-pneumatic units.", "d": "This check could not be performed by the pilot."}, {"id": 62, "question": "The red creep marks on the main tyre and the wheel of an aircraft serve for:", "correct": "a", "a": "Tyre-wheel alignment checking.", "b": "Tyre type recognizing.", "c": "Wheel balancing.", "d": "Tyre pressure checking."}, {"id": 63, "question": "If a tyre has moved so that the creep marks are out of alignment, then:", "correct": "a", "a": "It should be inspected and possibly re-fitted or replaced.", "b": "It is serviceable.", "c": "Tyre pressure should be checked.", "d": "The brakes will be unserviceable."}, {"id": 64, "question": "Braking of an individual main wheel is known as:", "correct": "a", "a": "Directional braking.", "b": "Differential braking.", "c": "Individual braking.", "d": "Asymmetric braking."}, {"id": 65, "question": "Which wind condition would be most critical when taxiing a nosewheel equipped high-wing airplane?", "correct": "a", "a": "Quartering tailwind.", "b": "Direct crosswind.", "c": "Quartering headwind.", "d": "Direct tailwind."}, {"id": 66, "question": "How should the flight controls be deflected while taxiing a tailwheel aeroplane with a strong tailwind?", "correct": "a", "a": "Down.", "b": "Up.", "c": "In neutral.", "d": "Fully up."}, {"id": 67, "question": "What would be most likely to cause an upset while taxiing a nose-wheel equipped aircraft in strong wind?", "correct": "a", "a": "Turning sharply (causing the wind to lift the up-wind wing).", "b": "Applying the brakes suddenly and firmly.", "c": "Accelerating suddenly.", "d": "Lifting the nose-wheel."}, {"id": 68, "question": "How should the flight controls be held while taxiing a tricycle-gear equipped airplane into a left quartering tailwind?", "correct": "a", "a": "Left aileron down, elevator down.", "b": "Left aileron up, elevator neutral.", "c": "Left aileron up, elevator down.", "d": "Left aileron down, elevator up."}, {"id": 69, "question": "How should the flight controls be held while taxiing a tailwheel airplane with a left quartering tailwind?", "correct": "a", "a": "Left aileron down, elevator down.", "b": "Left aileron up, elevator neutral.", "c": "Left aileron down, elevator neutral.", "d": "Left aileron up, elevator up."}, {"id": 70, "question": "Which aileron position should a pilot generally use when taxiing in strong quartering headwinds?", "correct": "a", "a": "Aileron up on the side from which the wind is blowing.", "b": "Aileron down on the side from which the wind is blowing.", "c": "Aileron neutral.", "d": "Aileron fully deflected into the wind."}, {"id": 71, "question": "How should the flight controls be held while taxiing a tricycle-gear equipped airplane into a left quartering headwind?", "correct": "a", "a": "Left aileron up, elevator neutral.", "b": "Left aileron down, elevator neutral.", "c": "Left aileron up, elevator down.", "d": "Left aileron down, elevator up."}, {"id": 72, "question": "How should the flight controls be held while taxiing a tailwheel airplane into a right quartering headwind?", "correct": "a", "a": "Right aileron up, elevator up.", "b": "Right aileron down, elevator neutral.", "c": "Right aileron up, elevator down.", "d": "Right aileron down, elevator up."}, {"id": 73, "question": "If an emergency situation requires a downwind landing, pilots should expect a faster:", "correct": "a", "a": "Groundspeed at touchdown, a longer ground roll, and the likelihood of overshooting the desired touchdown point.", "b": "Airspeed at touchdown, a longer ground roll, and better control throughout the landing roll.", "c": "Groundspeed at touchdown, a shorter ground roll, and the likelihood of undershooting the desired touchdown point.", "d": "Airspeed at touchdown, shorter ground roll, and better directional control."}, {"id": 74, "question": "To minimize the side loads placed on the landing gear during touchdown, the pilot should keep the:", "correct": "a", "a": "Longitudinal axis of the aircraft parallel to the direction of its motion.", "b": "Direction of motion of the aircraft parallel to the runway.", "c": "Downwind wing lowered sufficiently to eliminate the tendency for the aircraft to drift.", "d": "Aircraft wings level throughout the flare."}, {"id": 75, "question": "As an airplane climbs to higher altitudes with the mixture control set in RICH, the fuel/air mixture:", "correct": "a", "a": "Becomes richer.", "b": "Does not change.", "c": "Becomes leaner.", "d": "Fluctuates depending on temperature."}, {"id": 76, "question": "While cruising at 9,500 feet MSL, the fuel/air mixture is properly adjusted. What will occur if a descent to 4,500 feet MSL is made without readjusting the mixture?", "correct": "a", "a": "The fuel/air mixture may become excessively lean.", "b": "There will be more fuel in the cylinders than is needed for normal combustion, and the excess fuel will absorb heat and cool the engine.", "c": "The excessively rich mixture will create higher cylinder head temperatures and may cause detonation.", "d": "The fuel/air mixture may become excessively rich."}, {"id": 77, "question": "To properly compensate for a crosswind during straight-and-level cruising flight, the pilot should:", "correct": "a", "a": "Establish a proper heading into the wind by coordinated use of controls.", "b": "Hold rudder pressure toward the wind.", "c": "Hold aileron pressure toward the wind and hold opposite rudder pressure to prevent turning.", "d": "Use differential power if multi-engine."}, {"id": 78, "question": "During the run-up at a high-elevation airport, a pilot notes a slight engine roughness that is not affected by the magneto check but grows worse during the carburetor heat check. Under these circumstances, what would be the most logical initial action?", "correct": "a", "a": "Check the results obtained with a leaner setting of the mixture.", "b": "Taxi back to the flight line for a maintenance check.", "c": "Reduce manifold pressure to control detonation.", "d": "Check the mixture control lever is in FULL RICH position."}, {"id": 79, "question": "Correct procedure for leaning the mixture during cruise is pulling the mixture lever back towards LEAN until RPM will:", "correct": "a", "a": "Reach the maximum; at this point return the mixture lever slightly forward.", "b": "Drop to the minimum.", "c": "Reach the maximum and stay there.", "d": "Drop slightly then return to normal."}, {"id": 80, "question": "If, during start-up a fire occurs in the engine air intake, a generally suitable procedure is to:", "correct": "a", "a": "Keep turning the engine, but move the mixture control to IDLE CUT-OFF and open the throttle.", "b": "Place the starter switch to OFF.", "c": "Continue with the normal start.", "d": "Shut down and call the fire brigade."}, {"id": 81, "question": "What is indicated by black smoke emitted from the engine exhaust during the run-up?", "correct": "a", "a": "The mixture is too rich.", "b": "The choke is out too far.", "c": "The piston rings are stuck or worn.", "d": "The carburetor is set too lean."}, {"id": 82, "question": "What is indicated by blue smoke emitted from the engine exhaust during the run-up?", "correct": "a", "a": "The piston rings are stuck or worn.", "b": "The choke is out too far.", "c": "The mixture is too rich.", "d": "The carburetor is set too lean."}, {"id": 83, "question": "How should the mixture control be set for takeoff at sea level?", "correct": "a", "a": "Forward (FULL RICH).", "b": "Aft (FULL RICH).", "c": "Aft (FULL LEAN).", "d": "Forward (FULL LEAN)."}, {"id": 84, "question": "The presence of carburetor ice in an aircraft equipped with a fixed-pitch propeller can be verified by applying carburetor heat and noting:", "correct": "a", "a": "A decrease in RPM and then a gradual increase in RPM.", "b": "An increase in RPM and then a gradual decrease in RPM.", "c": "A decrease in RPM and then a constant RPM indication.", "d": "An immediate increase in RPM."}, {"id": 85, "question": "During cruise flight you apply full carburetor heat to your aircraft with fixed-pitch propeller. What is the expected effect in RPM under normal conditions?", "correct": "a", "a": "It would cause a slight decrease in RPM due to the change in fuel/air mixture.", "b": "No effect.", "c": "It would cause a slight increase in RPM due to hot air intake.", "d": "The RPM would fluctuate due to the unstable fuel/air mixture."}, {"id": 86, "question": "During engine run-up test on ground the pilot can check the proper functioning of carburetor heating by moving the carburetor heat lever to HOT and noting:", "correct": "a", "a": "A slight drop in RPM.", "b": "A slight rise in RPM.", "c": "Increased flow of hot air into the cockpit.", "d": "This check could not be performed on ground."}, {"id": 87, "question": "The carburetor heat during taxi should be used with caution due to:", "correct": "a", "a": "Dust and other foreign particles which can cause damage if ingested into engine.", "b": "High temperatures which can cause detonations.", "c": "Rich mixture which can cause fouling of the spark plugs.", "d": "Overheating of the engine."}, {"id": 88, "question": "How should you select propeller pitch for takeoff if your aircraft has a constant speed propeller?", "correct": "a", "a": "Fine pitch (High RPM) for maximum power.", "b": "Fine pitch (Low RPM) for maximum efficiency.", "c": "Coarse pitch (Low RPM) for minimum noise.", "d": "Coarse pitch (Low RPM) for maximum thrust."}, {"id": 89, "question": "In an airplane with a controllable pitch propeller, power reduction should be made by first reducing:", "correct": "a", "a": "The manifold pressure with the throttle, and then adjusting the RPM with the propeller control.", "b": "The RPM with the throttle and then reducing the manifold pressure with the propeller control.", "c": "The RPM with the propeller control, and then reducing the manifold pressure with the throttle.", "d": "The manifold pressure with the propeller control, and then reducing the RPM with the throttle."}, {"id": 90, "question": "When transitioning an airplane with a constant-speed propeller from a cruise to a climb, the pilot should:", "correct": "a", "a": "Increase the RPM with the propeller control before advancing the throttle.", "b": "Increase the manifold pressure with the throttle first, and then increase the RPM with the propeller control.", "c": "Increase the RPM with the throttle first, and then increase the manifold pressure with the propeller control.", "d": "Decrease the manifold pressure with the propeller control first, and then increase the RPM with the throttle."}, {"id": 91, "question": "Shortly after an aviation engine start-up you noticed on the left-zero ammeter a high current reading despite all electrical consumers not connected. You should normally:", "correct": "a", "a": "Do nothing, because in such cases an alternator provides the electrical current for battery charging only, which normally depletes a little during an engine start-up.", "b": "Shut down the engine immediately, because the alternator is not functioning.", "c": "Reset the alternator master switch and, if the condition does not recover, shut down the engine and report to the mechanic.", "d": "Switch off all avionics and continue monitoring."}, {"id": 92, "question": "What is the meaning of the zero reading on a left-zero ammeter in flight?", "correct": "a", "a": "Normal condition because none of electrical consumers is switched on.", "b": "The alternator is not functioning.", "c": "Depleting accumulator.", "d": "The battery is fully charged."}, {"id": 93, "question": "How could you recognize by the indication of the left-zero ammeter a non-functioning aircraft alternator? The instrument reading should be:", "correct": "a", "a": "Zero and stays zero even after a significant electrical consumer is switched on (e.g. the landing light).", "b": "Maximum.", "c": "Increase significantly after the electrical consumer is switched on.", "d": "Fluctuating continuously."}, {"id": 94, "question": "Shortly after aircraft engine start-up you notice that the pointer of a center-zero ammeter is deflected to the right with electrical consumers switched off. This indication means:", "correct": "a", "a": "Charging accumulator, because during an engine start-up the accumulator normally depletes a little.", "b": "Depleting accumulator, because the alternator is not functioning.", "c": "Depleting accumulator, therefore the engine should be shut down.", "d": "A short circuit in the electrical system."}, {"id": 95, "question": "What may a zero reading on the center-zero ammeter in flight indicate?", "correct": "a", "a": "Normal condition; the alternator provides electrical power for electrical equipment.", "b": "Alternator off-line.", "c": "No electrical equipment is switched on.", "d": "Abnormal condition; the battery provides electrical power for electrical equipment."}, {"id": 96, "question": "In flight you notice that the pointer of a center-zero ammeter is deflected to the left. What does this indication mean and what should you normally do?", "correct": "a", "a": "Not-normal condition; the accumulator is depleting because the alternator is not functioning. If after switching off-on of the master switch the situation does not recover, reduce electrical consumption to minimum and land at the nearest suitable airfield.", "b": "Normal condition; the accumulator is charging.", "c": "Normal condition; the instruments indicate present consumption of the electricity provided by the alternator.", "d": "Check the alternator circuit breaker and reset if necessary."}, {"id": 97, "question": "In flight you notice the orange light glowing on the instrumental panel. What does this mean?", "correct": "a", "a": "Alternator does not deliver any electrical current.", "b": "Too high output voltage.", "c": "Flat battery.", "d": "Overheated alternator."}, {"id": 98, "question": "An electrical system failure (battery and alternator) occurs during flight. In this situation, you would:", "correct": "a", "a": "Experience avionics equipment failure.", "b": "Probably experience failure of the engine ignition system, fuel gauges, aircraft lighting system, and avionics equipment.", "c": "Probably experience engine failure due to the loss of the engine-driven fuel pump and also experience failure of the radio equipment, lights, and all instruments that require alternating current.", "d": "Experience only radio failure."}, {"id": 99, "question": "Wingtip vortices are created only when an aircraft is:", "correct": "a", "a": "Developing lift.", "b": "Operating at high airspeeds.", "c": "Heavily loaded.", "d": "Flying in turbulent conditions."}, {"id": 100, "question": "Can the downdraft air currents occurring as a result of wingtip vortices from a heavier aircraft exceed the climb capability of a light aircraft?", "correct": "a", "a": "Yes, particularly behind large, heavy transport aircraft.", "b": "Not normally.", "c": "Occasionally, particularly in the vicinity of air pockets.", "d": "Never, as regulations prevent such situations."}, {"id": 101, "question": "What is the most likely cause of the dangerous turbulence behind heavy aircraft?", "correct": "a", "a": "Wingtip vortices.", "b": "Propeller blast.", "c": "Jet blast.", "d": "Engine exhaust heat."}, {"id": 102, "question": "What precautions are required when stopping a light aircraft behind a heavy aircraft that is stopped on the manoeuvring area?", "correct": "a", "a": "The light aircraft should be stopped clear of the jet blast danger area.", "b": "The light aircraft should be facing the large aircraft.", "c": "The light aircraft should face away from the large aircraft.", "d": "The light aircraft should be no closer than 125 m from rear of large aircraft."}, {"id": 103, "question": "During a takeoff made behind a departing large jet airplane, the pilot can minimize the hazard of wingtip vortices by:", "correct": "a", "a": "Being airborne prior to reaching the jet's flight path until able to turn clear of its wake.", "b": "Maintaining extra speed on takeoff and climbout.", "c": "Extending the takeoff roll and not rotating until well beyond the jet's rotation point.", "d": "Departing from a different runway."}, {"id": 104, "question": "When landing behind a large aircraft, the pilot should avoid wake turbulence by staying:", "correct": "a", "a": "Above the large aircraft's final approach flight path and landing beyond the large aircraft's touchdown point.", "b": "Below the large aircraft's final approach flight path and landing before the large aircraft's touchdown point.", "c": "Above the large aircraft's final approach flight path and landing before the large aircraft's touchdown point.", "d": "On the same glidepath but with extra speed."}, {"id": 105, "question": "Which procedure should you follow to avoid wake turbulence if a large jet crosses your course from left to right approximately 1 mile ahead and at your altitude?", "correct": "a", "a": "Make sure you are slightly above the path of the jet.", "b": "Slow your airspeed to VA and maintain altitude and course.", "c": "Make sure you are slightly below the path of the jet and perpendicular to the course.", "d": "Turn 90\u00b0 away from the jet's flight path."}, {"id": 106, "question": "How long will wake turbulence remain after the passage of a large aircraft?", "correct": "a", "a": "Five minutes or more; ATC permits two or three minutes separation.", "b": "Two minutes.", "c": "Three minutes.", "d": "One minute."}, {"id": 107, "question": "When operating an aircraft at cabin pressure altitudes above 10,000 ft up to and including 13,000 ft MSL, supplemental oxygen shall be used by all crew members:", "correct": "a", "a": "That flight time in excess of 30 minutes at those altitudes.", "b": "The entire flight time at those altitudes.", "c": "That flight time in excess of 10 minutes at those altitudes.", "d": "Only when passengers are on board."}, {"id": 108, "question": "When operating an aircraft at cabin pressure altitudes above 13,000 ft MSL, sufficient supplemental oxygen should be carried to supply:", "correct": "a", "a": "Crew members and passengers.", "b": "Crew members only.", "c": "Passengers only.", "d": "The pilot-in-command only."}, {"id": 109, "question": "Following separation of the airflow from one wing and banking and slipping to one side, the pilot would prevent an aircraft from developing a full spin by:", "correct": "a", "a": "Deflecting the rudder to the opposite side of slipping and easing the elevator forward to gain speed.", "b": "Deflection of all flight controls to the opposite side of rotation instantly.", "c": "Applying back pressure on the control stick thus recovering from a dive.", "d": "Opening the airbrakes immediately (if installed)."}, {"id": 110, "question": "Choose the correct procedure for spin recovery in an aeroplane:", "correct": "a", "a": "Apply the rudder opposite to direction of rotation, ailerons to neutral, elevator control ease forward, and recover gently from a dive.", "b": "Apply the rudder in direction of rotation, ailerons opposite to direction of rotation, and pull on the stick backward.", "c": "Apply the rudder opposite to direction of rotation, ailerons to neutral, elevator control backward.", "d": "Deflect the rudder and the stick in direction of rotation and firmly push on the stick forward."}, {"id": 111, "question": "Choose the correct action for steep spiral recovery.", "correct": "a", "a": "Level wings with ailerons, and ease out of ensuing dive.", "b": "Apply full rudder opposite to direction of rotation, move control column forward to break a stall, and ease out of ensuing dive.", "c": "Apply opposite ailerons, ease control column forward, and ease out of ensuing dive.", "d": "Reduce power and apply back pressure to the control column."}, {"id": 112, "question": "One of the main functions of flaps during the approach and landing is to:", "correct": "a", "a": "Increase the angle of descent without increasing the airspeed.", "b": "Decrease lift, thus enabling a steeper-than-normal approach to be made.", "c": "Permit touchdown at a higher indicated airspeed.", "d": "Decrease the angle of descent without increasing the airspeed."}, {"id": 113, "question": "The main benefit of using flaps during approach and landing is to:", "correct": "a", "a": "Provide the same amount of lift at a slower airspeed.", "b": "Decrease the angle of descent without increasing the airspeed.", "c": "Decrease lift, thus enabling a steeper-than-normal approach to be made.", "d": "Improve directional stability."}, {"id": 114, "question": "Wing flaps at the recommended takeoff setting:", "correct": "a", "a": "Increase lifting ability for a small penalty of drag.", "b": "Increase lifting ability for a large penalty of drag.", "c": "Significantly increase drag for a small decrease in lifting ability.", "d": "Will not affect lift and drag."}, {"id": 115, "question": "Wing flaps at the recommended landing setting:", "correct": "a", "a": "Cause a large drag increase and a small increase in lifting ability.", "b": "Increase lifting ability for a small increase of drag.", "c": "Significantly increase drag for a small decrease in lifting ability.", "d": "Will not affect lift and drag."}, {"id": 116, "question": "What effect does extended wing flaps have on the stalling speed? The stalling speed will:", "correct": "a", "a": "Decrease.", "b": "No change, because the stalling speed does not depend on wing flaps position.", "c": "Increase.", "d": "Vary depending on flap angle."}, {"id": 117, "question": "During landing close to the surface and at low airspeed, it could be dangerous to retract wing flaps, because of:", "correct": "a", "a": "Rapid decrease of lift and resulting sink into runway.", "b": "Drag increase and resulting rapid decrease of the airspeed.", "c": "Rapid increase of the airspeed and resulting rapid climb.", "d": "Great decrease in effectiveness of wing flaps."}, {"id": 118, "question": "Wing flaps at takeoff are not set to fully deflected position to avoid:", "correct": "a", "a": "Excessive drag.", "b": "Excessive lift.", "c": "'Nose heavy' aircraft.", "d": "Damage of the flaps."}, {"id": 119, "question": "That portion of the runway identified by the letter A may be used for: (see Fig. PPL OP-1)", "correct": "a", "a": "Taxiing and takeoff.", "b": "Landing.", "c": "Taxiing and landing.", "d": "All operations."}, {"id": 120, "question": "According to the airport diagram, which statement is true? (see Fig. PPL OP-1)", "correct": "a", "a": "Takeoffs may be started at position A on Runway 12, and the landing portion of this runway begins at position B.", "b": "Runway 30 is equipped at position E with emergency arresting gear to provide means of stopping military aircraft.", "c": "The takeoff and landing portion of Runway 12 begins at position B.", "d": "Position D marks the runway threshold."}, {"id": 121, "question": "When approaching taxiway holding lines from the side with the continuous lines, the pilot:", "correct": "a", "a": "Should not cross the lines without ATC clearance.", "b": "May continue taxiing.", "c": "Should continue taxiing until all parts of the aircraft have crossed the lines.", "d": "Should stop and request taxi instructions."}, {"id": 122, "question": "What is the purpose of the runway/runway hold position sign?", "correct": "a", "a": "Denotes intersecting runways.", "b": "Denotes entrance to runway from a taxiway.", "c": "Denotes area protected for an aircraft approaching or departing a runway.", "d": "Denotes the runway threshold."}, {"id": 123, "question": "What is the difference between area A and area E on the airport depicted? (see Fig. PPL OP-1)", "correct": "a", "a": "'A' may be used for taxi and takeoff; 'E' may be used only as an overrun.", "b": "'A' may be used for all operations except heavy aircraft landing; 'E' may be used only as an overrun.", "c": "'A' may be used only for taxiing; 'E' may be used for all operations except landings.", "d": "Both areas have identical usage restrictions."}, {"id": 124, "question": "Area C on the airport depicted is classified as a: (see Fig. PPL OP-1)", "correct": "a", "a": "Closed runway.", "b": "Stabilized area.", "c": "Multiple heliport.", "d": "Displaced threshold."}, {"id": 125, "question": "The arrows that appear on the end of the north/south runway indicate that the area: (see Fig. PPL OP-2)", "correct": "a", "a": "Cannot be used for landing, but may be used for taxiing and takeoff.", "b": "May be used only for taxiing.", "c": "Is usable for taxiing, takeoff, and landing.", "d": "Is a blast pad only."}, {"id": 126, "question": "The numbers 4 and 22 on a runway indicate that the runway is oriented approximately: (see Fig. PPL OP-2)", "correct": "a", "a": "040\u00b0 and 220\u00b0 (magnetic).", "b": "004\u00b0 and 022\u00b0 (true).", "c": "040\u00b0 and 220\u00b0 (true).", "d": "400\u00b0 and 220\u00b0 (magnetic)."}, {"id": 127, "question": "Airport taxiway edge lights are identified at night by:", "correct": "a", "a": "Blue omnidirectional lights.", "b": "White directional lights.", "c": "Alternate red and green lights.", "d": "Yellow omnidirectional lights."}, {"id": 128, "question": "Which of the following describes threshold lights?", "correct": "a", "a": "Green unidirectional.", "b": "Red unidirectional.", "c": "Green omni-directional.", "d": "Red omni-directional."}, {"id": 129, "question": "Low intensity obstacle lights on fixed objects shall be:", "correct": "a", "a": "Fixed red.", "b": "Flashing yellow.", "c": "Flashing red.", "d": "Fixed orange."}, {"id": 130, "question": "VFR approaches to land at night should be accomplished:", "correct": "a", "a": "The same as during daytime.", "b": "At a higher airspeed.", "c": "With a steeper descent.", "d": "With landing lights on at all times."}, {"id": 131, "question": "Each pilot of an aircraft approaching to land on a runway served by a visual approach slope indicator (VASI) shall:", "correct": "a", "a": "Maintain an altitude at or above the glide slope.", "b": "Maintain a 3\u00b0 glide to the runway.", "c": "Stay high until the runway can be reached in a power-off landing.", "d": "Follow ATC instructions only."}, {"id": 132, "question": "When approaching to land on a runway served by a visual slope indicator (VASI), the pilot shall:", "correct": "a", "a": "Maintain an altitude at or above the glide slope.", "b": "Maintain an altitude that captures the glide slope at least 2 miles downwind from the runway threshold.", "c": "Remain on the glide slope and land between the two-light bars.", "d": "Disregard VASI if ILS is available."}, {"id": 133, "question": "A slightly high-glide-slope indication from a precision approach path indicator (PAPI) is:", "correct": "a", "a": "Three white lights and one red light.", "b": "Four white lights.", "c": "Two white lights and two red lights.", "d": "One white light and three red lights."}, {"id": 134, "question": "A below-glide-slope indication from a tri-color VASI is:", "correct": "a", "a": "Red light signal.", "b": "Pink light signal.", "c": "Green light signal.", "d": "Amber light signal."}, {"id": 135, "question": "An above-glide-slope indication from a tri-color VASI is:", "correct": "a", "a": "An amber light signal.", "b": "A white light signal.", "c": "A green light signal.", "d": "A red light signal."}, {"id": 136, "question": "An on-glide-slope indication from a tri-color VASI is:", "correct": "a", "a": "A green light signal.", "b": "A white light signal.", "c": "An amber light signal.", "d": "A red light signal."}, {"id": 137, "question": "A below-glide-slope indication from a pulsating approach slope indicator is a:", "correct": "a", "a": "Pulsating red light.", "b": "Pulsating white light.", "c": "Steady white light.", "d": "Steady red light."}, {"id": 138, "question": "Illustration A indicates that the aircraft is: (see Fig. PPL OP-3 \u2014 four red dots on left)", "correct": "a", "a": "Below the glide slope.", "b": "On the glide slope.", "c": "Above the glide slope.", "d": "Far below the glide slope."}, {"id": 139, "question": "Illustration C indicates that the aircraft is: (see Fig. PPL OP-3 \u2014 two white and two red dots)", "correct": "a", "a": "Above the glide slope.", "b": "Off course to the left.", "c": "Below the glide slope.", "d": "On the glide slope."}, {"id": 140, "question": "Illustration B indicates that the aircraft is: (see Fig. PPL OP-3 \u2014 two red and two white dots, mixed)", "correct": "a", "a": "On the glide slope.", "b": "Below the glide slope.", "c": "Above the glide slope.", "d": "Slightly below the glide slope."}, {"id": 141, "question": "On the controlled airport you noticed a square yellow board bearing a black 'C', exposed above one of the doors. What does that mean? (see Fig. PPL OP-4, Picture C)", "correct": "a", "a": "Air traffic control reporting office.", "b": "Customs office.", "c": "Exit for private aircraft crew.", "d": "Staff exit."}, {"id": 142, "question": "In the signal area of an aerodrome, a red square with a single yellow diagonal strip (Picture B) means: (see Fig. PPL OP-4)", "correct": "a", "a": "Take special care when landing because of the poor state of the manoeuvring area.", "b": "Do not land.", "c": "Gliders are operating.", "d": "Helicopters are operating."}, {"id": 143, "question": "What is the meaning of the visual ground signal in a form of a horizontal red square panel with yellow diagonals displayed in an airport signal area (Picture A)? (see Fig. PPL OP-4)", "correct": "a", "a": "Landings are prohibited.", "b": "Area unfit for movement of aircraft.", "c": "Aircraft are required to land, takeoff and taxi on runways and taxiways only.", "d": "Special precautions must be observed in approaching to land or in landing."}, {"id": 144, "question": "A white cross, placed horizontally on the beginning of the taxiway (Picture G), means: (see Fig. PPL OP-4)", "correct": "a", "a": "Taxiway unserviceable!", "b": "Caution, you are approaching the intersection with the runway!", "c": "Helicopter landing area!", "d": "Caution, you are approaching the intersection with other taxiway!"}, {"id": 145, "question": "In the signal area of an aerodrome, a double white cross (Picture H) means: (see Fig. PPL OP-4)", "correct": "a", "a": "Caution, gliders in the air!", "b": "Landing prohibited, the airport is not safe!", "c": "Take special care during approach and landing!", "d": "Ground taxiing permitted outside runway and taxiways!"}, {"id": 146, "question": "In the signal area of an aerodrome, a white dumb-bell (Picture D) means: (see Fig. PPL OP-4)", "correct": "a", "a": "Land and taxi on hard surfaces only.", "b": "Landing direction is parallel with the shafts towards the cross-arm.", "c": "Land on hard surfaces only.", "d": "Do not land."}, {"id": 147, "question": "In the signal area of an aerodrome, a white dumb-bell with black stripes on each circular portion at right angles to the shaft (Picture E) means: (see Fig. PPL OP-4)", "correct": "a", "a": "Landing, takeoff, and taxiing on runway and taxiways only, other movement on the ground is not confined to hard surfaces.", "b": "Landing prohibited for prolonged period.", "c": "Landing, takeoff, and taxiing confined to runway and taxiways only.", "d": "Caution, gliders in the air."}, {"id": 148, "question": "What marking may be displayed by day on an aerodrome to indicate unserviceability of any portion of a manoeuvring area?", "correct": "a", "a": "Crosses of single conspicuous color (preferably white) displayed horizontally.", "b": "Orange flags bordering the unserviceable area.", "c": "White and orange cones bordering the unserviceable area.", "d": "Large red squares with yellow diagonal markings displayed horizontally."}, {"id": 149, "question": "In the signal area of an aerodrome, a sign (Picture I) means: (see Fig. PPL OP-4)", "correct": "a", "a": "Right-hand traffic circuit in force.", "b": "After landing vacate the runway by right turn.", "c": "Parking site to the right.", "d": "Continue to the next airport, the runway is closed."}, {"id": 150, "question": "In the signal area of an aerodrome, a white 'T' (Picture F) means: (see Fig. PPL OP-4)", "correct": "a", "a": "Landing direction is parallel with the shafts towards the cross-arm.", "b": "Land on hard surfaces only.", "c": "Land and taxi on hard surfaces only.", "d": "Do not land."}] },
  nav: { code:"NAV", name:"Navigation", questions:[{"id": 1, "question": "What is the angle of inclination of the Earth's axis to its orbital plane?", "a": "66\u00bd\u00b0", "b": "23\u00bd\u00b0", "c": "90\u00b0", "d": "33\u00bd\u00b0", "correct": "a"}, {"id": 2, "question": "The meridian passing through Greenwich is known as?", "a": "Prime Meridian.", "b": "Main Meridian.", "c": "Equator.", "d": "Great Meridian.", "correct": "a"}, {"id": 3, "question": "A Rhumb Line is?", "a": "A regularly curved line on the Earth's surface which cuts all meridians at the same angle.", "b": "A regularly curved line on the Earth's surface which cuts all parallels of Latitude at the same angle.", "c": "A line showing True north.", "d": "A line on the surface of the Earth whose centre and radius are those of the Earth.", "correct": "a"}, {"id": 4, "question": "Variation is the angle between:", "a": "True north and Magnetic north.", "b": "True north and the nearest line of Longitude.", "c": "Magnetic north and the aircraft's Magnetic heading.", "d": "Magnetic north and the aircraft's True heading.", "correct": "a"}, {"id": 5, "question": "An Isogonal is a line joining points of:", "a": "Equal magnetic variation.", "b": "Equal magnetic deviation.", "c": "Zero magnetic variation.", "d": "Zero magnetic deviation.", "correct": "a"}, {"id": 6, "question": "Which points on the Earth's surface determine the Earth's axis?", "a": "North and south geographic pole.", "b": "North geographic pole and north magnetic pole.", "c": "North and south magnetic pole.", "d": "Equator-hemisphere.", "correct": "a"}, {"id": 7, "question": "The circumference of the Earth along the Equator is approximately", "a": "40,075 km.", "b": "21,600 NM.", "c": "30,000 NM.", "d": "24,000 km.", "correct": "a"}, {"id": 8, "question": "The Earth's diameter, when compared to the Earth's axis, is", "a": "Longer by 43 km.", "b": "Twice as much greater.", "c": "The same.", "d": "Shorter by 42 km.", "correct": "a"}, {"id": 9, "question": "Which of the following statements, regarding rotation of the Earth around the Sun, is correct? The Earth:", "a": "Encircles the Sun in one year.", "b": "Encircles the Sun one time during summer and one time during winter.", "c": "Does not circle around the Sun because it is stationary with the Sun circling around it.", "d": "Encircles the Sun in one day.", "correct": "a"}, {"id": 10, "question": "The Earth's globe rotates:", "a": "Around its axis in the direction from the west to the east.", "b": "Around so called Sun's tropic.", "c": "Together with the Sun in the direction from the east to the west.", "d": "Around its axis in the direction from the east to the west.", "correct": "a"}, {"id": 11, "question": "The orbit of the Earth is:", "a": "An ellipse with the Sun at one of the foci.", "b": "A circle with the Sun at the center.", "c": "An ellipse with the Sun at different point inside it.", "d": "A circle around which the Sun rotates.", "correct": "a"}, {"id": 12, "question": "What is the cause of the seasons?", "a": "The tilt of the Earth's axis.", "b": "Irregular movement of the Earth around the Sun.", "c": "Uneven temperatures in space.", "d": "A shape of the Earth's orbit.", "correct": "a"}, {"id": 13, "question": "The shortest distance between two points on the Earth's globe is called:", "a": "Great circle.", "b": "Lambodrome.", "c": "Rhumb line.", "d": "Small circle.", "correct": "a"}, {"id": 14, "question": "Great Circle(s) on the Earth's surface is(are):", "a": "The equator, meridians and orthodroms.", "b": "The equator only.", "c": "The equator and meridians.", "d": "The equator, meridians and parallels of latitude.", "correct": "a"}, {"id": 15, "question": "The equator is the Great Circle which plane:", "a": "Divides the Earth's globe into the north and south hemisphere.", "b": "Divides the Earth's globe into the east and west hemisphere.", "c": "Is parallel to the Earth's axis.", "d": "Passes through both geographic poles.", "correct": "a"}, {"id": 16, "question": "How many Great Circles (orthodroms) can be determined on the Earth's surface?", "a": "An infinite number.", "b": "90.", "c": "180.", "d": "360.", "correct": "a"}, {"id": 17, "question": "The Great Circle on the Earth's globe is the cross-section of the Earth's surface and the plane passing through", "a": "The center of the Earth and is tilt to the Earth's axis at any angle.", "b": "The center of the Earth and is always rectangular to the Earth's axis.", "c": "The center of the Earth and is always oblique to the Earth's axis.", "d": "Any two points on the Earth's surface; the cross-section with the Earth's surface is the shortest distance between these points.", "correct": "a"}, {"id": 18, "question": "Which of the following circles on the Earth's globe does not have the center at the Earth's center?", "a": "Small Circle.", "b": "Orthodrom.", "c": "Great Circle.", "d": "Equator.", "correct": "a"}, {"id": 19, "question": "What is the characteristic of the Rhumb Line?", "a": "It cuts meridians under constant angle.", "b": "It is the Great Circle.", "c": "It is the shortest distance between two points on the Earth's globe.", "d": "It cuts meridians under various angles.", "correct": "a"}, {"id": 20, "question": "Which circles, forming the graticule, are at the same time Great Circles and Rhumb Lines?", "a": "Meridians and equator.", "b": "Parallel of latitude only.", "c": "Meridians only.", "d": "Equator only.", "correct": "a"}, {"id": 21, "question": "The Sun travels across the sky an arc of 5\u00b0 in", "a": "20 minutes.", "b": "60 minutes.", "c": "30 minutes.", "d": "4 minutes.", "correct": "a"}, {"id": 22, "question": "What time is needed for the Sun's azimuth to change by 27 arc degrees?", "a": "108 minutes.", "b": "30 minutes.", "c": "90 minutes.", "d": "135 minutes.", "correct": "a"}, {"id": 23, "question": "The Co-ordinated Universal Time (UTC) is", "a": "The time on the longitude 0 degrees.", "b": "The Local Time.", "c": "The Zone Time.", oining points of equal magnetic variation, are called", "a": "Izogonic lines.", "b": "Agonic lines.", "c": "Izoclinic lines.", "d": "Izobars.", "correct": "a"}, {"id": 92, "question": "Lines on geographical charts joining points of a zero magnetic variation, are called", "a": "Agonic lines.", "b": "Izogonic lines.", "c": "Izoclinic lines.", "d": "Aclinic lines.", "correct": "a"}, {"id": 93, "question": "What is the magnetic variation of the area? (see Figure PPL Nav-3)", "a": "3\u00b0 E", "b": "21\u00b0 E.", "c": "50\u00b0 W.", "d": "15\u00b0 E.", "correct": "a"}, {"id": 94, "question": "When calculating magnetic direction from a given true direction, westerly variation should be", "a": "Added.", "b": "Subtracted.", "c": "Multiplicated.", "d": "Divided.", "correct": "a"}, {"id": 95, "question": "Magnetic course is calculated using the equation", "a": "True course plus/minus magnetic variation.", "b": "True heading plus/minus magnetic variation.", "c": "True course plus/minus compass deviation.", "d": "Magnetic heading plus/minus compass deviation.", "correct": "a"}, {"id": 96, "question": "Magnetic heading is", "a": "True heading plus/minus variation.", "b": "True course plus/minus variation.", "c": "True course plus/minus deviation.", "d": "Magnetic course plus/minus deviation.", "correct": "a"}, {"id": 97, "question": "Is it possible for a desired true track, true heading and actual true track to have the same value?", "a": "Yes.", "b": "No, in no case.", "c": "Yes, because these values are always equal.", "d": "This is possible only when flying in north or south direction.", "correct": "a"}, {"id": 98, "question": "Which element of the wind triangle has a null value if a magnetic heading equals compass heading?", "a": "Compass deviation.", "b": "Inclination.", "c": "Drift.", "d": "Magnetic variation.", "correct": "a"}, {"id": 99, "question": "The true heading for a flight between two points of a route is 270\u00b0 and the wind correction angle is -10\u00b0. What will be the true heading for a return flight between the same points?", "a": "100\u00b0.", "b": "090\u00b0.", "c": "180\u00b0.", "d": "110\u00b0.", "correct": "a"}, {"id": 100, "question": "Which statement is true about homing when using ADF?", "a": "Homing allows flying along curved path only, which leads to the NDB station.", "b": "Homing is a practical navigational method, usable for flying to and away from the NDB station.", "c": "Homing requires an ADF with the automatic or at least manually adjusting compass rose.", "d": "Homing keeps the aircraft on a fixed magnetic bearing to the station.", "correct": "a"}, {"id": 101, "question": "To use a VHF/DF facilities for assistance in locating an aircraft's position, the aircraft must have a", "a": "VHF transmitter and receiver.", "b": "4096-code transponder.", "c": "VOR receiver and DME.", "d": "ADF receiver.", "correct": "a"}, {"id": 102, "question": "An NDB normally transmits on which frequency band?", "a": "190 to 535 KHz.", "b": "400 to 1020 Hz.", "c": "962 to 1213 MHz.", "d": "108 to 118 MHz.", "correct": "a"}, {"id": 103, "question": "As shown by ADF A, the relative bearing TO the station is (see Figure PPL Nav-10)", "a": "240\u00b0.", "b": "030\u00b0.", "c": "210\u00b0.", "d": "060\u00b0.", "correct": "a"}, {"id": 104, "question": "As shown by ADF B, the relative bearing TO the station is (see Figure PPL Nav-10)", "a": "235\u00b0.", "b": "190\u00b0.", "c": "315\u00b0.", "d": "055\u00b0.", "correct": "a"}, {"id": 105, "question": "As shown by ADF D, the relative bearing TO the station is (see Figure PPL Nav-11)", "a": "340\u00b0.", "b": "020\u00b0.", "c": "060\u00b0.", "d": "160\u00b0.", "correct": "a"}, {"id": 106, "question": "As shown by ADF E, the relative bearing TO the station is (see Figure PPL Nav-11)", "a": "315\u00b0.", "b": "045\u00b0.", "c": "180\u00b0.", "d": "270\u00b0.", "correct": "a"}, {"id": 107, "question": "As shown by ADF F, the relative bearing TO the station is (see Figure PPL Nav-11)", "a": "090\u00b0.", "b": "180\u00b0.", "c": "270\u00b0.", "d": "000\u00b0.", "correct": "a"}, {"id": 108, "question": "As shown by ADF G, the relative bearing TO the station is (see Figure PPL Nav-11)", "a": "180\u00b0.", "b": "090\u00b0.", "c": "270\u00b0.", "d": "000\u00b0.", "correct": "a"}, {"id": 109, "question": "As shown by ADF A, the magnetic bearing TO the station is (see Figure PPL Nav-10)", "a": "210\u00b0.", "b": "030\u00b0.", "c": "180\u00b0.", "d": "240\u00b0.", "correct": "a"}, {"id": 110, "question": "If receiving ADF indication B, what magnetic heading should the aircraft be turned to fly directly to the NDB station? (see Figure PPL Nav-10)", "a": "190\u00b0.", "b": "010\u00b0.", "c": "145\u00b0.", "d": "235\u00b0.", "correct": "a"}, {"id": 111, "question": "If receiving ADF indication B, what approximate magnetic heading should the aircraft be turned to intercept the 180\u00b0 bearing TO the station? (see Figure PPL Nav-10)", "a": "220\u00b0.", "b": "040\u00b0.", "c": "160\u00b0.", "d": "010\u00b0.", "correct": "a"}, {"id": 112, "question": "If an ADF indicator in the cockpit corresponds to the figure C, the magnetic bearing FROM the station is (see Figure PPL Nav-10)", "a": "115\u00b0.", "b": "025\u00b0.", "c": "295\u00b0.", "d": "205\u00b0.", "correct": "a"}, {"id": 113, "question": "Which of the figures corresponds to an ADF indicator of an aircraft, flying TO the station with a right crosswind? (see Figure PPL Nav-10)", "a": "D.", "b": "A.", "c": "B.", "d": "C.", "correct": "a"}, {"id": 114, "question": "What is the magnetic bearing FROM the station of an aircraft with an ADF indication, depicted in figure A? (see Figure PPL Nav-10)", "a": "030\u00b0.", "b": "150\u00b0.", "c": "180\u00b0.", "d": "210\u00b0.", "correct": "a"}, {"id": 115, "question": "On a magnetic heading of 320\u00b0 and with an ADF indication as figure H, the magnetic bearing TO the station is (see Figure PPL Nav-11)", "a": "185\u00b0.", "b": "005\u00b0.", "c": "225\u00b0.", "d": "140\u00b0.", "correct": "a"}, {"id": 116, "question": "On a magnetic heading of 035\u00b0 and with an ADF indication as figure I, the magnetic bearing TO the station is (see Figure PPL Nav-11)", "a": "035\u00b0.", "b": "180\u00b0.", "c": "215\u00b0.", "d": "355\u00b0.", "correct": "a"}, {"id": 117, "question": "On a magnetic heading of 120\u00b0 and with an ADF indication as figure J, the magnetic bearing TO the station is (see Figure PPL Nav-11)", "a": "165\u00b0.", "b": "045\u00b0.", "c": "270\u00b0.", "d": "300\u00b0.", "correct": "a"}, {"id": 118, "question": "If the magnetic bearing of an aircraft TO the station is 240\u00b0, what is the magnetic heading if the ADF indicator corresponds to the figure J? (see Figure PPL Nav-11)", "a": "195\u00b0.", "b": "045\u00b0.", "c": "105\u00b0.", "d": "285\u00b0.", "correct": "a"}, {"id": 119, "question": "If the magnetic bearing of an aircraft TO the station is 030\u00b0, what is the magnetic heading if the ADF indicator corresponds to the figure K? (see Figure PPL Nav-11)", "a": "120\u00b0.", "b": "060\u00b0.", "c": "270\u00b0.", "d": "300\u00b0.", "correct": "a"}, {"id": 120, "question": "If the magnetic bearing of an aircraft TO the station is 135\u00b0, what is the magnetic heading if the ADF indicator corresponds to the figure L? (see Figure PPL Nav-11)", "a": "360\u00b0.", "b": "135\u00b0.", "c": "270\u00b0.", "d": "225\u00b0.", "correct": "a"}, {"id": 121, "question": "Choose the correct sequence of procedures in the cockpit for flying inbound to the VOR station: (a) Rotate the OBS selector knob to center the CDI needle with TO indication. (b) Check the identification signal. (c) Check for proper frequency selected. (d) Turn the aircraft into the heading, equal to the radial selected on the OBS.", "a": "c, b, a, d", "b": "b, c, a, d", "c": "d, a, b, c", "d": "a, b, c, d", "correct": "a"}, {"id": 122, "question": "VOR radials are", "a": "Magnetic directions.", "b": "Compass directions.", "c": "True directions.", "d": "Relative bearings.", "correct": "a"}, {"id": 123, "question": "An aircraft has a DME reading 120 miles from a VOR station and a CDI indication is one-fifth of a full deflection to one side. Approximately how many miles off the course centerline is the aircraft?", "a": "6.7 NM.", "b": "1.5 NM.", "c": "3.0 NM.", "d": "12 NM.", "correct": "a"}, {"id": 124, "question": "When using a VOR for navigation, station passage is indicated", "a": "By the first complete reversal of the TO-FROM indicator.", "b": "When the OFF flag appears.", "c": "When the TO-FROM flag begins to flicker.", "d": "When the first full-scale deflection of the CDI.", "correct": "a"}, {"id": 125, "question": "Which situation would result in reverse sensing of a VOR receiver?", "a": "Flying a heading that is reciprocal to the bearing selected on the OBS.", "b": "Setting the OBS to a bearing that is 90\u00b0 from the bearing on which the aircraft is located.", "c": "Failing to change the OBS from the selected inbound course to the outbound course after passing the station.", "d": "Flying directly over the VOR station.", "correct": "a"}, {"id": 126, "question": "To track outbound on the 180 radial of a VOR station, the recommended procedure is to set the OBS to", "a": "180\u00b0 and make heading corrections toward the CDI needle.", "b": "360\u00b0 and make heading corrections toward the CDI needle.", "c": "180\u00b0 and make heading corrections away from the CDI needle.", "d": "000\u00b0 and make heading corrections away from the CDI needle.", "correct": "a"}, {"id": 127, "question": "To track inbound on the 215 radial of a VOR station, the recommended procedure is to set the OBS to", "a": "035\u00b0 and make heading corrections toward the CDI needle.", "b": "215\u00b0 and make heading corrections toward the CDI needle.", "c": "215\u00b0 and make heading corrections away from the CDI needle.", "d": "035\u00b0 and make heading corrections away from the CDI needle.", "correct": "a"}, {"id": 128, "question": "With a VOR/ILS receiver set to a VOR frequency, how many degrees does full deflection of a CDI to one side represent?", "a": "10\u00b0.", "b": "5\u00b0.", "c": "20\u00b0.", "d": "15\u00b0.", "correct": "a"}, {"id": 129, "question": "An aircraft 60 miles from a VOR station has a CDI indication one-fifth deflection, this represents a course centerline deviation of approximately", "a": "2 miles.", "b": "6 miles.", "c": "1 mile.", "d": "12 miles.", "correct": "a"}, {"id": 130, "question": "Which airplane(s) correspond(s) to the VOR indicator V? (see Figure PPL Nav-12)", "a": "Airplane 2 only.", "b": "Airplane 6 only.", "c": "Airplanes 5 and 8.", "d": "Airplanes 1 and 3.", "correct": "a"}, {"id": 131, "question": "Which airplane(s) correspond(s) to the VOR indicator X? (see Figure PPL Nav-12)", "a": "Airplanes 1 and 3.", "b": "Airplanes 3 and 7.", "c": "Airplane 7 only.", "d": "Airplane 2 only.", "correct": "a"}, {"id": 132, "question": "Which airplane(s) correspond(s) to the VOR indicator U? (see Figure PPL Nav-12)", "a": "Airplane 6 only.", "b": "Airplanes 1 and 2.", "c": "Airplane 2 only.", "d": "Airplanes 5 and 8.", "correct": "a"}, {"id": 133, "question": "Which presentation of a VOR indicator corresponds to airplane 8? (see Figure PPL Nav-12)", "a": "W.", "b": "T.", "c": "V.", "d": "U.", "correct": "a"}, {"id": 134, "question": "Which presentation of a VOR indicator corresponds to airplanes 5 and 7? (see Figure PPL Nav-12)", "a": "W and Z.", "b": "T and X.", "c": "V and X.", "d": "U and W.", "correct": "a"}, {"id": 135, "question": "Which of the following statements, regarding a DME operation, is correct?", "a": "The frequency of a DME receiver in the aircraft is being adjusted automatically when we set a VOR or ILS frequency.", "b": "When flying directly above the DME facility, the pilot reads on the DME indicator in the cockpit a zero distance.", "c": "If we move the DME switch in the cockpit to HOLD, all readings are reset to zero.", "d": "DME measures horizontal distance only.", "correct": "a"}, {"id": 136, "question": "Which distance is displayed by a DME indicator?", "a": "Slant-range distance in nautical miles.", "b": "Slant-range distance in statute miles.", "c": "The distance from the aircraft to a point at the same altitude directly above the DME ground facility.", "d": "Horizontal distance in kilometres.", "correct": "a"}, {"id": 137, "question": "What is the DME reading if an aircraft is directly over a VOR/DME station at the altitude of 6,000 ft AGL?", "a": "1.", "b": "0.", "c": "1.3.", "d": "6.", "correct": "a"}, {"id": 138, "question": "The slant-range error of a DME is greatest at", "a": "Low altitudes directly over the facility.", "b": "High altitudes directly over the facility.", "c": "High altitudes and high range from the facility.", "d": "Low altitudes far from the facility.", "correct": "a"}, {"id": 139, "question": "Directions of airways on the Jeppesen radio navigational chart in Appendix are (see Figure PPL Nav-3)", "a": "Magnetic directions.", "b": "True directions.", "c": "Loksodromic directions.", "d": "Compass directions.", "correct": "a"}, {"id": 140, "question": "Waypoints data in a GPS database (with the exception of users waypoints) could be updated by", "a": "A respective software house only.", "b": "A pilot, however when in-flight only.", "c": "A pilot on ground only, when the device is stationary.", "d": "Any certified avionics technician.", "correct": "a"}, {"id": 141, "question": "A CDI deviation needle on the GPS electronic screen in the cockpit shows a deviation from the desired track in", "a": "Distance units.", "b": "Arc degrees.", "c": "Arc degrees or distance units, depends on pilot's discretion.", "d": "Percentage of track width.", "correct": "a"}, {"id": 142, "question": "Similarly to a VOR, the accuracy of a GPS in great extent depends on the distance to the point selected. This statement is", "a": "False.", "b": "True.", "c": "True, but only beyond 100 NM.", "d": "True, but only at low altitudes.", "correct": "a"}, {"id": 143, "question": "A GPS leads an aircraft on route along", "a": "Great circle.", "b": "Passive curve.", "c": "Heading line.", "d": "Rhumb line.", "correct": "a"}, {"id": 144, "question": "Which directions are normally selected when setting a GPS?", "a": "Magnetic directions.", "b": "True directions.", "c": "Compass directions.", "d": "Grid directions.", "correct": "a"}, {"id": 145, "question": "A GPS signal reception in great extent depends on the aircraft's altitude. This statement is", "a": "True.", "b": "False.", "c": "True, but only above FL100.", "d": "True, but only below 1000 ft AGL.", "correct": "a"}, {"id": 146, "question": "When working with a GPS one must know that", "a": "The device automatically determines the aircraft's present position in geographic coordinates.", "b": "It is necessary to type in manually geographic coordinates of the aircraft's parking position.", "c": "The device is able to determine navigational parameters relative only to those fixes, which are in a theoretical sight of view.", "d": "The device requires manual position updates every 30 minutes.", "correct": "a"}, {"id": 147, "question": "Which map datum should be selected at GPS initialization?", "a": "WGS84.", "b": "EUROPE.", "c": "NAD83.", "d": "ED50.", "correct": "a"}, {"id": 148, "question": "Which velocity is measured in principle by every GPS instrument?", "a": "Ground Speed.", "b": "True Air Speed.", "c": "Vertical Speed.", "d": "Wind Speed.", "correct": "a"}, {"id": 149, "question": "A GPS signal may be interrupted when transmitting on VHF frequencies", "a": "121.15 MHz, 121.17 MHz and 121.20 MHz.", "b": "131.25 MHz and 131.30 MHz.", "c": "Both answers are correct.", "d": "Neither answer is correct.", "correct": "a"}, {"id": 150, "question": "In a RNAV mode, the lateral deflection of the CDI indicates", "a": "Nautical miles left or right of course.", "b": "Degrees left or right of course.", "c": "Statute miles left or right of course.", "d": "Kilometres left or right of course.", "correct": "a"}] },
  met: { code:"MET", name:"Meteorology", questions:[{"id": 1, "question": "Below the tropopause, the ICAO Standard Atmosphere (ISA) assumes?", "a": "A mean sea level pressure of 1013.25mb together with a mean sea level temperature of 15\u00b0C, decreasing by 1.98\u00b0C per 1000ft up to 36,090ft.", "b": "A mean sea level pressure of 1013.25mb together with a mean sea level temperature of 15\u00b0C, decreasing at a rate of 2\u00b0C per 1000ft until it reaches -65.6\u00b0C at 36,090ft.", "c": "A surface pressure of 1013.25mb together with a sea level temperature of 15\u00b0C, decreasing at the rate of 1.98\u00b0C per 1000ft until it reaches absolute zero.", "d": "A mean sea level pressure of 1225g/m\u00b3 together with a mean sea level temperature of 15\u00b0C, decreasing at a rate of 2\u00b0C per 1000ft up to 36,090ft.", "correct": "a"}, {"id": 2, "question": "Where is most of the water vapour in the atmosphere contained?", "a": "Troposphere.", "b": "Tropopause.", "c": "Stratosphere.", "d": "Stratopause.", "correct": "a"}, {"id": 3, "question": "What are the proportions of gases in the atmosphere?", "a": "Oxygen 21%, Nitrogen 78%, other gasses 1%.", "b": "Oxygen 21%, Hydrogen 78%, other gasses 1%.", "c": "Nitrogen 78%, Argon 21%, Oxygen 1%.", "d": "Nitrogen 78%, Oxygen 21%, Hydrogen 1%.", "correct": "a"}, {"id": 4, "question": "The layer closest to the earth's surface where the majority of weather is found is called?", "a": "Troposphere.", "b": "Tropopause.", "c": "Stratosphere.", "d": "Mesosphere.", "correct": "a"}, {"id": 5, "question": "The temperature at 2000ft above mean sea level is forecast to be 5\u00b0C; compared to the ICAO Standard Atmosphere (ISA) this is:", "a": "ISA -6", "b": "IAS +6", "c": "ISA +5", "d": "IAS -6", "correct": "a"}, {"id": 6, "question": "What is the name of the instrument which gives a continuous printed reading and record of the atmospheric pressure?", "a": "Barograph.", "b": "Barometer.", "c": "Hygrometer.", "d": "Anemograph.", "correct": "a"}, {"id": 7, "question": "The pressure of the atmosphere:", "a": "Decreases at a decreasing rate as height increases.", "b": "Decreases at an increasing rate as height increases.", "c": "Decreases at a constant rate as height increases.", "d": "Decreases at a constant rate up to the Tropopause and then remains constant.", "correct": "a"}, {"id": 8, "question": "What is the significance of tightly spaced isobars?", "a": "A large pressure gradient and strong winds.", "b": "A weak pressure gradient and light winds.", "c": "A weak pressure gradient and strong winds.", "d": "A large pressure gradient and light winds.", "correct": "a"}, {"id": 9, "question": "A line drawn on a chart joining places having the same barometric pressure at the same level and at the same time is?", "a": "An isobar.", "b": "An isotherm.", "c": "An isallobar.", "d": "A contour.", "correct": "a"}, {"id": 10, "question": "Compared to ISA, what does warm air do to the distance represented by a 1 hPa change in pressure?", "a": "Increases it.", "b": "Decreases it.", "c": "Nothing.", "d": "Impossible to determine.", "correct": "a"}, {"id": 11, "question": "What is the density at sea level in the International Standard Atmosphere?", "a": "1.225 g/m\u00b3.", "b": "12.25 g/m\u00b3.", "c": "1225 g/m\u00b3.", "d": "122.5 g/m\u00b3.", "correct": "a"}, {"id": 12, "question": "Density at the surface will be low when:", "a": "Pressure is low and temperature is high.", "b": "Pressure is high and temperature is high.", "c": "Pressure is high and temperature is low.", "d": "Pressure is low and temperature is low.", "correct": "a"}, {"id": 13, "question": "Generally as altitude increases:", "a": "Temperature, pressure and density decreases.", "b": "Temperature decreases and density increases.", "c": "Temperature and pressure increase and density decreases.", "d": "Temperature decreases and pressure density increases.", "correct": "a"}, {"id": 14, "question": "What is density defined as?", "a": "Mass per unit volume.", "b": "Mass per unit area.", "c": "Weight of air per unit area.", "d": "Volume divided by mass.", "correct": "a"}, {"id": 15, "question": "Under what conditions would density be the least at any given place?", "a": "High altitude, high temperature and high humidity.", "b": "Low altitude, high temperature and high humidity.", "c": "High altitude, high temperature and low humidity.", "d": "Low altitude, low temperature and low humidity.", "correct": "a"}, {"id": 16, "question": "Consider the following statements about air density and select the one which is correct?", "a": "At any given surface temperature the air density will be greater in anticyclonic conditions than it will be when the mean sea level pressure is lower.", "b": "Because air density increases with a decrease of temperature, air density must increase with increase of height in the ISA.", "c": "Air density increases with an increase of relative humidity.", "d": "The effect of change of temperature on the air density is much greater than the effect of change of atmospheric pressure.", "correct": "a"}, {"id": 17, "question": "The diurnal variation of temperature is:", "a": "Reduced anywhere by the presence of cloud.", "b": "Greater over the sea than overland.", "c": "Less over desert areas than over temperate grassland.", "d": "Increased anywhere as wind speed increases.", "correct": "a"}, {"id": 18, "question": "If temperature remains constant with an increase in altitude there is:", "a": "An isothermal layer.", "b": "An isohypse.", "c": "An inversion.", "d": "Decreased lapse rate.", "correct": "a"}, {"id": 19, "question": "A trough of low pressure at the surface is generally associated with:", "a": "Convergence causing increased cloud and precipitation.", "b": "Divergence causing increased cloud and precipitation.", "c": "Subsidence causing increased cloud and precipitation.", "d": "Subsidence causing decreased cloud and precipitation.", "correct": "a"}, {"id": 20, "question": "During the winter months, which of the following weather conditions would most likely be produced by an anticyclone?", "a": "General subsidence with adiabatic warming, clear skies, and an inversion.", "b": "Subsidence due to surface cooling creating extensive cloud.", "c": "During the day, the surface warming would create an unstable atmosphere with extensive convective cloud.", "d": "During the night, as the land cools, there would be an increase in the vertical cloud development.", "correct": "a"}, {"id": 21, "question": "Diurnal variation of the surface temperature will:", "a": "Decrease as wind speed increases.", "b": "Be unaffected by a change of wind speed.", "c": "Increase as wind speed increases.", "d": "Be at a minimum in calm conditions.", "correct": "a"}, {"id": 22, "question": "Cloud cover will reduce surface diurnal variation of temperature because:", "a": "Incoming solar radiation is reflected back to space and terrestrial radiation is re-radiated from the cloud back to the surface layer.", "b": "Incoming solar radiation is reflected back to space and outgoing terrestrial radiation is reflected back to earth.", "c": "Incoming solar radiation is re-radiated back to space and atmospheric heating by convection will stop at the level of the cloud layer.", "d": "The cloud stops the sun's rays getting through to the earth and also reduces outgoing conduction.", "correct": "a"}, {"id": 23, "question": "An area of indeterminate pressure between two lows and two highs is called:", "a": "A col.", "b": "A trough.", "c": "A ridge.", "d": "A saddle.", "correct": "a"}, {"id": 24, "question": "The method by which energy is transferred from one body to another with which it is in contact is called:", "a": "Conduction.", "b": "Radiation.", "c": "Convection.", "d": "Latent heat.", "correct": "a"}, {"id": 25, "question": "The sun gives out _____ amounts of energy with _____ wavelengths. The earth gives out relatively _____ amounts of energy with relatively _____ wavelengths:", "a": "Large / small / small / large", "b": "Large / large / small / small.", "c": "Small / small / large / large.", "d": "Large / large / small / large.", "correct": "a"}, {"id": 26, "question": "An inversion is when:", "a": "There is an increase of temperature as height increases.", "b": "There is no horizontal gradient of temperature.", "c": "There is no change of temperature with height.", "d": "There is a decrease of temperature as height increases.", "correct": "a"}, {"id": 27, "question": "Which of the statements below best describes a COL?", "a": "An area of widely spaced isobars between two highs and two lows.", "b": "An area between two highs where the isobars are very close together.", "c": "An extension of high pressure.", "d": "An extension of low pressure.", "correct": "a"}, {"id": 28, "question": "A ridge of high pressure is generally associated with:", "a": "Subsidence of air, then divergence at the surface causing clear skies and poor visibility.", "b": "Convergence at the surface causing increased cloud and precipitation.", "c": "Divergence at the surface causing an improvement in the surface visibility.", "d": "Subsidence then divergence at the surface causing cloud to break up and more precipitation.", "correct": "a"}, {"id": 29, "question": "When flying towards a depression at a constant indicated altitude, the true altitude will be:", "a": "Lower than indicated.", "b": "Higher than indicated.", "c": "The same as indicated.", "d": "Lower than indicated at first then the same as indicated later.", "correct": "a"}, {"id": 30, "question": "When an altimeter sub scale is set to the aerodrome QFE, the altimeter reads:", "a": "Zero at the aerodrome reference point.", "b": "The elevation of the aerodrome at the aerodrome reference point.", "c": "The pressure altitude at the aerodrome reference point.", "d": "The appropriate altitude of the aircraft.", "correct": "a"}, {"id": 31, "question": "The altimeter will always read:", "a": "The vertical distance above the pressure level set in the sub scale.", "b": "With 1013 set, the altitude above MSL.", "c": "With airfield QNH set, the height above the airfield datum.", "d": "The correct flight level with regional QFE set.", "correct": "a"}, {"id": 32, "question": "An aircraft flies at a constant indicated altitude from airfield A (QNH 1009mb) to airfield B (QNH 1019mb). If the subscale is not reset from 1009, what would be expected when over airfield B?", "a": "Indicated altitude to be less than actual altitude.", "b": "Indicated altitude to be the same as actual altitude.", "c": "Indicated altitude to be more than actual altitude.", "d": "Indicated altitude may be greater or less depending on the airfield elevation.", "correct": "a"}, {"id": 33, "question": "The name given to the lowest forecast mean sea level pressure in an area is:", "a": "Regional QNH.", "b": "QFE.", "c": "QFF.", "d": "QNE.", "correct": "a"}, {"id": 34, "question": "An aircraft flies from aerodrome A (QNH 1020mb, 800ft AMSL) to aerodrome B (QNH 999mb, 500ft AMSL). If the altimeter sub scale is not changed from 1020, what is the altimeter indication on landing? (Assume 1mb = 30ft)", "a": "1,130ft.", "b": "1,430ft.", "c": "130ft.", "d": "-130ft.", "correct": "a"}, {"id": 35, "question": "You experience a constant drift to the right when flying over Europe at a constant indicated altitude. If the altimeter subscale is not updated, this will result in?", "a": "Flying at a progressively lower true altitude.", "b": "Flying at a progressively higher true altitude.", "c": "Flying at a progressively lower indicated altitude.", "d": "Flying at a progressively higher indicated altitude.", "correct": "a"}, {"id": 36, "question": "You are flying at a constant indicated altitude with QNH 1015 set and you notice the outside air temperature has been falling constantly. What can you expect to have happened to your true altitude?", "a": "Decreased.", "b": "Increased.", "c": "Remained the same.", "d": "Increased then decreased.", "correct": "a"}, {"id": 37, "question": "The instrument used for measuring the humidity of air is a:", "a": "Hygrometer.", "b": "Hydrometer.", "c": "Wet bulb thermometer.", "d": "Hygroscope.", "correct": "a"}, {"id": 38, "question": "When condensation takes place, the higher the temperature the _____ the amount of latent heat _____:", "a": "Greater / released.", "b": "Lesser / released.", "c": "Greater / absorbed.", "d": "Lesser / absorbed.", "correct": "a"}, {"id": 39, "question": "Wet bulb temperature would normally be lower than dry bulb temperature because:", "a": "Evaporation causes cooling on the wet bulb thermometer.", "b": "Condensation causes a release of latent heat.", "c": "Latent heat is absorbed by the bulb thermometer.", "d": "Of condensation on the muslin wick of the bulb.", "correct": "a"}, {"id": 40, "question": "The process of change of state from a gas to a liquid is known as:", "a": "Condensation in which latent heat is released.", "b": "Evaporation in which latent heat is absorbed.", "c": "Evaporation in which latent heat is released.", "d": "Condensation in which latent heat is absorbed.", "correct": "a"}, {"id": 41, "question": "A change of state directly from a solid to a vapour or vice versa is:", "a": "Sublimation.", "b": "Insolation.", "c": "Condensation.", "d": "Evaporation.", "correct": "a"}, {"id": 42, "question": "During a night with a clear sky, surface temperature will _____, Relative Humidity will _____ and Dewpoint will _____.", "a": "Fall / Rise / Remain the same.", "b": "Fall / Rise / Rise.", "c": "Rise / Rise / Fall.", "d": "Fall / Fall / Remain the same.", "correct": "a"}, {"id": 43, "question": "Which of the processes listed below can cause air to become saturated?", "a": "Evaporation.", "b": "Melting.", "c": "Condensation.", "d": "Heating.", "correct": "a"}, {"id": 44, "question": "When receiving circuit joining information prior to an approach at a destination airfield, the pilot is warned of the presence of low level windshear. The pilot should?", "a": "Delay the approach or even consider diverting.", "b": "Use a higher than normal approach speed to counteract any loss of headwind component.", "c": "Consider the possibility of a missed approach.", "d": "Land using the normal landing technique but monitor speed carefully.", "correct": "a"}, {"id": 45, "question": "Given an atmospheric situation where the relative humidity is 60% and the ELR is less than the DALR, if air is forced to rise it will be:", "a": "Stable and will tend to regain its former position.", "b": "Unstable and will carry on rising.", "c": "Stable and will carry on rising.", "d": "Unstable and will tend to regain its former position.", "correct": "a"}, {"id": 46, "question": "The pilot of an aircraft approaching a mountain from the leeward side observes lenticular clouds. Which conditions would the pilot expect as the flight continues?", "a": "Strong down-draughts immediately before the ridge, with strong up-draughts after passing the ridge to the windward side.", "b": "Strong katabatic currents at the top of the ridge.", "c": "Strong katabatic down-draughts and turbulence after passing over the ridge.", "d": "Strong up-draughts before the ridge is passed and strong down-draughts after the ridge is passed.", "correct": "a"}, {"id": 47, "question": "The actual change of temperature with height is known as...", "a": "The environmental lapse rate.", "b": "The adiabatic lapse rate.", "c": "The temperature curve.", "d": "The tephigram.", "correct": "a"}, {"id": 48, "question": "Which of the following is true about the lowest level windshear?", "a": "It may be experienced 15 to 20 miles ahead of a fast moving thunderstorm.", "b": "It is rare where there is a strong inversion level close to the surface.", "c": "It is only found under the core of the anvil of a thunderstorm.", "d": "It is only ever found on the fringes of a microburst.", "correct": "a"}, {"id": 49, "question": "An aircraft is flying in the vicinity of a range of hills (lying north-south) across which a wind is blowing from west to east. In which situation might the aircraft encounter dangerous downdraughts?", "a": "When flying west towards the hills from the east.", "b": "When flying east towards the hills from the west.", "c": "When flying north towards the hill from the south.", "d": "When flying south towards the hill from the north.", "correct": "a"}, {"id": 50, "question": "Which of the following is true about low level windshear? (2)", "a": "It may be experienced 15 to 20 miles ahead of a fast moving thunderstorm.", "b": "It is rare where there is a strong inversion level close to the surface.", "c": "It is only found under the core of the anvil of a thunderstorm.", "d": "It is only ever found on the fringes of a microburst.", "correct": "a"}, {"id": 51, "question": "In a mountain wave situation, the worst of the turbulence is most likely to be found when flying:", "a": "In or just below the roll cloud.", "b": "At about mid-height between the lenticular and roll cloud.", "c": "In the cap cloud.", "d": "In the lenticular cloud.", "correct": "a"}, {"id": 52, "question": "Which of the following characterises unstable air?", "a": "Cumulus cloud with showers and generally good visibility outside of the showers.", "b": "Layered cloud with showers and generally poor visibility.", "c": "Layered cloud with poor visibility and intermittent drizzle.", "d": "Cumulus cloud with continuous precipitation and moderate visibility.", "correct": "a"}, {"id": 53, "question": "A light aircraft flying at low level near a mountain range across which a strong wind is blowing may expect: 1. Severe turbulence below or within any rotor zone. 2. Down-draughts which may exceed the climb rate of the aircraft. 3. A greater than normal risk of icing in the cloud over the crest mountain. 4. Lenticular cloud.", "a": "1, 2, 3 and 4 are correct.", "b": "Only 1 and 3 are correct.", "c": "Only 1 and 2 are correct.", "d": "Only 1, 2 and 4 are co
